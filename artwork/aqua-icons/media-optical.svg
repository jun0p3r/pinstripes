<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sampled 10.2 Iridescent Polycarbonate Optical CD/DVD Disc (HIG Fig. 11-18 bottom / i-018.png) -->
    <filter id="discShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="rainbowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>

    <!-- Brushed platinum-silver reflective aluminium data layer -->
    <linearGradient id="silverDisc" x1="18" y1="18" x2="110" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#dcdfe6"/>
      <stop offset="0.28" stop-color="#f7f8fb"/>
      <stop offset="0.50" stop-color="#c4c8d2"/>
      <stop offset="0.74" stop-color="#f5f6fa"/>
      <stop offset="1.00" stop-color="#b8bcc6"/>
    </linearGradient>

    <!-- Clear polycarbonate center clamping hub -->
    <radialGradient id="clearHub" cx="64" cy="61" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0.40" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.72" stop-color="#dfe3ec" stop-opacity="0.78"/>
      <stop offset="0.90" stop-color="#b4bac6" stop-opacity="0.85"/>
      <stop offset="1.00" stop-color="#8c929e" stop-opacity="0.90"/>
    </radialGradient>

    <!-- Annular disc path with true transparent spindle hole (fill-rule="evenodd"!) -->
    <path id="discRing" fill-rule="evenodd"
          d="M 64,11.5 A 49.5,49.5 0 1 1 63.99,11.5 Z
             M 64,52.5 A 8.5,8.5 0 1 0 64.01,52.5 Z"/>
    <clipPath id="clipDisc" clip-rule="evenodd">
      <path clip-rule="evenodd"
            d="M 64,11.5 A 49.5,49.5 0 1 1 63.99,11.5 Z
               M 64,52.5 A 8.5,8.5 0 1 0 64.01,52.5 Z"/>
    </clipPath>
  </defs>

  <!-- Overhead soft shadow (matching i-018.png bottom discs, with hollow center!) -->
  <path fill-rule="evenodd" transform="translate(0.8, 3.4)"
        d="M 64,12.5 A 49.0,49.0 0 1 1 63.99,12.5 Z M 64,52.5 A 8.5,8.5 0 1 0 64.01,52.5 Z"
        fill="#000000" fill-opacity="0.28" filter="url(#discShadow)"/>

  <!-- Base Metallic Silver Data Layer -->
  <use href="#discRing" fill="url(#silverDisc)"/>

  <!-- Authentic 10.2 Conical Rainbow Diffraction + Specular White Wedges (sampled i-018.png!) -->
  <g clip-path="url(#clipDisc)">
    <g filter="url(#rainbowBlur)">
      <!-- Top-left prismatic rainbow fan -->
      <polygon points="64,61 10,34 18,22" fill="#6ce6ff" fill-opacity="0.78"/>
      <polygon points="64,61 18,22 29,14" fill="#7cf29c" fill-opacity="0.76"/>
      <polygon points="64,61 29,14 40,10" fill="#fff27a" fill-opacity="0.72"/>
      <polygon points="64,61 10,48 10,34" fill="#8fa8ff" fill-opacity="0.68"/>
      <polygon points="64,61 13,58 10,48" fill="#ea8cff" fill-opacity="0.58"/>

      <!-- Symmetrical bottom-right prismatic rainbow fan -->
      <polygon points="64,61 118,88 110,100" fill="#6ce6ff" fill-opacity="0.78"/>
      <polygon points="64,61 110,100 99,108" fill="#7cf29c" fill-opacity="0.76"/>
      <polygon points="64,61 99,108 88,112" fill="#fff27a" fill-opacity="0.72"/>
      <polygon points="64,61 118,74 118,88" fill="#8fa8ff" fill-opacity="0.68"/>
      <polygon points="64,61 115,64 118,74" fill="#ea8cff" fill-opacity="0.58"/>

      <!-- Blinding white specular light wedges (top-right & bottom-left, exact i-018.png!) -->
      <polygon points="64,61 68,10 108,32" fill="#ffffff" fill-opacity="0.94"/>
      <polygon points="64,61 60,112 20,90" fill="#ffffff" fill-opacity="0.94"/>

      <!-- Subtle dark pewter contrast bands separating white and rainbow -->
      <polygon points="64,61 46,10 62,10" fill="#989ca8" fill-opacity="0.48"/>
      <polygon points="64,61 82,112 66,112" fill="#9094a0" fill-opacity="0.52"/>
    </g>

    <!-- Ultra-subtle concentric optical micro-grooves -->
    <circle cx="64" cy="61" r="41" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.32"/>
    <circle cx="64" cy="61" r="32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.28"/>

    <!-- Inner Clear Polycarbonate Clamping Hub & Mirror Band (r=8.5..19.5) -->
    <circle cx="64" cy="61" r="19.5" fill="url(#clearHub)" stroke="#888e9a" stroke-width="0.8"/>
    <circle cx="64" cy="61" r="15.2" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-opacity="0.78"/>
    <circle cx="64" cy="61" r="11.5" fill="none" stroke="#9ea4b0" stroke-width="0.75" stroke-opacity="0.72"/>

    <!-- Clear outer 1.2px polycarbonate rim highlight -->
    <circle cx="64" cy="61" r="48.4" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.82"/>
  </g>

  <!-- Crisp metallic outer & inner spindle edges -->
  <circle cx="64" cy="61" r="49.5" fill="none" stroke="#7d828e" stroke-width="0.85"/>
  <circle cx="64" cy="61" r="8.5" fill="none" stroke="#787d88" stroke-width="0.85"/>
</svg>
