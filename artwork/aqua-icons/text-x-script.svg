<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="sheetShadow" x="-25%" y="-20%" width="150%" height="155%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="curlShadow" x="-35%" y="-35%" width="175%" height="185%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <linearGradient id="scrollBody" x1="32" y1="18" x2="94" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#d5dae3"/>
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#f2f5fa"/>
      <stop offset="1.00" stop-color="#cfd5e2"/>
    </linearGradient>
    <linearGradient id="scrollRoll" x1="0" y1="94" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#9aa1b0"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.80" stop-color="#dfe4ee"/>
      <stop offset="1.00" stop-color="#8b92a1"/>
    </linearGradient>
    <linearGradient id="scriptGear" x1="64" y1="54" x2="92" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8ce0ff"/><stop offset="0.50" stop-color="#1e72e8"/><stop offset="1.00" stop-color="#0b3680"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="114" rx="42" ry="5.0" fill="#000000" fill-opacity="0.32" filter="url(#floorBlur)"/>

  <!-- Top-right rolled cylinder end (HIG i-004 bottom-3rd) -->
  <path d="M40,16 H98 C105,16 108,22 106,29 C104,35 98,37 92,37 H86 Z" fill="#8b92a1" stroke="#757c8a" stroke-width="0.8"/>
  <ellipse cx="98" cy="26.5" rx="7" ry="10.2" fill="#adb4c2" stroke="#757c8a" stroke-width="0.8"/>
  <ellipse cx="98" cy="26.5" rx="3.5" ry="5.2" fill="#5e6573"/>

  <!-- Main S-Curved Satin Scroll Sheet -->
  <path d="M40,16 H97 C91,16 88,23 89,33 L91,96 C91,105 86,112 79,112 H28 C35,112 38,104 37,95 L34,30 C33,21 36,16 40,16 Z" fill="url(#scrollBody)" stroke="#9da4b3" stroke-width="0.85"/>

  <!-- Readable Shell / Script Lines + Glossy Aqua Automation Cog -->
  <g font-family="Luxi Mono, DejaVu Sans Mono, monospace" font-size="6.8" font-weight="bold" fill="#184799">
    <text x="42" y="38">#!/bin/sh</text>
  </g>
  <g font-family="Luxi Mono, DejaVu Sans Mono, monospace" font-size="5.4" fill="#323a4a">
    <text x="42" y="49">set -e</text>
    <text x="42" y="58">make all</text>
    <text x="42" y="67">run --aqua</text>
  </g>
  <!-- Glossy Sapphire Automation Gear -->
  <circle cx="72" cy="76" r="13" fill="url(#scriptGear)" stroke="#0d357a" stroke-width="0.8"/>
  <circle cx="72" cy="76" r="5" fill="#ffffff"/>

  <!-- Bottom-left rolled scroll cylinder -->
  <path d="M22,95 H78 C84,95 87,100 86,106 C85,111 80,113 75,113 H22 C17,113 15,108 16,102 C17,97 19,95 22,95 Z" fill="url(#scrollRoll)" stroke="#858c9c" stroke-width="0.85"/>
  <ellipse cx="79" cy="104" rx="6.5" ry="9" fill="#b8bfce" stroke="#7c8391" stroke-width="0.8"/>
  <ellipse cx="79" cy="104" rx="3" ry="4.2" fill="#5e6573"/>
</svg>
