<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft straight-on accessory shadow (HIG Fig. 11-9 right / i-009.png) -->
    <filter id="calcShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="0.75"/>
    </filter>

    <!-- Moulded bright-white curved top cap (sampled i-009.png y=10..23) -->
    <linearGradient id="topCap" x1="64" y1="10" x2="64" y2="23.5" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f9f9fa"/>
      <stop offset="0.88" stop-color="#ececee"/>
      <stop offset="1.00" stop-color="#dcdce0"/>
    </linearGradient>

    <!-- Satin platinum lower body -->
    <linearGradient id="calcBody" x1="64" y1="24" x2="64" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f5f5f6"/>
      <stop offset="0.45" stop-color="#ededef"/>
      <stop offset="0.92" stop-color="#e3e3e6"/>
      <stop offset="0.97" stop-color="#d2d2d6"/>
      <stop offset="1.00" stop-color="#b2b2b7"/>
    </linearGradient>

    <!-- Subtle vertical brushed satin grain on lower body -->
    <pattern id="satinVert" width="4" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="12" fill="#ffffff" fill-opacity="0.24"/>
      <rect x="2" y="0" width="0.8" height="12" fill="#7a7a82" fill-opacity="0.05"/>
    </pattern>

    <!-- Recessed cool pale LCD window -->
    <linearGradient id="lcdGlass" x1="64" y1="30" x2="64" y2="45.5" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#d6dbd6"/>
      <stop offset="0.22" stop-color="#e3e7e3"/>
      <stop offset="0.85" stop-color="#eff2ef"/>
      <stop offset="1.00" stop-color="#f5f7f5"/>
    </linearGradient>

    <!-- Crisp bright-white sculpted chicklet button cap (sampled i-009.png) -->
    <linearGradient id="keyCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f8f8f9"/>
      <stop offset="0.88" stop-color="#eaeaeC"/>
      <stop offset="1.00" stop-color="#dcdce0"/>
    </linearGradient>

    <!-- Reusable standard 15 x 9.8 chicklet key -->
    <g id="stdKey">
      <rect x="0" y="0.9" width="15.0" height="9.8" rx="2.4" fill="#000000" fill-opacity="0.22" filter="url(#keyShadow)"/>
      <rect x="0" y="0" width="15.0" height="9.8" rx="2.4" fill="url(#keyCap)" stroke="#9a9aa0" stroke-width="0.7"/>
      <path d="M 1.4,8.2 L 1.4,2.2 C 1.4,1.4 2.0,1.0 2.8,1.0 L 12.2,1.0 C 13.0,1.0 13.6,1.4 13.6,2.2"
            fill="none" stroke="#ffffff" stroke-width="0.95" stroke-linecap="round"/>
    </g>

    <!-- Reusable 2-row tall `=` chicklet key (15 x 22.0) -->
    <g id="tallKey">
      <rect x="0" y="0.9" width="15.0" height="22.0" rx="2.4" fill="#000000" fill-opacity="0.22" filter="url(#keyShadow)"/>
      <rect x="0" y="0" width="15.0" height="22.0" rx="2.4" fill="url(#keyCap)" stroke="#9a9aa0" stroke-width="0.7"/>
      <path d="M 1.4,20.2 L 1.4,2.2 C 1.4,1.4 2.0,1.0 2.8,1.0 L 12.2,1.0 C 13.0,1.0 13.6,1.4 13.6,2.2"
            fill="none" stroke="#ffffff" stroke-width="0.95" stroke-linecap="round"/>
    </g>

    <clipPath id="clipCalc">
      <rect x="22.0" y="10.0" width="84.0" height="108.0" rx="4.6"/>
    </clipPath>
  </defs>

  <!-- Soft overhead drop shadow -->
  <rect x="23.0" y="13.2" width="83.0" height="106.8" rx="4.8" fill="#000000" fill-opacity="0.28" filter="url(#calcShadow)"/>

  <!-- Calculator Body -->
  <g clip-path="url(#clipCalc)">
    <!-- Lower satin platinum housing -->
    <rect x="22.0" y="23.0" width="84.0" height="95.0" fill="url(#calcBody)"/>
    <rect x="22.0" y="23.0" width="84.0" height="95.0" fill="url(#satinVert)"/>

    <!-- Moulded bright-white curved top cap -->
    <rect x="22.0" y="10.0" width="84.0" height="13.5" fill="url(#topCap)"/>
    <!-- Subtle curved pillow sheen near sides of white top cap -->
    <path d="M 22.0,10.0 L 26.5,10.0 L 26.5,23.5 L 22.0,23.5 Z" fill="#dcdce0" fill-opacity="0.35"/>
    <path d="M 101.5,10.0 L 106.0,10.0 L 106.0,23.5 L 101.5,23.5 Z" fill="#c8c8ce" fill-opacity="0.35"/>

    <!-- Horizontal seam between white cap & satin body -->
    <line x1="22.0" y1="23.4" x2="106.0" y2="23.4" stroke="#96969c" stroke-width="0.95"/>
    <line x1="22.0" y1="24.4" x2="106.0" y2="24.4" stroke="#ffffff" stroke-width="1.1"/>

    <!-- Inner specular white left/top rim highlight -->
    <path d="M 23.2,116.0 L 23.2,14.5 C 23.2,12.2 24.8,11.1 27.0,11.1 L 101.0,11.1 C 103.2,11.1 104.8,12.2 104.8,14.5 L 104.8,116.0"
          fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.88"/>
  </g>

  <!-- Crisp metallic hairline edge (no heavy dark outline) -->
  <rect x="22.0" y="10.0" width="84.0" height="108.0" rx="4.6" fill="none" stroke="#8b8b92" stroke-width="0.85"/>

  <!-- Recessed LCD Display Window (x=29..99, y=30..45.5) -->
  <rect x="29.0" y="30.0" width="70.0" height="15.5" rx="1.6" fill="url(#lcdGlass)"/>
  <!-- Inner top/left recess shadow + bottom/right white outer bezel lip -->
  <path d="M 29.5,45.0 L 29.5,30.5 L 98.5,30.5" fill="none" stroke="#8a8e8a" stroke-width="1.1"/>
  <rect x="29.8" y="30.8" width="68.4" height="1.8" fill="#b4bab4" fill-opacity="0.45"/>
  <path d="M 29.2,46.2 L 99.2,46.2 L 99.2,30.2" fill="none" stroke="#ffffff" stroke-width="1.15"/>
  <rect x="29.0" y="30.0" width="70.0" height="15.5" rx="1.6" fill="none" stroke="#8e918e" stroke-width="0.7"/>

  <!-- Crisp right-aligned LCD readout: 123456.89 (sampled i-009.png) -->
  <text x="95.8" y="41.8" text-anchor="end" font-family="Luxi Sans, Lucida Grande, DejaVu Sans, sans-serif"
        font-size="11.2" font-weight="600" letter-spacing="0.2" fill="#1e221e">123456.89</text>

  <!-- 4 x 5 Sculpted White Chicklet Keypad -->
  <!-- Columns: x = 29.0, 47.3, 65.7, 84.0 | Rows: y = 51.2, 63.4, 75.6, 87.8, 100.0 -->
  <g>
    <!-- Row 1: C  %  /  * -->
    <use href="#stdKey" x="29.0" y="51.2"/>
    <use href="#stdKey" x="47.3" y="51.2"/>
    <use href="#stdKey" x="65.7" y="51.2"/>
    <use href="#stdKey" x="84.0" y="51.2"/>

    <!-- Row 2: 7  8  9  - -->
    <use href="#stdKey" x="29.0" y="63.4"/>
    <use href="#stdKey" x="47.3" y="63.4"/>
    <use href="#stdKey" x="65.7" y="63.4"/>
    <use href="#stdKey" x="84.0" y="63.4"/>

    <!-- Row 3: 4  5  6  + -->
    <use href="#stdKey" x="29.0" y="75.6"/>
    <use href="#stdKey" x="47.3" y="75.6"/>
    <use href="#stdKey" x="65.7" y="75.6"/>
    <use href="#stdKey" x="84.0" y="75.6"/>

    <!-- Row 4: 1  2  3  and tall = -->
    <use href="#stdKey" x="29.0" y="87.8"/>
    <use href="#stdKey" x="47.3" y="87.8"/>
    <use href="#stdKey" x="65.7" y="87.8"/>
    <use href="#tallKey" x="84.0" y="87.8"/>

    <!-- Row 5: 0  .  +- -->
    <use href="#stdKey" x="29.0" y="100.0"/>
    <use href="#stdKey" x="47.3" y="100.0"/>
    <use href="#stdKey" x="65.7" y="100.0"/>
  </g>

  <!-- Crisp dark key legends -->
  <g font-family="Luxi Sans, Lucida Grande, DejaVu Sans, sans-serif" font-size="6.8" font-weight="700"
     fill="#1c1d20" text-anchor="middle">
    <!-- Row 1 -->
    <text x="36.5" y="58.4">C</text>
    <text x="54.8" y="58.3" font-size="6.2">%</text>
    <text x="73.2" y="58.4">/</text>
    <text x="91.5" y="60.3" font-size="8.2">*</text>

    <!-- Row 2 -->
    <text x="36.5" y="70.6">7</text>
    <text x="54.8" y="70.6">8</text>
    <text x="73.2" y="70.6">9</text>
    <text x="91.5" y="70.4" font-size="8.0">&#x2212;</text>

    <!-- Row 3 -->
    <text x="36.5" y="82.8">4</text>
    <text x="54.8" y="82.8">5</text>
    <text x="73.2" y="82.8">6</text>
    <text x="91.5" y="82.7" font-size="7.8">+</text>

    <!-- Row 4 -->
    <text x="36.5" y="95.0">1</text>
    <text x="54.8" y="95.0">2</text>
    <text x="73.2" y="95.0">3</text>
    <!-- Tall = centered across rows 4 & 5 -->
    <text x="91.5" y="101.2" font-size="8.0">=</text>

    <!-- Row 5 -->
    <text x="36.5" y="107.2">0</text>
    <text x="54.8" y="107.2" font-size="8.2">.</text>
    <text x="73.2" y="107.0" font-size="6.8">&#x00B1;</text>
  </g>
</svg>
