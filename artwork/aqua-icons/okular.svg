<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="leatherCover" x1="12" y1="24" x2="116" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#1e498a"/>
      <stop offset="0.50" stop-color="#123163"/>
      <stop offset="1.00" stop-color="#091b3b"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="18" y1="56" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e4e8f0"/>
      <stop offset="0.72" stop-color="#fdfefe"/>
      <stop offset="0.93" stop-color="#eceff5"/>
      <stop offset="1.00" stop-color="#bec5d4"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="64" y1="56" x2="110" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#b8c0cf"/>
      <stop offset="0.08" stop-color="#eef1f7"/>
      <stop offset="0.32" stop-color="#ffffff"/>
      <stop offset="1.00" stop-color="#e3e7f0"/>
    </linearGradient>
    <linearGradient id="glassTint" x1="0" y1="48" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#9ad8ff" stop-opacity="0.24"/>
      <stop offset="1.00" stop-color="#3898ff" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="specFrame" x1="20" y1="50" x2="108" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#38404d"/>
      <stop offset="0.32" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#566070"/>
      <stop offset="0.85" stop-color="#dfe5ef"/>
      <stop offset="1.00" stop-color="#252b36"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="111.5" rx="48" ry="6.2" fill="#071126" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <rect x="20" y="106" width="88" height="4.5" rx="2" fill="#000000" fill-opacity="0.45" filter="url(#contactBlur)"/>

  <!-- Navy leather hardcover boards -->
  <path d="M13,30 L64,34 L115,30 L118,105 L64,109 L10,105 Z" fill="url(#leatherCover)" stroke="#081836" stroke-width="0.9"/>
  <!-- Stacked gilt-white paper block thickness along bottom -->
  <path d="M15,99 Q39,96 64,102 Q89,96 113,99 L114,104 Q89,101 64,107 Q39,101 14,104 Z" fill="#d8dde8" stroke="#9aa3b5" stroke-width="0.7"/>

  <!-- Curved open left & right pages -->
  <path d="M17,24 Q40,20 64,27 V102 Q40,95 15,99 Z" fill="url(#leftPage)" stroke="#aeb6c4" stroke-width="0.7"/>
  <path d="M64,27 Q88,20 111,24 L113,99 Q88,95 64,102 Z" fill="url(#rightPage)" stroke="#aeb6c4" stroke-width="0.7"/>

  <!-- Crimson silk ribbon bookmark -->
  <path d="M63,27 L66,27 L69,112 L65,108 L61,112 Z" fill="#c91c24"/>

  <!-- Readable serif book typography & mini figure -->
  <g font-family="Georgia, Liberation Serif, serif" font-size="4.3" fill="#2c3340">
    <text x="23" y="37" font-weight="bold" font-size="5.5">1. Aqua Design</text>
    <text x="23" y="45">Lucid surfaces and</text>
    <text x="23" y="51.5">crisp typography</text>
    <text x="23" y="58">make reading effortless</text>
    <text x="23" y="64.5">at every resolution.</text>
    <text x="70" y="37"> Depth and light</text>
    <text x="70" y="43.5">guide the eye across</text>
    <rect x="71" y="48" width="32" height="17" rx="1" fill="#d4ebff" stroke="#85a8cc" stroke-width="0.6"/>
    <path d="M72,64 L80,54 L87,60 L93,52 L102,64 Z" fill="#3a8ee0"/>
    <text x="70" y="73">each illustrated folio</text>
    <text x="70" y="79.5">and technical chart.</text>
  </g>

  <!-- Sculpted Chrome & Optical Glass Reading Spectacles resting across pages -->
  <g transform="rotate(-7 64 72)">
    <!-- Cast shadow of spectacles onto open pages -->
    <g transform="translate(1.5, 3.8)" fill="none" stroke="#0c1526" stroke-opacity="0.34" stroke-width="3.4" filter="url(#fineBlur)">
      <ellipse cx="43" cy="73" rx="17" ry="12.5"/>
      <ellipse cx="85" cy="73" rx="17" ry="12.5"/>
      <path d="M60,71 Q64,67 68,71"/>
    </g>
    <!-- Temple arms folding back -->
    <path d="M26,70 L36,47 M102,70 L94,47" fill="none" stroke="#454d5c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Optical magnifying lenses -->
    <ellipse cx="43" cy="73" rx="17" ry="12.5" fill="url(#glassTint)"/>
    <ellipse cx="85" cy="73" rx="17" ry="12.5" fill="url(#glassTint)"/>
    <ellipse cx="39" cy="68" rx="9" ry="4" fill="#ffffff" fill-opacity="0.55" transform="rotate(-15 39 68)"/>
    <ellipse cx="81" cy="68" rx="9" ry="4" fill="#ffffff" fill-opacity="0.55" transform="rotate(-15 81 68)"/>
    <!-- Spun-chrome rim & bridge -->
    <ellipse cx="43" cy="73" rx="17" ry="12.5" fill="none" stroke="url(#specFrame)" stroke-width="3.0"/>
    <ellipse cx="85" cy="73" rx="17" ry="12.5" fill="none" stroke="url(#specFrame)" stroke-width="3.0"/>
    <path d="M60,71 Q64,66.5 68,71" fill="none" stroke="url(#specFrame)" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
