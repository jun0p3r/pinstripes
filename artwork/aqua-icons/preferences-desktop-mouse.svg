<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 2002 Apple Pro Optical Mouse (Clear Acrylic Halo Shell + Snow-White Core + Ruby Optical Glow) -->
    <filter id="floorBlur" x="-35%" y="-45%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="rubyGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.0"/>
    </filter>

    <!-- Clear polycarbonate outer shell -->
    <linearGradient id="clearShell" x1="64" y1="22" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.50" stop-color="#dce5f2" stop-opacity="0.80"/>
      <stop offset="1.00" stop-color="#aebbd0" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Sculpted snow-white inner porcelain body -->
    <radialGradient id="whiteCore" cx="58" cy="50" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f6fb"/>
      <stop offset="0.86" stop-color="#d8dee8"/>
      <stop offset="1.00" stop-color="#b4bccb"/>
    </radialGradient>

    <linearGradient id="topDome" x1="64" y1="25" x2="64" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Overhead floor shadow + iconic 2002 Apple Pro Mouse ruby-red optical LED underglow! -->
  <ellipse cx="64" cy="111.8" rx="31" ry="6.2" fill="#040a18" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="112.5" rx="17" ry="4.0" fill="#ff1e32" fill-opacity="0.55" filter="url(#rubyGlow)"/>

  <!-- Smooth grey translucent USB cord emerging from front nose (64, 24 -> 72, 9) -->
  <path d="M 64,25 C 64,16 72,14 70,8" fill="none" stroke="#8c94a4" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 63.5,25 C 63.5,16 71.5,14 69.5,8" fill="none" stroke="#eef2f8" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Cord strain-relief collar -->
  <rect x="60.8" y="20.5" width="6.4" height="4.8" rx="1.6" fill="#cfd5e2" stroke="#7c8494" stroke-width="0.6"/>

  <!-- 1. Crystal-Clear Outer Polycarbonate Ergonomic Shell (rx=30.5, ry=44.5) -->
  <ellipse cx="64" cy="67.5" rx="30.5" ry="44.5" fill="url(#clearShell)" stroke="#7c889c" stroke-width="0.9"/>
  <ellipse cx="64" cy="67.5" rx="29.2" ry="43.2" fill="none" stroke="#ffffff" stroke-width="1.35" opacity="0.92"/>

  <!-- 2. Sculpted Snow-White Inner Body Encapsulated Inside Clear Acrylic -->
  <ellipse cx="64" cy="67.5" rx="25.5" ry="39.2" fill="url(#whiteCore)" stroke="#aeb6c6" stroke-width="0.75"/>

  <!-- Subtle internal translucent ruby optical reflection at bottom tail -->
  <ellipse cx="64" cy="102.5" rx="12.0" ry="4.5" fill="#ff3848" fill-opacity="0.36" filter="url(#rubyGlow)"/>

  <!-- Clear Acrylic Top Dome Specular Highlight -->
  <ellipse cx="64" cy="43.5" rx="21.0" ry="15.5" fill="url(#topDome)"/>
</svg>
