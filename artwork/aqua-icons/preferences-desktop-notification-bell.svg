<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 10.2 Notifications KCM: Sculpted 3D Spun-Brass/Gold Bell with Luminous Aqua Sound Waves -->
    <filter id="floorBlur" x="-30%" y="-45%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- Rich Cylindrical Spun-Gold/Brass Studio Horizon Reflection -->
    <linearGradient id="spunBrass" x1="24" y1="62" x2="104" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#5c3806"/>
      <stop offset="0.16" stop-color="#f2c654"/>
      <stop offset="0.34" stop-color="#fff9d2"/>
      <stop offset="0.46" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#9c6614"/>
      <stop offset="0.76" stop-color="#4e2e04"/>
      <stop offset="0.90" stop-color="#f5ce62"/>
      <stop offset="1.00" stop-color="#684008"/>
    </linearGradient>

    <radialGradient id="clapperBall" cx="62" cy="96" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fffbe0"/>
      <stop offset="0.45" stop-color="#d89e28"/>
      <stop offset="1.00" stop-color="#523004"/>
    </radialGradient>

    <linearGradient id="bellInterior" x1="26" y1="92" x2="102" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#2c1802"/>
      <stop offset="0.50" stop-color="#6e440c"/>
      <stop offset="1.00" stop-color="#241202"/>
    </linearGradient>
  </defs>

  <!-- Overhead floor shadow -->
  <ellipse cx="64" cy="112.5" rx="40" ry="5.8" fill="#180c00" fill-opacity="0.30" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="111.8" rx="22" ry="3.0" fill="#180c00" fill-opacity="0.45" filter="url(#contactBlur)"/>

  <!-- Luminous Translucent 10.2 Aqua Acoustic Ringing Arcs Flanking Bell -->
  <g fill="none" stroke="#3898ff" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.45" filter="url(#waveGlow)">
    <path d="M 22,42 A 36,36 0 0 0 18,68"/>
    <path d="M 14,34 A 48,48 0 0 0 9,74"/>
    <path d="M 106,42 A 36,36 0 0 1 110,68"/>
    <path d="M 114,34 A 48,48 0 0 1 119,74"/>
  </g>
  <g fill="none" stroke="#64b4ff" stroke-width="2.0" stroke-linecap="round">
    <path d="M 22,42 A 36,36 0 0 0 18,68"/>
    <path d="M 14,34 A 48,48 0 0 0 9,74" stroke-opacity="0.68"/>
    <path d="M 106,42 A 36,36 0 0 1 110,68"/>
    <path d="M 114,34 A 48,48 0 0 1 119,74" stroke-opacity="0.68"/>
  </g>

  <!-- Tilted slightly (-6 deg) as if mid-chime! -->
  <g transform="rotate(-6 64 58)">
    <!-- Top Spun-Brass Ring Finial -->
    <circle cx="64" cy="21.0" r="6.8" fill="none" stroke="url(#spunBrass)" stroke-width="3.6"/>
    <circle cx="64" cy="21.0" r="6.8" fill="none" stroke="#6e4408" stroke-width="0.65"/>

    <!-- Dark Underside Cavity & Gleaming Brass Clapper Sphere -->
    <ellipse cx="64" cy="92.0" rx="37.5" ry="7.8" fill="url(#bellInterior)" stroke="#482a04" stroke-width="0.8"/>
    <circle cx="66.0" cy="96.5" r="8.8" fill="url(#clapperBall)" stroke="#4a2c04" stroke-width="0.7"/>

    <!-- Sculpted 3D Spun-Brass Bell Dome & Flared Lip -->
    <path d="M 64.0,25.5 C 47.0,25.5 39.5,38.0 37.5,58.5 C 35.8,75.5 29.0,83.8 25.2,88.8 C 24.0,90.4 25.2,92.8 28.5,93.5 C 40.0,96.0 88.0,96.0 99.5,93.5 C 102.8,92.8 104.0,90.4 102.8,88.8 C 99.0,83.8 92.2,75.5 90.5,58.5 C 88.5,38.0 81.0,25.5 64.0,25.5 Z"
          fill="url(#spunBrass)" stroke="#623c06" stroke-width="0.85"/>

    <!-- Decorative Lathe-Turned Waist Groove & Sunlit Flared Rim Highlight -->
    <path d="M 35.2,74.5 Q 64.0,77.5 92.8,74.5" fill="none" stroke="#684008" stroke-width="1.0" opacity="0.65"/>
    <path d="M 35.0,75.6 Q 64.0,78.6 93.0,75.6" fill="none" stroke="#fffce0" stroke-width="1.0" opacity="0.82"/>
    <path d="M 26.5,90.8 Q 64.0,94.8 101.5,90.8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.90"/>
  </g>
</svg>
