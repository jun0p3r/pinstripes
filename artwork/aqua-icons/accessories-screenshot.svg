<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 10.2 Grab / Spectacle Screenshot Utility: Pinstriped Selection Crop Frame + Sapphire Camera Lens -->
    <filter id="cardShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <linearGradient id="aquaScreen" x1="22" y1="22" x2="96" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#0d388c"/>
      <stop offset="0.50" stop-color="#2878e0"/>
      <stop offset="1.00" stop-color="#8ad6ff"/>
    </linearGradient>

    <linearGradient id="lensChrome" x1="62" y1="62" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#eef0f6"/>
      <stop offset="0.55" stop-color="#9ca2b0"/>
      <stop offset="0.78" stop-color="#484c58"/>
      <stop offset="1.00" stop-color="#d0d4de"/>
    </linearGradient>

    <radialGradient id="sapphireOptic" cx="90" cy="90" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#c8f6ff"/>
      <stop offset="0.40" stop-color="#3586eb"/>
      <stop offset="0.82" stop-color="#0e2c78"/>
      <stop offset="1.00" stop-color="#051034"/>
    </radialGradient>
  </defs>

  <!-- 1. Captured Screen Region Card with Selection Marquee & Corner Crop Brackets -->
  <rect x="17.5" y="21.0" width="84.0" height="72.0" rx="3.0" fill="#000a20" fill-opacity="0.30" filter="url(#cardShadow)"/>
  <rect x="16.0" y="18.0" width="84.0" height="72.0" rx="2.5" fill="#ffffff" stroke="#8590a2" stroke-width="0.8"/>
  <rect x="21.0" y="23.0" width="74.0" height="62.0" rx="1.2" fill="url(#aquaScreen)"/>

  <!-- Dashed white selection marquee + 4 corner crop L-brackets -->
  <rect x="27.0" y="29.0" width="62.0" height="50.0" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3.2,2.4" opacity="0.88"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="square">
    <polyline points="25,36 25,27 34,27"/>
    <polyline points="82,27 91,27 91,36"/>
    <polyline points="25,72 25,81 34,81"/>
  </g>

  <!-- 2. Protruding Spun-Chrome & Sapphire-Glass Camera Objective Badge at Bottom-Right (cx=86, cy=86, r=25) -->
  <circle cx="87.5" cy="89.0" r="25.5" fill="#00081c" fill-opacity="0.38" filter="url(#cardShadow)"/>
  <circle cx="86.0" cy="86.0" r="25.0" fill="url(#lensChrome)" stroke="#484c58" stroke-width="0.85"/>
  <circle cx="86.0" cy="86.0" r="23.8" fill="none" stroke="#ffffff" stroke-width="1.15" opacity="0.88"/>
  <circle cx="86.0" cy="86.0" r="19.5" fill="#1b1e26" stroke="#9ea4b2" stroke-width="0.75"/>
  <circle cx="86.0" cy="86.0" r="15.5" fill="url(#sapphireOptic)" stroke="#081230" stroke-width="0.85"/>
  <ellipse cx="81.5" cy="79.5" rx="7.5" ry="3.8" fill="#ffffff" fill-opacity="0.72" transform="rotate(-25 81.5 79.5)"/>
</svg>
