<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 2002 Titanium PowerBook G4 Open Widescreen Notebook -->
    <filter id="floorBlur" x="-25%" y="-40%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="contactBlur" x="-15%" y="-30%" width="130%" height="170%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <filter id="auroraSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0"/>
    </filter>

    <!-- Satin anodized titanium lid & palmrest -->
    <linearGradient id="tiLid" x1="64" y1="18" x2="64" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f0f1f6"/>
      <stop offset="0.50" stop-color="#cfd2dc"/>
      <stop offset="1.00" stop-color="#aeb2be"/>
    </linearGradient>
    <linearGradient id="tiDeck" x1="64" y1="80" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e5e7ef"/>
      <stop offset="0.55" stop-color="#c8ccd6"/>
      <stop offset="0.94" stop-color="#b4b8c4"/>
      <stop offset="1.00" stop-color="#f2f4f9"/>
    </linearGradient>
    <linearGradient id="tiFrontEdge" x1="8" y1="109" x2="120" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#686c78"/>
      <stop offset="0.12" stop-color="#b8bcc8"/>
      <stop offset="0.50" stop-color="#dcdff6"/>
      <stop offset="0.88" stop-color="#b2b6c2"/>
      <stop offset="1.00" stop-color="#646874"/>
    </linearGradient>

    <linearGradient id="jaguarWall" x1="24" y1="23" x2="104" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#0b368c"/>
      <stop offset="0.45" stop-color="#1f6cd4"/>
      <stop offset="0.80" stop-color="#58aef8"/>
      <stop offset="1.00" stop-color="#a6e4ff"/>
    </linearGradient>

    <clipPath id="clipPbScreen">
      <rect x="24.0" y="23.0" width="80.0" height="52.0" rx="1.0"/>
    </clipPath>
  </defs>

  <!-- Grounded two-layer shadow -->
  <ellipse cx="64" cy="112.5" rx="56" ry="5.8" fill="#000614" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <rect x="10" y="109.5" width="108" height="3.8" rx="1.8" fill="#000614" fill-opacity="0.50" filter="url(#contactBlur)"/>

  <!-- 1. Ultra-Slim Titanium Lid (x=19..109, y=18..79.5) -->
  <rect x="19.0" y="18.0" width="90.0" height="61.5" rx="3.2" fill="url(#tiLid)" stroke="#626672" stroke-width="0.9"/>
  <path d="M 20.2,78.5 L 20.2,21.0 C 20.2,19.8 21.0,19.1 22.2,19.1 L 105.8,19.1 C 107.0,19.1 107.8,19.8 107.8,21.0 L 107.8,78.5"
        fill="none" stroke="#ffffff" stroke-width="1.15" opacity="0.88"/>
  <!-- Dark gunmetal inner bezel trim -->
  <rect x="22.4" y="21.4" width="83.2" height="55.2" rx="1.5" fill="#23262e"/>

  <!-- Vibrant 16:10 Jaguar Aqua Screen -->
  <g clip-path="url(#clipPbScreen)">
    <rect x="24.0" y="23.0" width="80.0" height="52.0" fill="url(#jaguarWall)"/>
    <g filter="url(#auroraSoft)">
      <path d="M 22,64 C 46,40 74,66 106,34 L 106,76 L 22,76 Z" fill="#70d8ff" fill-opacity="0.48"/>
      <path d="M 22,46 C 52,28 76,50 106,26" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-opacity="0.42"/>
    </g>
    <rect x="24.0" y="23.0" width="80.0" height="3.4" fill="#ffffff" fill-opacity="0.88"/>
    <rect x="44.0" y="69.4" width="40.0" height="4.2" rx="1.2" fill="#ffffff" fill-opacity="0.58"/>
    <polygon points="24.0,23.0 74.0,23.0 46.0,75.0 24.0,75.0" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- Cylindrical dark-titanium barrel hinge -->
  <rect x="28.0" y="78.2" width="72.0" height="3.2" rx="1.4" fill="#3a3e48" stroke="#1c1e24" stroke-width="0.6"/>
  <line x1="29.5" y1="79.2" x2="98.5" y2="79.2" stroke="#aeb4c2" stroke-width="0.8"/>

  <!-- 2. Foreshortened Titanium Keyboard & Palmrest Base (widening from x=19..109 to x=8.5..119.5) -->
  <!-- Front 3D thickness lip with slot-load SuperDrive & latch button -->
  <path d="M 8.5,106.5 L 119.5,106.5 L 119.0,110.2 C 118.8,111.4 117.6,112.0 115.8,112.0 L 12.2,112.0 C 10.4,112.0 9.2,111.4 9.0,110.2 Z"
        fill="url(#tiFrontEdge)" stroke="#525662" stroke-width="0.75"/>
  <!-- Front latch button + right-side slot-load SuperDrive slit -->
  <rect x="58.5" y="108.2" width="11.0" height="2.2" rx="0.9" fill="#525662" stroke="#ffffff" stroke-width="0.4"/>
  <rect x="82.0" y="108.6" width="28.0" height="1.5" rx="0.7" fill="#181a20"/>

  <!-- Top trapezoid palmrest surface -->
  <path d="M 19.2,80.5 L 108.8,80.5 L 119.5,106.8 L 8.5,106.8 Z"
        fill="url(#tiDeck)" stroke="#686c78" stroke-width="0.8"/>
  <line x1="10.2" y1="106.0" x2="117.8" y2="106.0" stroke="#ffffff" stroke-width="1.35"/>

  <!-- Recessed Translucent Charcoal-Black PowerBook G4 Keyboard Matrix (y=82.2..96.2) -->
  <polygon points="23.5,82.2 104.5,82.2 110.2,96.2 17.8,96.2" fill="#1d2026" stroke="#ffffff" stroke-width="0.55"/>
  <!-- Subtle perspective key rows & columns -->
  <g stroke="#545966" stroke-width="0.65" opacity="0.82">
    <line x1="22.2" y1="85.4" x2="105.8" y2="85.4"/>
    <line x1="20.8" y1="88.9" x2="107.2" y2="88.9"/>
    <line x1="19.4" y1="92.5" x2="108.6" y2="92.5"/>
    <line x1="32.0" y1="82.4" x2="28.5" y2="96.0"/>
    <line x1="42.5" y1="82.4" x2="40.2" y2="96.0"/>
    <line x1="53.0" y1="82.4" x2="52.0" y2="96.0"/>
    <line x1="64.0" y1="82.4" x2="64.0" y2="96.0"/>
    <line x1="75.0" y1="82.4" x2="76.0" y2="96.0"/>
    <line x1="85.5" y1="82.4" x2="87.8" y2="96.0"/>
    <line x1="96.0" y1="82.4" x2="99.5" y2="96.0"/>
  </g>

  <!-- Centered Titanium Trackpad -->
  <polygon points="51.5,98.0 76.5,98.0 78.5,104.6 49.5,104.6" fill="#bfc3ce" stroke="#787c88" stroke-width="0.65"/>
  <line x1="50.2" y1="104.8" x2="77.8" y2="104.8" stroke="#ffffff" stroke-width="0.8"/>
</svg>
