<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft overhead desk shadow + indigo Aqua caustic (modelled on Mac OS X 10.2 Jaguar iChat bubble & i-017.png) -->
    <filter id="floorShadow" x="-30%" y="-45%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="causticGlow" x="-35%" y="-45%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="clydeShadow" x="-20%" y="-20%" width="145%" height="155%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="rimSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- Plump 10.2 Jaguar Blurple-Sapphire Aqua Glass Speech Bubble Gradient -->
    <linearGradient id="blurpleAqua" x1="62" y1="15" x2="62" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#0d1354"/>
      <stop offset="0.16" stop-color="#222e9e"/>
      <stop offset="0.45" stop-color="#4756eb"/>
      <stop offset="0.74" stop-color="#6478ff"/>
      <stop offset="0.91" stop-color="#9ec6ff"/>
      <stop offset="1.00" stop-color="#e8f7ff"/>
    </linearGradient>

    <!-- Incandescent ice-blue internal bottom bounce light -->
    <radialGradient id="bubbleCaustic" cx="62" cy="96" r="44" fx="62" fy="99" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.28" stop-color="#c6e8ff" stop-opacity="0.72"/>
      <stop offset="0.65" stop-color="#6b88ff" stop-opacity="0.28"/>
      <stop offset="1.00" stop-color="#3848d8" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Deep indigo atmospheric rim vignette -->
    <radialGradient id="bubbleDepth" cx="62" cy="48" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0.60" stop-color="#141c78" stop-opacity="0.0"/>
      <stop offset="0.88" stop-color="#0e1564" stop-opacity="0.34"/>
      <stop offset="1.00" stop-color="#060a3c" stop-opacity="0.62"/>
    </radialGradient>

    <!-- Curved 10.2 Aqua top glass dome highlight -->
    <linearGradient id="topDomeLens" x1="62" y1="16.5" x2="62" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="0.36" stop-color="#e2eeff" stop-opacity="0.36"/>
      <stop offset="0.82" stop-color="#98b8ff" stop-opacity="0.06"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- 3D Sculpted Pearl-White Acrylic Clyde Mascot -->
    <linearGradient id="clydePearl" x1="62" y1="35" x2="62" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f9ff"/>
      <stop offset="0.88" stop-color="#dfe6f8"/>
      <stop offset="1.00" stop-color="#c3cef0"/>
    </linearGradient>

    <!-- Recessed Glossy Sapphire-Indigo Button Eyes -->
    <linearGradient id="clydeEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#172078"/>
      <stop offset="0.52" stop-color="#4555e8"/>
      <stop offset="0.88" stop-color="#7c96ff"/>
      <stop offset="1.00" stop-color="#bce0ff"/>
    </linearGradient>

    <!-- 10.2 iChat-inspired plump glossy speech-bubble silhouette -->
    <path id="chatBubble" d="M 62.5,16.0 C 92.5,16.0 115.0,33.8 115.0,57.2 C 115.0,70.2 107.6,81.6 95.6,89.0 C 97.6,95.4 102.2,101.2 108.0,104.8 C 97.8,105.2 88.2,101.4 81.6,95.4 C 75.6,97.4 69.2,98.4 62.5,98.4 C 32.5,98.4 10.0,80.6 10.0,57.2 C 10.0,33.8 32.5,16.0 62.5,16.0 Z"/>
    <clipPath id="clipBubble">
      <use href="#chatBubble"/>
    </clipPath>

    <!-- Exact On-Model Clyde Silhouette (measured directly from 256x256 discord.png!) -->
    <path id="clydeShape" d="M 52.6,37.8 C 47.4,38.8 42.4,40.6 38.2,42.8 C 32.6,51.2 29.5,61.2 29.8,71.8 C 34.4,75.4 40.0,78.0 46.2,79.8 C 47.6,77.9 48.9,75.8 50.0,73.6 C 47.9,72.8 45.9,71.8 44.0,70.7 C 44.5,70.3 45.0,69.9 45.5,69.5 C 56.2,74.5 68.8,74.5 79.5,69.5 C 80.0,69.9 80.5,70.3 81.0,70.7 C 79.1,71.8 77.1,72.8 75.0,73.6 C 76.1,75.8 77.4,77.9 78.8,79.8 C 85.0,78.0 90.6,75.4 95.2,71.8 C 95.6,60.2 92.0,50.2 86.8,42.8 C 82.6,40.6 77.6,38.8 72.4,37.8 L 70.6,41.4 C 65.2,40.4 59.8,40.4 54.4,41.4 Z"/>
    <clipPath id="clipClyde">
      <use href="#clydeShape"/>
    </clipPath>
  </defs>

  <!-- Soft Overhead Floor Shadow + Luminous Blurple Caustic Glow -->
  <ellipse cx="64" cy="108.8" rx="42" ry="6.0" fill="#04082c" fill-opacity="0.34" filter="url(#floorShadow)"/>
  <ellipse cx="64" cy="108.2" rx="23" ry="3.3" fill="#4f68ff" fill-opacity="0.30" filter="url(#causticGlow)"/>

  <!-- 1. Plump Translucent 10.2 Blurple-Aqua Glass Speech Bubble -->
  <use href="#chatBubble" fill="url(#blurpleAqua)"/>

  <g clip-path="url(#clipBubble)">
    <!-- Incandescent bottom Aqua bounce glow + deep atmospheric upper rim -->
    <rect x="8" y="14" width="110" height="94" fill="url(#bubbleCaustic)"/>
    <rect x="8" y="14" width="110" height="94" fill="url(#bubbleDepth)"/>

    <!-- 2. Sculpted 3D Pearl-White Clyde Mascot Inside the Glass -->
    <!-- Soft 3D cast shadow into the blurple glass -->
    <use href="#clydeShape" transform="translate(0.8, 2.8)" fill="#091052" fill-opacity="0.46" filter="url(#clydeShadow)"/>

    <!-- 3D Lower Porcelain Rim Thickness -->
    <use href="#clydeShape" transform="translate(0, 1.3)" fill="#9aaae0"/>

    <!-- Main Glossy Pearl-White Clyde Body -->
    <use href="#clydeShape" fill="url(#clydePearl)"/>

    <g clip-path="url(#clipClyde)">
      <!-- Sunlit overhead white crest highlight across Clyde's brow & shoulders -->
      <path d="M 30,43 C 45,37 80,37 95,43" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.95"/>
    </g>

    <!-- Recessed Glossy Sapphire-Glass Button Eyes (exact measured centers cx=51.6 & cx=73.4, cy=59.2) -->
    <g>
      <!-- Left eye white bottom bezel lip + recessed sapphire lens -->
      <ellipse cx="51.6" cy="59.9" rx="6.0" ry="6.7" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="51.6" cy="59.0" rx="5.8" ry="6.5" fill="url(#clydeEye)" stroke="#162078" stroke-width="0.65"/>
      <ellipse cx="50.0" cy="56.4" rx="2.2" ry="1.5" fill="#ffffff" opacity="0.72" transform="rotate(-20 50.0 56.4)"/>

      <!-- Right eye white bottom bezel lip + recessed sapphire lens -->
      <ellipse cx="73.4" cy="59.9" rx="6.0" ry="6.7" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="73.4" cy="59.0" rx="5.8" ry="6.5" fill="url(#clydeEye)" stroke="#162078" stroke-width="0.65"/>
      <ellipse cx="71.8" cy="56.4" rx="2.2" ry="1.5" fill="#ffffff" opacity="0.72" transform="rotate(-20 71.8 56.4)"/>
    </g>

    <!-- 3. Signature Mac OS X 10.2 Curved Top Aqua Glass Lens Cap Over Entire Bubble -->
    <ellipse cx="62.5" cy="33.0" rx="40.5" ry="16.5" fill="url(#topDomeLens)"/>

    <!-- Soft inner glass refraction along lower curve & bubble tail -->
    <use href="#chatBubble" fill="none" stroke="#bce4ff" stroke-width="1.8" stroke-opacity="0.46" filter="url(#rimSoft)"/>
  </g>

  <!-- Delicate sapphire-glass surface tension edge (zero cartoon outline) -->
  <use href="#chatBubble" fill="none" stroke="#1d288a" stroke-width="0.85" stroke-opacity="0.62"/>
</svg>
