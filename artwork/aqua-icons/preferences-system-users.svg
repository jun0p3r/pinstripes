<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 10.2 Users & Accounts KCM: Twin 3D Sculpted Aqua Glass & Pearl-Platinum User Figures -->
    <filter id="floorBlur" x="-30%" y="-45%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- Foreground Primary User: Translucent Sapphire-Aqua Glass Torso + Porcelain Sphere Head -->
    <linearGradient id="aquaTorso" x1="50" y1="60" x2="50" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#0a2472"/>
      <stop offset="0.30" stop-color="#2268dc"/>
      <stop offset="0.72" stop-color="#58aef8"/>
      <stop offset="1.00" stop-color="#d4f6ff"/>
    </linearGradient>
    <radialGradient id="pearlHead1" cx="46" cy="36" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f0f5fc"/>
      <stop offset="0.88" stop-color="#c6d4ea"/>
      <stop offset="1.00" stop-color="#94a8c8"/>
    </radialGradient>

    <!-- Rear Companion User: Satin Platinum-Amber Glass Torso + Porcelain Sphere Head -->
    <linearGradient id="platTorso" x1="82" y1="54" x2="82" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#384252"/>
      <stop offset="0.35" stop-color="#68768c"/>
      <stop offset="0.78" stop-color="#a2b0c4"/>
      <stop offset="1.00" stop-color="#e5ecf6"/>
    </linearGradient>
    <radialGradient id="pearlHead2" cx="79" cy="31" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef2f8"/>
      <stop offset="0.88" stop-color="#c0c8d8"/>
      <stop offset="1.00" stop-color="#8c96aa"/>
    </radialGradient>
  </defs>

  <!-- Grounded shadows -->
  <ellipse cx="64" cy="111.5" rx="48" ry="6.2" fill="#000a20" fill-opacity="0.30" filter="url(#floorBlur)"/>
  <ellipse cx="50" cy="110.5" rx="28" ry="3.4" fill="#00102c" fill-opacity="0.46" filter="url(#contactBlur)"/>

  <!-- 1. Rear Right Companion Figure (cx=82) -->
  <path d="M 56.0,96.5 C 57.5,75.0 68.2,62.5 82.0,62.5 C 95.8,62.5 106.5,75.0 108.0,96.5 C 108.3,99.8 105.8,102.0 102.2,102.0 L 61.8,102.0 C 58.2,102.0 55.7,99.8 56.0,96.5 Z"
        fill="url(#platTorso)" stroke="#485468" stroke-width="0.85"/>
  <ellipse cx="82.0" cy="72.0" rx="16.5" ry="6.2" fill="#ffffff" fill-opacity="0.48"/>
  <circle cx="82.0" cy="38.5" r="16.2" fill="url(#pearlHead2)" stroke="#687488" stroke-width="0.8"/>

  <!-- 2. Foreground Hero Sapphire-Aqua Figure (cx=50) -->
  <!-- Shadow cast by front user onto rear user -->
  <ellipse cx="66" cy="84" rx="14" ry="20" fill="#000a24" fill-opacity="0.28" filter="url(#floorBlur)"/>

  <path d="M 19.5,104.0 C 21.2,79.0 33.8,64.8 50.0,64.8 C 66.2,64.8 78.8,79.0 80.5,104.0 C 80.8,107.8 78.0,110.5 73.8,110.5 L 26.2,110.5 C 22.0,110.5 19.2,107.8 19.5,104.0 Z"
        fill="url(#aquaTorso)" stroke="#144094" stroke-width="0.9"/>
  <!-- Curved 10.2 Aqua glass specular highlight across shoulders -->
  <ellipse cx="50.0" cy="76.0" rx="19.5" ry="7.6" fill="#ffffff" fill-opacity="0.62"/>
  <path d="M 24.0,108.8 L 76.0,108.8" stroke="#d8f8ff" stroke-width="1.4" stroke-linecap="round" opacity="0.78"/>

  <!-- Sculpted 3D Pearl-Porcelain Head Sphere -->
  <circle cx="50.0" cy="43.5" r="18.8" fill="#001238" fill-opacity="0.24" transform="translate(0.5, 2.2)" filter="url(#contactBlur)"/>
  <circle cx="50.0" cy="43.0" r="18.6" fill="url(#pearlHead1)" stroke="#6c82a6" stroke-width="0.85"/>
  <ellipse cx="45.5" cy="33.5" rx="8.5" ry="4.5" fill="#ffffff" fill-opacity="0.75" transform="rotate(-18 45.5 33.5)"/>
</svg>
