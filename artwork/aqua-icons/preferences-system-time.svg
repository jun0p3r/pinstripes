<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 10.2 Date & Time KCM: Spun-Chrome Bezel Studio Clock (10:10 with Crimson Second Hand) -->
    <filter id="floorBlur" x="-30%" y="-45%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="handShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <linearGradient id="chromeRing" x1="16" y1="12" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.20" stop-color="#eef0f6"/>
      <stop offset="0.46" stop-color="#b2b6c2"/>
      <stop offset="0.66" stop-color="#646874"/>
      <stop offset="0.84" stop-color="#d4d8e2"/>
      <stop offset="1.00" stop-color="#848894"/>
    </linearGradient>

    <radialGradient id="clockDial" cx="64" cy="64" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#f7f9fc"/>
      <stop offset="0.93" stop-color="#e0e5ef"/>
      <stop offset="1.00" stop-color="#c2c9d8"/>
    </radialGradient>

    <linearGradient id="glassDome" x1="64" y1="18" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#e8f2ff" stop-opacity="0.28"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Overhead floor shadow -->
  <ellipse cx="64" cy="113.2" rx="37" ry="5.6" fill="#040814" fill-opacity="0.32" filter="url(#floorBlur)"/>

  <!-- 1. Machined Spun-Chrome Clock Case (cx=64, cy=60, r=49) -->
  <circle cx="64" cy="60" r="49.0" fill="url(#chromeRing)" stroke="#585c68" stroke-width="0.85"/>
  <path d="M 16.4,54.0 A 48.0,48.0 0 0 1 111.6,54.0" fill="none" stroke="#ffffff" stroke-width="1.35" opacity="0.92"/>
  <circle cx="64" cy="60" r="43.8" fill="#525662"/>

  <!-- 2. Recessed Crisp White Dial & 12 Bold Railway Hour Indices -->
  <circle cx="64" cy="60" r="42.4" fill="url(#clockDial)" stroke="#8890a0" stroke-width="0.8"/>
  <!-- Inner top bezel shadow on dial -->
  <path d="M 22.4,60.0 A 41.6,41.6 0 0 1 105.6,60.0" fill="none" stroke="#9ea6b8" stroke-width="1.6" stroke-opacity="0.45"/>

  <!-- 12 Hour Batons -->
  <g fill="#1c2028" transform="translate(64, 60)">
    <rect x="-1.6" y="-39.0" width="3.2" height="7.5" rx="0.6"/>
    <rect x="-1.6" y="31.5" width="3.2" height="7.5" rx="0.6"/>
    <rect x="31.5" y="-1.6" width="7.5" height="3.2" rx="0.6"/>
    <rect x="-39.0" y="-1.6" width="7.5" height="3.2" rx="0.6"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(30)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(60)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(120)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(150)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(210)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(240)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(300)"/>
    <rect x="-1.1" y="-39.0" width="2.2" height="5.5" transform="rotate(330)"/>
  </g>

  <!-- 3. Sculpted Clock Hands (10:09:32) + Soft Cast Shadow onto Dial -->
  <g transform="translate(64.8, 62.0)" opacity="0.26" filter="url(#handShadow)">
    <line x1="0" y1="4" x2="-19" y2="-12" stroke="#000000" stroke-width="4.2" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="22" y2="-22" stroke="#000000" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="-3" y1="-6" x2="8" y2="29" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <g transform="translate(64, 60)">
    <!-- Hour hand -->
    <line x1="0" y1="4" x2="-19" y2="-12" stroke="#181c24" stroke-width="4.2" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="5" x2="22" y2="-22" stroke="#181c24" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Crimson-red sweep second hand -->
    <line x1="-3.5" y1="-7.5" x2="8.5" y2="30.0" stroke="#dc242c" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.4" fill="#dc242c" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.4" fill="#ffe898"/>
  </g>

  <!-- Curved Upper Crystal Glass Reflection -->
  <ellipse cx="64" cy="34.0" rx="31.5" ry="14.5" fill="url(#glassDome)"/>
</svg>
