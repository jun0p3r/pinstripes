<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="chromeRim" x1="64" y1="11" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#dfe2e8"/>
      <stop offset="0.48" stop-color="#7a7f8a"/>
      <stop offset="0.62" stop-color="#3d4148"/>
      <stop offset="0.84" stop-color="#e5e7ec"/>
      <stop offset="1.00" stop-color="#9ca1ab"/>
    </linearGradient>
    <linearGradient id="terracottaGlass" x1="64" y1="16" x2="64" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#5c2010"/>
      <stop offset="0.18" stop-color="#9e3d22"/>
      <stop offset="0.52" stop-color="#d96b43"/>
      <stop offset="0.82" stop-color="#f29b74"/>
      <stop offset="1.00" stop-color="#ffe6d6"/>
    </linearGradient>
    <radialGradient id="peachCaustic" cx="64" cy="96" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff9f2" stop-opacity="0.95"/>
      <stop offset="0.50" stop-color="#ffb894" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#d96b43" stop-opacity="0.00"/>
    </radialGradient>
    <linearGradient id="ivorySpark" x1="64" y1="30" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#fff5eb"/>
      <stop offset="1.00" stop-color="#ffd9c2"/>
    </linearGradient>
    <linearGradient id="lensCl" x1="64" y1="17" x2="64" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <clipPath id="clClip"><circle cx="64" cy="60.5" r="43.5"/></clipPath>
    <g id="sparkShape" stroke="url(#ivorySpark)">
      <line x1="64" y1="60.5" x2="64.00" y2="31.50" stroke-width="5.2" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="76.72" y2="40.15" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="89.17" y2="48.23" stroke-width="4.8" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="88.86" y2="63.11" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="86.85" y2="78.35" stroke-width="5.0" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="71.42" y2="83.33" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="57.23" y2="87.67" stroke-width="5.0" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="47.46" y2="76.48" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="36.83" y2="67.27" stroke-width="4.8" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="42.07" y2="50.74" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="48.90" y2="38.12" stroke-width="4.8" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse cx="64" cy="112.5" rx="44" ry="6.0" fill="#1c0a04" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="110.2" rx="27" ry="3.2" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>
  <ellipse cx="64" cy="112.5" rx="20" ry="3.0" fill="#e87348" fill-opacity="0.28" filter="url(#softGlow)"/>

  <!-- Spun-chrome outer medallion bezel -->
  <circle cx="64" cy="60.5" r="48.5" fill="url(#chromeRim)" stroke="#555962" stroke-width="0.9"/>
  <circle cx="64" cy="60.5" r="45.0" fill="#3a160c"/>

  <!-- Terracotta Aqua Glass Cabochon -->
  <g clip-path="url(#clClip)">
    <circle cx="64" cy="60.5" r="43.5" fill="url(#terracottaGlass)"/>
    <circle cx="64" cy="60.5" r="43.5" fill="url(#peachCaustic)"/>
    <!-- Cast shadow of sculpted starburst -->
    <g stroke="#471608" stroke-opacity="0.48" transform="translate(1.2, 2.4)" filter="url(#fineBlur)">
      <line x1="64" y1="60.5" x2="64.00" y2="31.50" stroke-width="5.2" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="76.72" y2="40.15" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="89.17" y2="48.23" stroke-width="4.8" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="88.86" y2="63.11" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="86.85" y2="78.35" stroke-width="5.0" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="71.42" y2="83.33" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="57.23" y2="87.67" stroke-width="5.0" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="47.46" y2="76.48" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="36.83" y2="67.27" stroke-width="4.8" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="42.07" y2="50.74" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="64" y1="60.5" x2="48.90" y2="38.12" stroke-width="4.8" stroke-linecap="round"/>
    </g>
    <!-- Crisp sculpted ivory starburst -->
    <use href="#sparkShape"/>
    <circle cx="64" cy="60.5" r="6.2" fill="#ffffff"/>
    <!-- Top glass specular crescent -->
    <ellipse cx="64" cy="31" rx="32" ry="15" fill="url(#lensCl)"/>
  </g>
  <circle cx="64" cy="60.5" r="43.5" fill="none" stroke="#571f0f" stroke-width="0.85" stroke-opacity="0.65"/>
</svg>
