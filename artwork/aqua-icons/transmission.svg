<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="gearBase" x1="64" y1="60" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f7f8fc"/>
      <stop offset="0.35" stop-color="#d8dce6"/>
      <stop offset="0.85" stop-color="#a6adba"/>
      <stop offset="1.00" stop-color="#cfd4e0"/>
    </linearGradient>
    <linearGradient id="chromePost" x1="56" y1="30" x2="72" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#3a404a"/>
      <stop offset="0.30" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c4cad6"/>
      <stop offset="0.78" stop-color="#2c313a"/>
      <stop offset="1.00" stop-color="#dfe3ec"/>
    </linearGradient>
    <linearGradient id="rubyHandle" x1="64" y1="15" x2="64" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ff9ea4"/>
      <stop offset="0.28" stop-color="#e3222e"/>
      <stop offset="0.72" stop-color="#9c0d16"/>
      <stop offset="1.00" stop-color="#cf232e"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="112" rx="46" ry="6.2" fill="#0d111a" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <rect x="24" y="106.5" width="80" height="4.5" rx="2" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>

  <!-- Perspective Die-Cast Aluminum Gearbox Plate -->
  <path d="M28,64 H100 L112,102 Q113,108 106,108 H22 Q15,108 16,102 Z" fill="#7c828f" transform="translate(0, 3)"/>
  <path d="M28,64 H100 L112,102 Q113,108 106,108 H22 Q15,108 16,102 Z" fill="url(#gearBase)" stroke="#636975" stroke-width="0.9"/>
  <line x1="29" y1="65.5" x2="99" y2="65.5" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Recessed dark shift gate slot + Up/Down transfer arrows -->
  <rect x="55" y="70" width="18" height="30" rx="4" fill="#1d2129" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Sapphire Download arrow (left) & Emerald Upload arrow (right) -->
  <path d="M36,74 H43 V86 H47 L39.5,96 L32,86 H36 Z" fill="#1e74e8"/>
  <path d="M88.5,73 L96,83 H92 V95 H85 V83 H81 Z" fill="#1eb854"/>

  <!-- Vertical Spun-Chrome Gearshift Shaft -->
  <ellipse cx="64" cy="87" rx="8.5" ry="4" fill="#0f1217"/>
  <rect x="58" y="31" width="12" height="56" rx="5" fill="url(#chromePost)" stroke="#3e4450" stroke-width="0.8"/>

  <!-- Glossy Ruby-Anodized & Chrome T-Bar Handle -->
  <rect x="27" y="16" width="74" height="19" rx="9.5" fill="#000000" fill-opacity="0.28" transform="translate(0, 3)" filter="url(#softGlow)"/>
  <rect x="27" y="16" width="74" height="19" rx="9.5" fill="url(#rubyHandle)" stroke="#63080e" stroke-width="0.9"/>
  <!-- Chrome center collar & end caps -->
  <rect x="55" y="15.2" width="18" height="20.6" rx="3" fill="url(#chromePost)" stroke="#484e5c" stroke-width="0.75"/>
  <ellipse cx="64" cy="20.5" rx="28" ry="3.2" fill="#ffffff" fill-opacity="0.52"/>
</svg>
