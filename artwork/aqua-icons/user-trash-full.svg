    <line x1="22.8" y1="24" x2="35.0" y2="103" stroke="#36363e" stroke-width="1.8" stroke-opacity="0.82"/>
    <line x1="105.2" y1="24" x2="93.0" y2="103" stroke="#36363e" stroke-width="1.8" stroke-opacity="0.82"/>
    <line x1="24.2" y1="25" x2="36.2" y2="101" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.55"/>
