      <path d="M 10,23.5 Q 32,67.5 56,107.5"/>
      <path d="M 15,23.5 Q 37,67.5 61,107.5"/>
      <path d="M 20,23.5 Q 42,67.5 66,107.5"/>
      <path d="M 25,23.5 Q 47,67.5 71,107.5"/>
