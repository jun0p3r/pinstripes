<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="obsChrome" x1="20" y1="11" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#dfe3eb"/>
      <stop offset="0.46" stop-color="#7c828f"/>
      <stop offset="0.60" stop-color="#2b2f38"/>
      <stop offset="0.84" stop-color="#e5e8f0"/>
      <stop offset="1.00" stop-color="#737985"/>
    </linearGradient>
    <radialGradient id="obsidianWell" cx="64" cy="76" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#3c4454"/>
      <stop offset="0.52" stop-color="#1b1f28"/>
      <stop offset="1.00" stop-color="#090b10"/>
    </radialGradient>
    <linearGradient id="silverBlade" x1="40" y1="24" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e4e9f2"/>
      <stop offset="1.00" stop-color="#aeb6c4"/>
    </linearGradient>
    <linearGradient id="obsLens" x1="64" y1="17" x2="64" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="0.45" stop-color="#bfe0ff" stop-opacity="0.18"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <clipPath id="obsClip"><circle cx="64" cy="60.5" r="43"/></clipPath>
    <path id="obsBlade" d="M64,60.5 C53,55 46,42 52,29 C57,19 72,18 81,26 C72,24 62,30 60,40 C58,49 61,56 64,60.5 Z"/>
  </defs>
  <ellipse cx="64" cy="112.5" rx="45" ry="6.0" fill="#06080e" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="110.2" rx="28" ry="3.2" fill="#000000" fill-opacity="0.48" filter="url(#contactBlur)"/>

  <!-- Spun-chrome broadcast lens barrel -->
  <circle cx="64" cy="60.5" r="49" fill="url(#obsChrome)" stroke="#434852" stroke-width="0.9"/>
  <circle cx="64" cy="60.5" r="44.8" fill="#12151c"/>

  <!-- Deep obsidian coated optical glass & 3-blade OBS pinwheel -->
  <g clip-path="url(#obsClip)">
    <circle cx="64" cy="60.5" r="43" fill="url(#obsidianWell)"/>
    <!-- Subtle sapphire optical coating reflection -->
    <ellipse cx="74" cy="84" rx="28" ry="16" fill="#2a6be0" fill-opacity="0.22" filter="url(#softGlow)"/>
    <!-- 3-blade pinwheel shadow -->
    <g transform="translate(1.2, 2.2)" fill="#000000" fill-opacity="0.65" filter="url(#fineBlur)">
      <use href="#obsBlade"/>
      <use href="#obsBlade" transform="rotate(120 64 60.5)"/>
      <use href="#obsBlade" transform="rotate(240 64 60.5)"/>
    </g>
    <!-- 3 sculpted silver pinwheel blades -->
    <g fill="url(#silverBlade)">
      <use href="#obsBlade"/>
      <use href="#obsBlade" transform="rotate(120 64 60.5)"/>
      <use href="#obsBlade" transform="rotate(240 64 60.5)"/>
    </g>
    <!-- Red broadcast tally LED dot on upper bezel rim -->
    <circle cx="91" cy="33" r="2.6" fill="#ff3b30"/>
    <!-- Curved optical lens highlight -->
    <ellipse cx="64" cy="31" rx="32" ry="15" fill="url(#obsLens)"/>
  </g>
  <circle cx="64" cy="60.5" r="43" fill="none" stroke="#363c48" stroke-width="0.9"/>
</svg>
