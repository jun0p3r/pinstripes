<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sampled 10.2 Desktop Inkjet Printer (HIG Fig. 11-3 bottom-3rd / i-003.png) -->
    <filter id="floorBlur" x="-25%" y="-35%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="4.0"/>
    </filter>
    <filter id="pageShadow" x="-20%" y="-25%" width="140%" height="165%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- Brushed metallic silver-gunmetal side cheeks (sampled i-003.png printer:
         bright cylindrical highlight band at y=58..66, dark pewter upper/lower!) -->
    <linearGradient id="printerCheek" x1="64" y1="47" x2="64" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#585a62"/>
      <stop offset="0.16" stop-color="#9ea1aa"/>
      <stop offset="0.30" stop-color="#eff1f6"/>
      <stop offset="0.44" stop-color="#8b8e97"/>
      <stop offset="0.72" stop-color="#646770"/>
      <stop offset="0.92" stop-color="#484a52"/>
      <stop offset="1.00" stop-color="#32343a"/>
    </linearGradient>

    <!-- Glossy charcoal-black center carriage lid (sampled i-003.png: jet black + razor white cylindrical gleam!) -->
    <linearGradient id="carriageHood" x1="64" y1="46" x2="64" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#141519"/>
      <stop offset="0.28" stop-color="#2c2e35"/>
      <stop offset="0.46" stop-color="#eff2f8"/>
      <stop offset="0.56" stop-color="#525560"/>
      <stop offset="0.82" stop-color="#1e2026"/>
      <stop offset="1.00" stop-color="#363840"/>
    </linearGradient>

    <!-- Upright blank feeder paper -->
    <linearGradient id="topPaper" x1="64" y1="15" x2="64" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f2f4f8"/>
      <stop offset="1.00" stop-color="#cfd4de"/>
    </linearGradient>

    <!-- Emerging printed output page curving onto front tray -->
    <linearGradient id="outPaper" x1="64" y1="80" x2="64" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#b0b6c2"/>
      <stop offset="0.16" stop-color="#eef0f6"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1.00" stop-color="#f4f6fa"/>
    </linearGradient>

    <clipPath id="clipOutPage">
      <polygon points="34.0,81.0 94.0,81.0 100.5,114.5 27.5,114.5"/>
    </clipPath>
  </defs>

  <!-- Overhead shadows under printer body & protruding output tray -->
  <ellipse cx="64" cy="99.0" rx="53" ry="6.2" fill="#000000" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <polygon points="32,86 96,86 102,116 26,116" fill="#000000" fill-opacity="0.30" filter="url(#pageShadow)"/>

  <!-- 1. Rear Paper Support & Upright Blank White Sheet (x=33..95, y=15..50) -->
  <rect x="33.0" y="18.0" width="62.0" height="32.0" rx="1.8" fill="#a8acb6" stroke="#767a84" stroke-width="0.8"/>
  <rect x="36.0" y="15.0" width="56.0" height="34.5" rx="0.8" fill="url(#topPaper)" stroke="#b4bac6" stroke-width="0.75"/>
  <line x1="37.0" y1="16.0" x2="91.0" y2="16.0" stroke="#ffffff" stroke-width="1.1"/>

  <!-- 2. Main Sculpted Printer Chassis (x=12..116, y=47..98, exact i-003.png proportions!) -->
  <rect x="12.0" y="47.0" width="104.0" height="50.5" rx="6.5" fill="url(#printerCheek)" stroke="#2c2e34" stroke-width="0.85"/>
  <!-- Side seam grooves separating cheeks from center carriage -->
  <line x1="31.5" y1="47.5" x2="31.5" y2="97.0" stroke="#26282e" stroke-width="1.1"/>
  <line x1="96.5" y1="47.5" x2="96.5" y2="97.0" stroke="#26282e" stroke-width="1.1"/>

  <!-- Glossy Charcoal-Black Center Printhead Access Hood -->
  <path d="M 31.5,46.2 L 96.5,46.2 L 96.5,68.5 L 31.5,68.5 Z" fill="url(#carriageHood)" stroke="#121318" stroke-width="0.8"/>

  <!-- Twin Sculpted Chrome Control Buttons on Right Cheek (exact i-003.png detail!) -->
  <g>
    <circle cx="102.0" cy="65.8" r="2.8" fill="#23252b"/>
    <circle cx="102.0" cy="65.5" r="2.2" fill="#ffffff"/>
    <circle cx="102.0" cy="65.8" r="1.4" fill="#9ea2ac"/>

    <circle cx="109.2" cy="65.8" r="2.8" fill="#23252b"/>
    <circle cx="109.2" cy="65.5" r="2.2" fill="#ffffff"/>
    <circle cx="109.2" cy="65.8" r="1.4" fill="#8ad838"/>
  </g>

  <!-- Deep Recessed Front Paper Output Mouth (x=30..98, y=75..97.5) -->
  <path d="M 29.5,97.5 L 29.5,77.5 C 29.5,75.2 31.2,73.8 33.8,73.8 L 94.2,73.8 C 96.8,73.8 98.5,75.2 98.5,77.5 L 98.5,97.5 Z"
        fill="#111216" stroke="#6c707a" stroke-width="0.75"/>

  <!-- 3. Emerging Foreshortened Printed Document Sheet with Readable Text (HIG p. 206 & i-003.png!) -->
  <!-- Dark output tray rails underneath paper -->
  <polygon points="31.5,96.0 96.5,96.0 101.8,113.5 26.2,113.5" fill="#464952" stroke="#282a30" stroke-width="0.7"/>

  <g clip-path="url(#clipOutPage)">
    <polygon points="34.0,81.0 94.0,81.0 100.5,114.5 27.5,114.5" fill="url(#outPaper)"/>
    <!--Readable micro-prose printed on emerging page -->
    <g font-family="Luxi Sans, DejaVu Sans, sans-serif" font-size="3.9" fill="#3a3f4a" opacity="0.78">
      <text x="36.5" y="90.0" font-weight="700">Aqua Human Interface</text>
      <text x="35.8" y="95.2">Icons use overhead studio light,</text>
      <text x="35.0" y="100.2">rich materials, and subtle shadows</text>
      <text x="34.2" y="105.2">for clarity across every size on</text>
      <text x="33.4" y="110.2">the Pinstripe desktop.</text>
    </g>
  </g>
  <polygon points="34.0,81.0 94.0,81.0 100.5,114.5 27.5,114.5" fill="none" stroke="#aeb4c0" stroke-width="0.7"/>
</svg>
