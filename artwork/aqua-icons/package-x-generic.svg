<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="sheetShadow" x="-25%" y="-20%" width="150%" height="155%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="curlShadow" x="-35%" y="-35%" width="175%" height="185%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <linearGradient id="pkgLeft" x1="20" y1="42" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e8be7b"/><stop offset="1.00" stop-color="#ba8438"/>
    </linearGradient>
    <linearGradient id="pkgRight" x1="64" y1="42" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#cfa058"/><stop offset="1.00" stop-color="#96631e"/>
    </linearGradient>
    <linearGradient id="pkgFlap" x1="0" y1="26" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fae4b8"/><stop offset="1.00" stop-color="#d6a55c"/>
    </linearGradient>
    <radialGradient id="pkgAquaOrb" cx="64" cy="48" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#c4f2ff"/><stop offset="0.45" stop-color="#227ced"/><stop offset="1.00" stop-color="#092d78"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="112.5" rx="46" ry="6.2" fill="#1f1204" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <!-- Back interior cardboard cavity -->
  <polygon points="64,29 104,44 64,59 24,44" fill="#6e4512"/>
  <polygon points="64,29 24,44 12,33 52,18" fill="url(#pkgFlap)" stroke="#8a5a1e" stroke-width="0.8"/>
  <polygon points="64,29 104,44 116,33 76,18" fill="url(#pkgFlap)" stroke="#8a5a1e" stroke-width="0.8"/>

  <!-- Luminous 10.2 Sapphire Aqua Software Sphere nestled inside open parcel! -->
  <circle cx="64" cy="43" r="21" fill="url(#pkgAquaOrb)" stroke="#0c3480" stroke-width="0.85"/>
  <ellipse cx="64" cy="31" rx="14" ry="6.5" fill="#ffffff" fill-opacity="0.68"/>
  <!-- Downward install arrow inside orb -->
  <path d="M60.5,33 H67.5 V43 H72.5 L64,52.5 L55.5,43 H60.5 Z" fill="#ffffff"/>

  <!-- Front Left & Right Parcel Walls + Open Front Flaps -->
  <polygon points="24,44 64,59 64,109 24,91" fill="url(#pkgLeft)" stroke="#7d4f18" stroke-width="0.85"/>
  <polygon points="64,59 104,44 104,91 64,109" fill="url(#pkgRight)" stroke="#6e4312" stroke-width="0.85"/>
  <polygon points="24,44 64,59 52,73 11,57" fill="url(#pkgFlap)" stroke="#85551a" stroke-width="0.85"/>
  <polygon points="64,59 104,44 117,57 76,73" fill="url(#pkgFlap)" stroke="#85551a" stroke-width="0.85"/>
  <line x1="64" y1="59" x2="64" y2="108.5" stroke="#ffeac2" stroke-width="1.0" stroke-opacity="0.6"/>
</svg>
