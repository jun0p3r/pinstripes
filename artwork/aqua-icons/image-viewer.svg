<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sampled 10.2 Preview / Gwenview Icon: Stacked Tilted Photos + Photographer's Loupe (HIG i-006.png!) -->
    <filter id="photoShadow" x="-25%" y="-25%" width="155%" height="155%">
      <feGaussianBlur stdDeviation="3.0"/>
    </filter>
    <filter id="loupeShadow" x="-30%" y="-30%" width="165%" height="165%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>

    <linearGradient id="seaSky" x1="20" y1="30" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#3c82f2"/>
      <stop offset="0.52" stop-color="#6cb6ff"/>
      <stop offset="0.56" stop-color="#14489c"/>
      <stop offset="1.00" stop-color="#2868c8"/>
    </linearGradient>

    <linearGradient id="clearSkirt" x1="66" y1="68" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.50" stop-color="#d8e2f0" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#9aa8bc" stop-opacity="0.75"/>
    </linearGradient>

    <radialGradient id="loupeGlass" cx="84" cy="70" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#b4e4ff" stop-opacity="0.52"/>
      <stop offset="1.00" stop-color="#3a88e8" stop-opacity="0.68"/>
    </radialGradient>

    <clipPath id="clipFrontPhoto">
      <rect x="22.0" y="30.0" width="70.0" height="54.0"/>
    </clipPath>
  </defs>

  <!-- 1. Rear Warm-Stone Photo Print (-7 deg, exact i-006.png!) -->
  <g transform="rotate(-7 56 46)">
    <rect x="19.5" y="19.5" width="76.0" height="58.0" rx="0.8" fill="#000818" fill-opacity="0.28" filter="url(#photoShadow)"/>
    <rect x="18.5" y="16.5" width="76.0" height="58.0" rx="0.6" fill="#ffffff" stroke="#b4bcc8" stroke-width="0.7"/>
    <rect x="23.5" y="21.5" width="66.0" height="48.0" fill="#c89e6e"/>
    <path d="M 23.5,52 L 48,34 L 68,48 L 89.5,30 L 89.5,69.5 L 23.5,69.5 Z" fill="#8c6238"/>
  </g>

  <!-- 2. Foreground Coastal/Horizon Photo Print (-28 deg, exact i-006.png angle!) -->
  <g transform="rotate(-28 56 60)">
    <rect x="18.0" y="28.0" width="80.0" height="64.0" rx="0.8" fill="#000a20" fill-opacity="0.34" filter="url(#photoShadow)"/>
    <rect x="16.8" y="24.8" width="80.4" height="64.4" rx="0.6" fill="#ffffff" stroke="#9ea6b4" stroke-width="0.75"/>

    <g clip-path="url(#clipFrontPhoto)">
      <rect x="22.0" y="30.0" width="70.0" height="54.0" fill="url(#seaSky)"/>
      <!-- Sunlit white surf & sandy shore -->
      <circle cx="38.0" cy="42.5" r="5.5" fill="#fffbe0"/>
      <path d="M 22,68 Q 48,60 72,66 T 92,62 L 92,84 L 22,84 Z" fill="#eef6ff" fill-opacity="0.82"/>
      <path d="M 22,75 Q 52,69 92,74 L 92,84 L 22,84 Z" fill="#e5c694"/>
    </g>
  </g>

  <!-- 3. Authentic 10.2 Photographer's Clear-Skirt & Black-Anodized Optical Loupe (i-006.png bottom-right!) -->
  <!-- Cast shadow + focused white optical caustic on desk -->
  <ellipse cx="89.5" cy="91.5" rx="23.5" ry="21.0" fill="#000818" fill-opacity="0.36" filter="url(#loupeShadow)"/>
  <ellipse cx="87.5" cy="89.5" rx="13.0" ry="11.0" fill="#ffffff" fill-opacity="0.45" filter="url(#photoShadow)"/>

  <!-- Flared Translucent Clear-Acrylic Loupe Base Skirt -->
  <ellipse cx="86.5" cy="84.5" rx="22.5" ry="20.5" fill="url(#clearSkirt)" stroke="#8894a8" stroke-width="0.9"/>
  <ellipse cx="86.5" cy="84.5" rx="21.0" ry="19.0" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.9"/>

  <!-- Knurled Matte-Black Anodized Upper Loupe Barrel + Silver Inner Ring (cx=85.5, cy=72.5) -->
  <ellipse cx="85.5" cy="75.5" rx="18.5" ry="16.8" fill="#12141a"/>
  <ellipse cx="85.5" cy="70.5" rx="18.2" ry="15.8" fill="#1e2028" stroke="#484c58" stroke-width="0.8"/>
  <ellipse cx="85.5" cy="69.8" rx="14.5" ry="12.5" fill="#e5e9f2" stroke="#101216" stroke-width="0.9"/>

  <!-- Convex Refractive Glass Loupe Element -->
  <ellipse cx="85.5" cy="69.8" rx="12.2" ry="10.5" fill="url(#loupeGlass)" stroke="#2458a8" stroke-width="0.7"/>
  <ellipse cx="82.5" cy="65.5" rx="6.8" ry="3.4" fill="#ffffff" fill-opacity="0.82" transform="rotate(-18 82.5 65.5)"/>
</svg>
