<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="floorBlur" x="-30%" y="-40%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="4.8"/>
    </filter>
    <filter id="tightBlur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="1.9"/>
    </filter>
    <filter id="innerSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <linearGradient id="backLeaf" x1="20" y1="16" x2="30" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f8f9fc"/>
      <stop offset="0.16" stop-color="#dfe4ec"/>
      <stop offset="0.52" stop-color="#b0bac8"/>
      <stop offset="0.86" stop-color="#808c9e"/>
      <stop offset="1.00" stop-color="#6c788a"/>
    </linearGradient>
    <linearGradient id="backEdge" x1="16" y1="16" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#98a2b2"/>
      <stop offset="0.5" stop-color="#727e90"/>
      <stop offset="1.0" stop-color="#5a6678"/>
    </linearGradient>
    <linearGradient id="pocketShadow" x1="64" y1="28" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#283242" stop-opacity="0.0"/>
      <stop offset="0.55" stop-color="#222b3a" stop-opacity="0.24"/>
      <stop offset="1.0" stop-color="#18202c" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="innerPaper" x1="64" y1="26" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f6f8fa"/>
      <stop offset="1.0" stop-color="#dce2ea"/>
    </linearGradient>
    <linearGradient id="frontAqua" x1="36" y1="32" x2="76" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fafcff"/>
      <stop offset="0.13" stop-color="#e2e7ef"/>
      <stop offset="0.38" stop-color="#b4becd"/>
      <stop offset="0.68" stop-color="#828fa2"/>
      <stop offset="0.88" stop-color="#6e7b8e"/>
      <stop offset="1.00" stop-color="#aeb9c9"/>
    </linearGradient>
    <radialGradient id="aquaGlow" cx="62" cy="105" r="46" fx="62" fy="107" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#e4eaf2" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#b0bccb" stop-opacity="0.28"/>
      <stop offset="1.0" stop-color="#788598" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="frontGlass" x1="58" y1="32" x2="62" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.85" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="aquaStripes" width="8" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-4.2)">
      <rect width="8" height="1.1" y="0" fill="#ffffff" fill-opacity="0.19"/>
      <rect width="8" height="0.9" y="1.3" fill="#384454" fill-opacity="0.06"/>
    </pattern>

    <path id="frontShape" d="M 19.5,43.0 C 19.5,39.4 22.0,37.2 25.6,36.9 L 107.5,31.0 C 111.2,30.7 113.6,32.9 113.1,36.6 L 105.4,101.4 C 105.0,104.4 102.8,106.3 99.6,106.6 L 23.0,112.4 C 20.1,112.6 18.4,110.8 18.5,107.8 Z"/>
    <clipPath id="clipFront">
      <use href="#frontShape"/>
    </clipPath>
  </defs>

  <ellipse cx="62" cy="111" rx="49" ry="7.5" fill="#0c1018" fill-opacity="0.28" filter="url(#floorBlur)" transform="rotate(-4 62 111)"/>
  <path d="M 19,109 L 105,102.5 L 103,106.5 L 21,113 Z" fill="#0c1018" fill-opacity="0.46" filter="url(#tightBlur)"/>

  <path d="M 17.5,108.5 L 16.5,25.5 C 16.5,20.8 19.6,17.8 24.2,17.5 L 46.5,16.2 C 50.6,16.0 53.2,18.0 55.4,22.4 L 57.0,25.5 L 99.8,22.8 C 104.2,22.5 106.8,25.0 106.6,29.4 L 104.8,102.2 C 104.7,104.8 102.8,106.2 100.0,106.5 L 21.8,112.2 C 19.0,112.4 17.6,110.9 17.5,108.5 Z"
        fill="url(#backLeaf)" stroke="url(#backEdge)" stroke-width="0.9"/>
  <path d="M 18.0,26.0 C 18.0,21.8 20.6,19.1 24.6,18.9 L 46.2,17.6 C 49.8,17.4 52.0,19.0 54.1,23.2 L 55.8,26.8 L 99.6,24.1 C 102.8,23.9 104.9,25.5 105.2,28.2"
        fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" opacity="0.90"/>
  <path d="M 17.2,25.5 L 19.4,25.5 L 20.6,111.5 L 18.0,110.8 Z" fill="#ffffff" fill-opacity="0.52"/>

  <path d="M 24.5,31.5 L 99.5,26.6 L 100.2,92.0 L 24.2,98.0 Z" fill="url(#innerPaper)"/>
  <path d="M 24.5,31.5 L 99.5,26.6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 24.5,30.8 L 99.8,25.9 L 100.2,58.0 L 24.2,63.0 Z" fill="url(#pocketShadow)"/>
  <path d="M 19.5,41.0 L 109.0,34.5 L 105.0,103.0 L 19.0,109.5 Z" fill="#18202c" fill-opacity="0.22" filter="url(#tightBlur)"/>

  <use href="#frontShape" fill="url(#frontAqua)"/>

  <g clip-path="url(#clipFront)">
    <rect x="14" y="28" width="104" height="90" fill="url(#aquaStripes)"/>
    <rect x="14" y="28" width="104" height="90" fill="url(#aquaGlow)"/>
    <path d="M 16,35 L 116,29 L 114,65 C 84,59 48,64 17,74 Z" fill="url(#frontGlass)"/>
    <path d="M 18,36 L 18,113 L 106,107 L 114,30" fill="none" stroke="#3a4658" stroke-width="2.4" stroke-opacity="0.30" filter="url(#innerSoft)"/>
    <path d="M 20.5,42.0 C 21.0,39.4 23.0,38.3 26.2,38.1 L 107.2,32.2 C 110.0,32.0 111.8,33.3 111.9,35.6"
          fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" opacity="0.92"/>
  </g>

  <use href="#frontShape" fill="none" stroke="#546072" stroke-width="0.85" stroke-opacity="0.75"/>
</svg>
