<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Exact HIG Chapter 11 Energy Saver Glass Cylindrical Battery (figures-sheet.png bottom-right!) -->
    <filter id="floorBlur" x="-35%" y="-45%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="energyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- Spun-chrome battery end caps -->
    <linearGradient id="chromeCap" x1="34" y1="64" x2="94" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#686c78"/>
      <stop offset="0.16" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#aeb4c0"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#4e525c"/>
      <stop offset="1.00" stop-color="#cfd3de"/>
    </linearGradient>

    <!-- Incandescent Golden-Amber Energy Core inside Clear Glass Cylinder (sampled figures-sheet.png!) -->
    <linearGradient id="amberCharge" x1="36" y1="64" x2="92" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#c47208"/>
      <stop offset="0.24" stop-color="#ffcf38"/>
      <stop offset="0.50" stop-color="#fff9b8"/>
      <stop offset="0.76" stop-color="#f8b620"/>
      <stop offset="1.00" stop-color="#a85c04"/>
    </linearGradient>
    <radialGradient id="chargeMeniscus" cx="64" cy="48" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffeb"/>
      <stop offset="0.65" stop-color="#ffdc54"/>
      <stop offset="1.00" stop-color="#e59812"/>
    </radialGradient>

    <!-- Clear cylindrical glass wall sheen -->
    <linearGradient id="glassTube" x1="34" y1="60" x2="94" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8ea0b8" stop-opacity="0.45"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.72" stop-color="#d8e6f5" stop-opacity="0.18"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="1.00" stop-color="#6c7c94" stop-opacity="0.48"/>
    </linearGradient>

    <path id="tubeBody" d="M 35.0,26.0 L 93.0,26.0 L 93.0,103.0 C 93.0,107.8 80.0,111.5 64.0,111.5 C 48.0,111.5 35.0,107.8 35.0,103.0 Z"/>
    <clipPath id="clipTube">
      <use href="#tubeBody"/>
    </clipPath>
  </defs>

  <!-- Overhead floor shadow + warm golden energy caustic -->
  <ellipse cx="64" cy="112.2" rx="34" ry="6.2" fill="#181002" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="111.2" rx="25" ry="3.8" fill="#181002" fill-opacity="0.48" filter="url(#contactBlur)"/>
  <ellipse cx="64" cy="112.0" rx="16" ry="2.8" fill="#ffb824" fill-opacity="0.32" filter="url(#energyGlow)"/>

  <!-- 1. Clear Glass Cylinder & Glowing Golden-Amber Charge Core -->
  <g clip-path="url(#clipTube)">
    <!-- Upper empty frosted glass chamber -->
    <rect x="34" y="24" width="60" height="90" fill="#eef4fc" fill-opacity="0.65"/>

    <!-- 70% Charged Incandescent Golden-Amber Energy Column (y=48..106) -->
    <path d="M 35.0,48.0 L 93.0,48.0 L 93.0,106.0 L 35.0,106.0 Z" fill="url(#amberCharge)"/>
    <!-- Glowing top liquid meniscus ellipse -->
    <ellipse cx="64" cy="48.0" rx="28.8" ry="6.2" fill="url(#chargeMeniscus)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.75"/>

    <!-- Radial internal golden bloom -->
    <circle cx="64" cy="76" r="22" fill="#ffffff" fill-opacity="0.45" filter="url(#energyGlow)"/>

    <!-- Crisp Dark-Slate Lightning Bolt Emblem (exact i-027.png!) -->
    <polygon points="67.5,43.0 52.0,68.5 62.8,68.5 58.5,91.5 76.0,63.5 65.0,63.5"
             fill="#ffffff" transform="translate(0.8, 1.2)" opacity="0.65"/>
    <polygon points="67.5,43.0 52.0,68.5 62.8,68.5 58.5,91.5 76.0,63.5 65.0,63.5"
             fill="#262b34"/>

    <!-- Cylindrical Clear-Glass Specular Reflections Over Everything -->
    <rect x="34" y="24" width="60" height="90" fill="url(#glassTube)"/>
  </g>

  <!-- 2. Solid Spun-Chrome Bottom Collar Ring -->
  <path d="M 35.0,98.5 C 35.0,103.2 48.0,106.8 64.0,106.8 C 80.0,106.8 93.0,103.2 93.0,98.5 L 93.0,104.2 C 93.0,109.0 80.0,112.5 64.0,112.5 C 48.0,112.5 35.0,109.0 35.0,104.2 Z"
        fill="url(#chromeCap)" stroke="#525662" stroke-width="0.75"/>
  <path d="M 35.8,99.0 C 37.5,103.2 49.0,106.4 64.0,106.4 C 79.0,106.4 90.5,103.2 92.2,99.0"
        fill="none" stroke="#ffffff" stroke-width="1.05"/>

  <!-- Glass cylinder side tension lines -->
  <line x1="35.0" y1="26.0" x2="35.0" y2="104.0" stroke="#7c889a" stroke-width="0.85"/>
  <line x1="93.0" y1="26.0" x2="93.0" y2="104.0" stroke="#7c889a" stroke-width="0.85"/>

  <!-- 3. Spun-Chrome Top Cap & Raised Positive Button Terminal (y=14.5..31) -->
  <path d="M 35.0,23.5 L 93.0,23.5 L 93.0,28.2 C 93.0,32.6 80.0,36.2 64.0,36.2 C 48.0,36.2 35.0,32.6 35.0,28.2 Z"
        fill="url(#chromeCap)" stroke="#525662" stroke-width="0.75"/>
  <ellipse cx="64" cy="23.5" rx="29.0" ry="6.8" fill="#eef1f7" stroke="#5c606c" stroke-width="0.75"/>
  <!-- Raised center positive button nub -->
  <path d="M 53.5,18.2 L 74.5,18.2 L 74.5,22.8 C 74.5,24.6 69.8,26.0 64.0,26.0 C 58.2,26.0 53.5,24.6 53.5,22.8 Z"
        fill="url(#chromeCap)" stroke="#525662" stroke-width="0.7"/>
  <ellipse cx="64" cy="18.2" rx="10.5" ry="2.6" fill="#ffffff" stroke="#686d7a" stroke-width="0.65"/>
</svg>
