<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft straight-on utility shadow (HIG Fig. 11-21 / i-010.png & i-003.png) -->
    <filter id="wallShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.1"/>
    </filter>
    <filter id="promptGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <!-- Studio Display translucent acrylic base tint -->
    <linearGradient id="bezelBase" x1="64" y1="14" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#f5f6f9"/>
      <stop offset="0.85" stop-color="#eaecf0"/>
      <stop offset="0.96" stop-color="#dfe2e7"/>
      <stop offset="1.00" stop-color="#c6cad1"/>
    </linearGradient>

    <!-- Fine 2px vertical acrylic pinstripes (sampled hig_key_zooms.png) -->
    <pattern id="vertPinstripe" width="2.1" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.15" height="8" fill="#fcfdfe" fill-opacity="0.92"/>
      <rect x="1.15" y="0" width="0.95" height="8" fill="#cfd3da" fill-opacity="0.68"/>
    </pattern>

    <!-- Acrylic outer rim shading -->
    <linearGradient id="bezelBorder" x1="64" y1="14" x2="64" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#adb1b8"/>
      <stop offset="0.50" stop-color="#969aa2"/>
      <stop offset="1.00" stop-color="#757980"/>
    </linearGradient>

    <!-- Upper-left curved CRT glass sheen -->
    <linearGradient id="crtGlass" x1="24" y1="24" x2="88" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Embossed metallic-silver KDE K+cogwheel chin badge -->
    <linearGradient id="kdeChinMetal" x1="64" y1="101" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#6c7077"/>
      <stop offset="0.50" stop-color="#8b9098"/>
      <stop offset="1.00" stop-color="#a6abb3"/>
    </linearGradient>

    <!-- Authentic 10.2 Terminal monitor silhouette: generous rounded top corners, crisp square bottom corners! -->
    <path id="monitorBody" d="M 24.0,15.0 L 104.0,15.0 C 110.4,15.0 115.0,19.6 115.0,26.0 L 115.0,110.2 C 115.0,111.5 114.0,112.2 112.6,112.2 L 15.4,112.2 C 14.0,112.2 13.0,111.5 13.0,110.2 L 13.0,26.0 C 13.0,19.6 17.6,15.0 24.0,15.0 Z"/>
    <clipPath id="clipMonitor">
      <use href="#monitorBody"/>
    </clipPath>

    <clipPath id="clipScreen">
      <rect x="23.5" y="26.5" width="81.0" height="70.5" rx="1.2"/>
    </clipPath>
  </defs>

  <!-- Soft overhead wall/shelf drop shadow (shifted slightly down and faintly left per hig_key_zooms.png) -->
  <path d="M 23.0,18.0 L 103.5,18.0 C 109.8,18.0 114.2,22.5 114.2,28.8 L 114.2,114.5 L 12.0,114.5 L 12.0,28.8 C 12.0,22.5 16.6,18.0 23.0,18.0 Z"
        fill="#000000" fill-opacity="0.28" filter="url(#wallShadow)"/>

  <!-- Pinstriped Studio Display Acrylic Housing -->
  <use href="#monitorBody" fill="url(#bezelBase)"/>

  <g clip-path="url(#clipMonitor)">
    <!-- Vertical pinstripes across entire bezel -->
    <rect x="12" y="14" width="104" height="100" fill="url(#vertPinstripe)"/>

    <!-- Glossy white inner top & side acrylic specular rim -->
    <path d="M 14.2,111.0 L 14.2,26.2 C 14.2,20.5 18.4,16.3 24.2,16.3 L 103.8,16.3 C 109.6,16.3 113.8,20.5 113.8,26.2 L 113.8,111.0"
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.92"/>
    <!-- Subtle bottom thickness bevel on flat chin edge -->
    <rect x="13" y="110.2" width="102" height="2.0" fill="#9ea3ab" fill-opacity="0.55"/>
    <line x1="14" y1="110.0" x2="114" y2="110.0" stroke="#ffffff" stroke-width="0.9" opacity="0.75"/>
  </g>

  <use href="#monitorBody" fill="none" stroke="url(#bezelBorder)" stroke-width="0.9"/>

  <!-- Recessed Screen Bezel Lip (dark top inner shadow, crisp white bottom acrylic ledge) -->
  <rect x="20.5" y="23.5" width="87.0" height="76.5" rx="2.6" fill="#8a8e96"/>
  <path d="M 21.2,100.6 L 106.8,100.6" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Deep Jet-Black Inner Monitor Frame -->
  <rect x="21.2" y="24.2" width="85.6" height="75.2" rx="2.0" fill="#070709"/>

  <!-- Charcoal Glass Screen with authentic 10.2 vertical tonal bands + diagonal CRT reflection -->
  <g clip-path="url(#clipScreen)">
    <rect x="23.5" y="26.5" width="81.0" height="70.5" fill="#17181b"/>

    <!-- 5 subtle vertical stepped tonal columns sampled from 10.2 Terminal (hig_key_zooms.png) -->
    <rect x="23.5" y="26.5" width="16.2" height="70.5" fill="#313237"/>
    <rect x="39.7" y="26.5" width="16.2" height="70.5" fill="#292a2f"/>
    <rect x="55.9" y="26.5" width="16.2" height="70.5" fill="#222327"/>
    <rect x="72.1" y="26.5" width="16.2" height="70.5" fill="#1b1c20"/>
    <rect x="88.3" y="26.5" width="16.2" height="70.5" fill="#141518"/>

    <!-- Curved upper-left CRT glass reflection arc -->
    <path d="M 23.5,26.5 L 104.5,26.5 L 104.5,38.0 C 75.0,43.0 46.0,55.5 23.5,73.0 Z" fill="url(#crtGlass)"/>

    <!-- Subtle inner shadow under top black frame -->
    <rect x="23.5" y="26.5" width="81.0" height="2.4" fill="#000000" fill-opacity="0.48"/>

    <!-- Crisp luminous white `>_` command prompt at top-left -->
    <g filter="url(#promptGlow)" opacity="0.35">
      <path d="M 29.5,36.2 L 39.2,41.2 L 29.5,46.2" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="42.0" y="50.0" width="11.5" height="2.8" fill="#ffffff"/>
    </g>
    <path d="M 29.5,36.2 L 39.2,41.2 L 29.5,46.2" fill="none" stroke="#ffffff" stroke-width="2.7" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="42.0" y="50.0" width="11.5" height="2.7" fill="#d8dce2"/>
  </g>

  <!-- Miniature embossed KDE K + Cogwheel logo centered on bottom bezel (replacing Apple mark) -->
  <g transform="translate(63.5, 105.8) scale(0.185)">
    <!-- White bottom-right carved acrylic highlight -->
    <g transform="translate(0, 2.2)" fill="#ffffff" opacity="0.85">
      <path d="M -5,-22 L -11,-20 L -13,-14 C -15,-13 -16.5,-11.5 -18,-9.5 L -24,-11 L -27,-5 L -22,-1 C -22.5,1.5 -22.5,4 -22,6.5 L -27,10.5 L -24,16.5 L -18,15 C -16.5,17 -15,18.5 -13,19.5 L -11,25.5 L -5,27.5 L -3.5,21.5 C -1,22 1.5,22 4,21.5 L 5.5,27.5 L 11.5,25.5 L 9.5,19.5 C 11.5,18.5 13,17 14.5,15 L 9,11 C 7,14.5 3,16.5 -1.5,16.5 C -8.5,16.5 -14,11 -14,4 C -14,-3 -8.5,-8.5 -1.5,-8.5 C 0,-8.5 1.5,-8.2 3,-7.6 L 3,-15 C 1,-15.5 -1,-15.8 -3.5,-15.5 Z"/>
      <path d="M 1,-24 L 9.5,-24 L 9.5,-5 L 22,-24 L 31.5,-24 L 18,-4.5 L 32,16 L 22,16 L 9.5,-2.5 L 9.5,16 L 1,16 Z"/>
    </g>
    <!-- Metallic silver-slate embossed KDE mark -->
    <g fill="url(#kdeChinMetal)">
      <path d="M -5,-22 L -11,-20 L -13,-14 C -15,-13 -16.5,-11.5 -18,-9.5 L -24,-11 L -27,-5 L -22,-1 C -22.5,1.5 -22.5,4 -22,6.5 L -27,10.5 L -24,16.5 L -18,15 C -16.5,17 -15,18.5 -13,19.5 L -11,25.5 L -5,27.5 L -3.5,21.5 C -1,22 1.5,22 4,21.5 L 5.5,27.5 L 11.5,25.5 L 9.5,19.5 C 11.5,18.5 13,17 14.5,15 L 9,11 C 7,14.5 3,16.5 -1.5,16.5 C -8.5,16.5 -14,11 -14,4 C -14,-3 -8.5,-8.5 -1.5,-8.5 C 0,-8.5 1.5,-8.2 3,-7.6 L 3,-15 C 1,-15.5 -1,-15.8 -3.5,-15.5 Z"/>
      <path d="M 1,-24 L 9.5,-24 L 9.5,-5 L 22,-24 L 31.5,-24 L 18,-4.5 L 32,16 L 22,16 L 9.5,-2.5 L 9.5,16 L 1,16 Z"/>
    </g>
  </g>
</svg>
