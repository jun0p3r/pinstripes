<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="scanLid" x1="30" y1="12" x2="98" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe4ee"/>
      <stop offset="1.00" stop-color="#b5bcc9"/>
    </linearGradient>
    <linearGradient id="scanBed" x1="64" y1="54" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e8ecf5"/>
      <stop offset="0.75" stop-color="#c0c6d4"/>
      <stop offset="1.00" stop-color="#9aa1b0"/>
    </linearGradient>
    <linearGradient id="glassPlaten" x1="28" y1="56" x2="100" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#17283b"/>
      <stop offset="0.55" stop-color="#224568"/>
      <stop offset="1.00" stop-color="#122130"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="112" rx="48" ry="6.0" fill="#071220" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <rect x="18" y="106.5" width="92" height="4.5" rx="2" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>

  <!-- Raised Open Scanner Cover -->
  <path d="M31,14 H97 L102,54 H26 Z" fill="url(#scanLid)" stroke="#788090" stroke-width="0.9"/>
  <path d="M34,19 H94 L97,50 H31 Z" fill="#f7f9fc" stroke="#c5ccd9" stroke-width="0.6"/>

  <!-- Flatbed Scanner Base -->
  <path d="M24,54 H104 L114,98 Q115,104 108,104 H20 Q13,104 14,98 Z" fill="url(#scanBed)" stroke="#636a78" stroke-width="0.9"/>
  <path d="M14,98 H114 V106 Q114,109 109,109 H19 Q14,109 14,106 Z" fill="#3a404d"/>

  <!-- Dark Optical Glass Platen + Document Sheet + Glowing Cyan CCD Lamp Bar -->
  <polygon points="29,58 99,58 106,93 22,93" fill="url(#glassPlaten)" stroke="#4d5563" stroke-width="0.8"/>
  <!-- Document laying on glass -->
  <polygon points="41,61 87,61 91,89 37,89" fill="#ffffff" stroke="#aeb6c4" stroke-width="0.6"/>
  <line x1="44" y1="67" x2="82" y2="67" stroke="#2c6be0" stroke-width="1.8"/>
  <line x1="43" y1="73" x2="84" y2="73" stroke="#5b6678" stroke-width="1.0"/>
  <line x1="42" y1="78" x2="80" y2="78" stroke="#5b6678" stroke-width="1.0"/>
  <line x1="41" y1="83" x2="75" y2="83" stroke="#5b6678" stroke-width="1.0"/>

  <!-- Brilliant Cyan-White CCD Scan Bar Sweeping Across Platen -->
  <line x1="25" y1="75" x2="103" y2="75" stroke="#33e0ff" stroke-width="6.5" stroke-opacity="0.55" filter="url(#softGlow)"/>
  <line x1="25" y1="75" x2="103" y2="75" stroke="#ffffff" stroke-width="2.4"/>
  <!-- Front Aqua scan button -->
  <ellipse cx="98" cy="103.5" rx="4.5" ry="2.2" fill="#38c8ff"/>
</svg>
