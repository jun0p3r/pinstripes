<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="aluBezel" x1="64" y1="16" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fafbfd"/>
      <stop offset="0.18" stop-color="#e3e6ed"/>
      <stop offset="0.72" stop-color="#c6cbd5"/>
      <stop offset="1.00" stop-color="#aeb4c0"/>
    </linearGradient>
    <linearGradient id="crtGlass" x1="22" y1="28" x2="106" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#192822"/>
      <stop offset="0.55" stop-color="#0f1a16"/>
      <stop offset="1.00" stop-color="#08100d"/>
    </linearGradient>
    <linearGradient id="crtGloss" x1="64" y1="28" x2="64" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
  </defs>
  <rect x="15" y="20" width="98" height="90" rx="5" fill="#000000" fill-opacity="0.30" transform="translate(0, 3.5)" filter="url(#dropShadow)"/>
  <ellipse cx="64" cy="112.5" rx="46" ry="5.5" fill="#000000" fill-opacity="0.28" filter="url(#floorBlur)"/>

  <!-- Brushed-aluminum rack/studio enclosure (HIG i-024 style) -->
  <rect x="14" y="18" width="100" height="90" rx="4.5" fill="url(#aluBezel)" stroke="#6d7380" stroke-width="0.9"/>
  <line x1="16" y1="19.5" x2="112" y2="19.5" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Recessed dark phosphor oscilloscope screen -->
  <rect x="21" y="26" width="86" height="66" rx="2.5" fill="url(#crtGlass)" stroke="#484e59" stroke-width="1.0"/>
  <!-- Phosphor graticule grid -->
  <g stroke="#1f5940" stroke-width="0.65" stroke-opacity="0.65">
    <line x1="38" y1="27" x2="38" y2="91"/><line x1="55" y1="27" x2="55" y2="91"/>
    <line x1="72" y1="27" x2="72" y2="91"/><line x1="89" y1="27" x2="89" y2="91"/>
    <line x1="22" y1="43" x2="106" y2="43"/><line x1="22" y1="59" x2="106" y2="59"/><line x1="22" y1="75" x2="106" y2="75"/>
  </g>
  <!-- Secondary cyan memory trace -->
  <polyline points="23,77 36,74 48,76 60,68 74,72 88,65 105,69" fill="none" stroke="#38c8ff" stroke-width="1.5" stroke-opacity="0.72"/>
  <!-- Glowing Emerald EKG CPU Waveform -->
  <polyline points="23,63 37,63 43,54 48,69 54,35 60,79 66,50 72,63 83,63 89,55 94,63 105,63" fill="none" stroke="#2bff88" stroke-width="3.6" stroke-opacity="0.45" stroke-linejoin="round" filter="url(#softGlow)"/>
  <polyline points="23,63 37,63 43,54 48,69 54,35 60,79 66,50 72,63 83,63 89,55 94,63 105,63" fill="none" stroke="#9effc6" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="105" cy="63" r="2.3" fill="#ffffff"/>
  <!-- Curved CRT top glass reflection -->
  <path d="M22,27 H106 V49 Q64,58 22,46 Z" fill="url(#crtGloss)"/>

  <!-- Bottom studio status bar: CPU/RAM meters & lime power LED -->
  <rect x="22" y="96.5" width="18" height="5.5" rx="1.2" fill="#21262e"/>
  <rect x="23.2" y="97.7" width="12" height="3.1" rx="0.6" fill="#2ee87a"/>
  <rect x="44" y="96.5" width="18" height="5.5" rx="1.2" fill="#21262e"/>
  <rect x="45.2" y="97.7" width="9" height="3.1" rx="0.6" fill="#38b6ff"/>
  <circle cx="101" cy="99.2" r="2.8" fill="#8df52c" stroke="#3c6e0c" stroke-width="0.6"/>
</svg>
