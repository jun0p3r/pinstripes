<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="sheetGrad" x1="26" y1="14" x2="98" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f6f8fc"/>
      <stop offset="1.00" stop-color="#dde3ee"/>
    </linearGradient>
    <linearGradient id="writerBlue" x1="26" y1="14" x2="96" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#62b4ff"/>
      <stop offset="0.50" stop-color="#1e6ce0"/>
      <stop offset="1.00" stop-color="#0f449c"/>
    </linearGradient>
    <linearGradient id="penBarrel" x1="0" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#081d4a"/>
      <stop offset="0.30" stop-color="#2972e6"/>
      <stop offset="0.48" stop-color="#9ad4ff"/>
      <stop offset="0.72" stop-color="#15469e"/>
      <stop offset="1.00" stop-color="#091a40"/>
    </linearGradient>
    <linearGradient id="goldNib" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8c6214"/>
      <stop offset="0.38" stop-color="#fff0a6"/>
      <stop offset="0.62" stop-color="#e3a829"/>
      <stop offset="1.00" stop-color="#754e0c"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="113" rx="42" ry="5.5" fill="#081226" fill-opacity="0.30" filter="url(#floorBlur)"/>

  <!-- Tilted Writer Folio -->
  <g transform="rotate(-6.5 60 62)">
    <rect x="23" y="15" width="74" height="96" rx="2" fill="#000000" fill-opacity="0.26" transform="translate(2, 3.5)" filter="url(#dropShadow)"/>
    <rect x="23" y="15" width="74" height="96" rx="2" fill="url(#sheetGrad)" stroke="#9da6b5" stroke-width="0.85"/>
    <!-- Glossy Sapphire Header Banner -->
    <path d="M23.5,17 Q23.5,15.5 25,15.5 H95 Q96.5,15.5 96.5,17 V29 H23.5 Z" fill="url(#writerBlue)"/>
    <rect x="24.5" y="16.5" width="71" height="4" rx="1" fill="#ffffff" fill-opacity="0.38"/>
    <!-- Readable Heading & Framed Landscape Picture -->
    <text x="29" y="40" font-family="Georgia, Liberation Serif, serif" font-weight="bold" font-size="7.5" fill="#162238">Chapter One</text>
    <rect x="29" y="45" width="27" height="21" fill="#cfeaff" stroke="#7d9cc4" stroke-width="0.7"/>
    <circle cx="49" cy="51" r="2.8" fill="#ffd447"/>
    <polygon points="29.5,65.5 38,54 45,61 50,56 55.5,65.5" fill="#469c5c"/>
    <!-- Crisp readable serif lines alongside & below inset -->
    <g font-family="Georgia, Liberation Serif, serif" font-size="4.4" fill="#2b3342">
      <text x="60" y="49">Aqua brings</text>
      <text x="60" y="55">clarity and</text>
      <text x="60" y="61">depth to the</text>
      <text x="60" y="67">printed page.</text>
      <text x="29" y="75">Every paragraph is set with crisp</text>
      <text x="29" y="81.5">proportions, clean margins, and</text>
      <text x="29" y="88">photographic studio materials</text>
      <text x="29" y="94.5">inspired by Mac OS X Jaguar.</text>
    </g>
    <g stroke="#bfd0e6" stroke-width="0.55">
      <line x1="29" y1="76.5" x2="90" y2="76.5"/>
      <line x1="29" y1="83" x2="90" y2="83"/>
      <line x1="29" y1="89.5" x2="90" y2="89.5"/>
      <line x1="29" y1="96" x2="90" y2="96"/>
    </g>
  </g>

  <!-- Sculpted Sapphire & Gold Fountain Pen crossing lower-right -->
  <g transform="translate(88, 22) rotate(28)">
    <rect x="1.5" y="4" width="13" height="84" rx="5" fill="#000000" fill-opacity="0.34" transform="translate(2.5, 3)" filter="url(#softGlow)"/>
    <rect x="0" y="0" width="13" height="68" rx="4.5" fill="url(#penBarrel)" stroke="#071940" stroke-width="0.7"/>
    <!-- Gold cap band & pocket clip -->
    <rect x="-0.3" y="24" width="13.6" height="3.6" fill="url(#goldNib)"/>
    <rect x="5.2" y="4" width="2.6" height="22" rx="1.2" fill="url(#goldNib)"/>
    <!-- Tapered black grip & gold fountain nib -->
    <polygon points="1,68 12,68 10,79 3,79" fill="#1e222b"/>
    <polygon points="3,79 10,79 6.5,93" fill="url(#goldNib)" stroke="#6e4808" stroke-width="0.5"/>
    <line x1="6.5" y1="82" x2="6.5" y2="92" stroke="#3b2604" stroke-width="0.6"/>
  </g>
</svg>
