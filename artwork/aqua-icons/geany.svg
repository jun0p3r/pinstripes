<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="brassBody" x1="24" y1="48" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff8b8"/>
      <stop offset="0.28" stop-color="#f2c43d"/>
      <stop offset="0.62" stop-color="#ba7d14"/>
      <stop offset="0.85" stop-color="#ffe078"/>
      <stop offset="1.00" stop-color="#784a06"/>
    </linearGradient>
    <linearGradient id="cyanWisp" x1="92" y1="58" x2="68" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.40" stop-color="#6ae2ff"/>
      <stop offset="1.00" stop-color="#1c78eb" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="rubyGem" cx="62" cy="76" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffadb3"/><stop offset="0.45" stop-color="#e01928"/><stop offset="1.00" stop-color="#69060e"/>
    </radialGradient>
  </defs>
  <ellipse cx="62" cy="112" rx="44" ry="5.8" fill="#241504" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <ellipse cx="60" cy="109.5" rx="24" ry="3.0" fill="#000000" fill-opacity="0.48" filter="url(#contactBlur)"/>

  <!-- Luminous Aqua Genie Smoke Wisp + Floating Code Spark -->
  <path d="M106,58 C114,44 98,35 96,24 C94,14 76,12 72,22 C69,30 84,36 86,44 C88,52 99,55 106,58 Z" fill="url(#cyanWisp)" filter="url(#softGlow)"/>
  <text x="80" y="29" font-family="Georgia, serif" font-weight="bold" font-size="14" fill="#0e4ca8" stroke="#ffffff" stroke-width="0.5">{ }</text>

  <!-- Sculpted Burnished Brass Aladdin Lamp -->
  <!-- Curved ornate handle (left) -->
  <path d="M35,72 C15,68 12,48 25,45 C34,43 38,54 32,60" fill="none" stroke="url(#brassBody)" stroke-width="6.0" stroke-linecap="round"/>
  <path d="M35,72 C15,68 12,48 25,45 C34,43 38,54 32,60" fill="none" stroke="#784a06" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Pedestal foot -->
  <path d="M46,96 L74,96 L82,108 H38 Z" fill="url(#brassBody)" stroke="#6e4306" stroke-width="0.85"/>
  <!-- Main lamp vessel & elongated spout -->
  <path d="M30,72 C30,58 45,52 60,52 C75,52 84,60 94,63 C101,65 107,59 111,56 C110,66 100,76 87,81 C78,89 70,96 60,96 C44,96 30,86 30,72 Z" fill="url(#brassBody)" stroke="#6e4306" stroke-width="0.9"/>
  <!-- Domed lid & finial -->
  <path d="M45,53 C48,43 72,43 75,53 Z" fill="url(#brassBody)" stroke="#6e4306" stroke-width="0.8"/>
  <circle cx="60" cy="41.5" r="4.2" fill="url(#brassBody)" stroke="#6e4306" stroke-width="0.7"/>
  <!-- Inset Ruby & Sapphire Cabochon Jewels on Lamp Belly -->
  <circle cx="60" cy="75" r="6.5" fill="url(#rubyGem)" stroke="#fff0a6" stroke-width="1.2"/>
  <circle cx="45" cy="74" r="3.6" fill="#1e74e8" stroke="#fff0a6" stroke-width="0.9"/>
  <circle cx="75" cy="74" r="3.6" fill="#1eb856" stroke="#fff0a6" stroke-width="0.9"/>
  <!-- Specular gold highlight -->
  <ellipse cx="58" cy="60" rx="18" ry="4.5" fill="#ffffff" fill-opacity="0.55"/>
</svg>
