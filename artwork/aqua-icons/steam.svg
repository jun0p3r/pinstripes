<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="stDrop" x="-25%" y="-25%" width="150%" height="155%"><feGaussianBlur stdDeviation="3.0"/></filter>
    <linearGradient id="stBody" x1="64" y1="12" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#3a567d"/>
      <stop offset="0.42" stop-color="#132542"/>
      <stop offset="0.80" stop-color="#1b3a66"/>
      <stop offset="1.00" stop-color="#4e82ba"/>
    </linearGradient>
    <linearGradient id="stChrome" x1="20" y1="32" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe5f0"/>
      <stop offset="0.75" stop-color="#9aa4b5"/>
      <stop offset="1.00" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="stShine" x1="64" y1="12" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <clipPath id="stClip"><circle cx="64" cy="62" r="50"/></clipPath>
  </defs>
  <circle cx="64" cy="65.5" r="50" fill="#060f21" fill-opacity="0.40" filter="url(#stDrop)"/>
  <g clip-path="url(#stClip)">
    <circle cx="64" cy="62" r="50" fill="url(#stBody)"/>
    <!-- Classic Steam Crank & Connecting Rod -->
    <g transform="translate(1, 2.5)" fill="#060e1c" fill-opacity="0.55">
      <path d="M 10,72 L 49,88 L 56,73 L 14,56 Z"/>
      <path d="M 48,74 L 74,45 L 88,58 L 60,86 Z"/>
      <circle cx="80" cy="49" r="19"/>
      <circle cx="53" cy="81" r="13.5"/>
    </g>
    <path d="M 10,72 L 49,88 L 56,73 L 14,56 Z" fill="url(#stChrome)"/>
    <path d="M 49,73 L 72,44 L 87,57 L 60,86 Z" fill="url(#stChrome)"/>
    <circle cx="80" cy="49" r="19" fill="url(#stChrome)"/>
    <circle cx="80" cy="49" r="12" fill="#162d4f"/>
    <circle cx="80" cy="49" r="8" fill="url(#stChrome)"/>
    <circle cx="53" cy="81" r="13.5" fill="url(#stChrome)"/>
    <circle cx="53" cy="81" r="8.2" fill="#162d4f"/>
    <circle cx="53" cy="81" r="5.0" fill="url(#stChrome)"/>
    <!-- Aqua top lens -->
    <path d="M 10,10 H 118 V 50 Q 64,63 10,50 Z" fill="url(#stShine)"/>
    <circle cx="64" cy="62" r="50" fill="none" stroke="#183259" stroke-width="2.2" stroke-opacity="0.85"/>
  </g>
  <circle cx="64" cy="62" r="50" fill="none" stroke="#0c1d38" stroke-width="0.8"/>
