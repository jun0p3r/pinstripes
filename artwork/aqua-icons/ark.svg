<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="boxTop" x1="64" y1="20" x2="64" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f5dca8"/>
      <stop offset="1.00" stop-color="#deb571"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="18" y1="36" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#dba95e"/>
      <stop offset="1.00" stop-color="#b57d34"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="64" y1="36" x2="110" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#c48e44"/>
      <stop offset="1.00" stop-color="#8f5c1e"/>
    </linearGradient>
    <linearGradient id="strapChrome" x1="40" y1="16" x2="88" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#cfd5e0"/>
      <stop offset="0.52" stop-color="#58606e"/>
      <stop offset="0.76" stop-color="#eef2f8"/>
      <stop offset="1.00" stop-color="#434954"/>
    </linearGradient>
    <linearGradient id="brassBuckle" x1="50" y1="54" x2="78" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff4ad"/>
      <stop offset="0.45" stop-color="#e3a92b"/>
      <stop offset="1.00" stop-color="#8a5a0a"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="112" rx="45" ry="6.2" fill="#1f1204" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="109.5" rx="28" ry="3.4" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>

  <!-- Isometric Kraft Cardboard Archive Box -->
  <!-- Top face -->
  <polygon points="64,19 110,36 64,53 18,36" fill="url(#boxTop)" stroke="#8c5c20" stroke-width="0.8"/>
  <!-- Left face -->
  <polygon points="18,36 64,53 64,109 18,90" fill="url(#boxLeft)" stroke="#7d4f18" stroke-width="0.8"/>
  <!-- Right face -->
  <polygon points="64,53 110,36 110,90 64,109" fill="url(#boxRight)" stroke="#6e4312" stroke-width="0.8"/>
  <!-- Sunlit cardboard ridge highlights -->
  <polyline points="19,36.2 64,52.8 109,36.2" fill="none" stroke="#fff3d4" stroke-width="1.3" stroke-opacity="0.85"/>
  <line x1="64" y1="53" x2="64" y2="108" stroke="#ffe7b5" stroke-width="1.0" stroke-opacity="0.55"/>

  <!-- White shipping label on left panel -->
  <polygon points="25,52 46,60 46,77 25,69" fill="#fbfcfe" stroke="#9aa0ad" stroke-width="0.6"/>
  <line x1="28" y1="57" x2="43" y2="62.8" stroke="#cc2929" stroke-width="1.5"/>
  <line x1="28" y1="61.5" x2="42" y2="67" stroke="#3c4452" stroke-width="1.0"/>
  <line x1="28" y1="65" x2="39" y2="69.2" stroke="#3c4452" stroke-width="1.0"/>

  <!-- Heavy Spun-Chrome Compression Strap & Zipper Teeth around box -->
  <polygon points="39,28.2 85,45.2 85,100.2 76,104 76,49 30,31.5" fill="#000000" fill-opacity="0.22" transform="translate(1.5,1.5)"/>
  <polygon points="38,28.5 47,25.2 93,42.2 93,97 84,100.8 84,45.8" fill="url(#strapChrome)" stroke="#3d434f" stroke-width="0.75"/>
  <!-- Interlocking metal zipper teeth down front-right strap -->
  <g fill="#ffffff" stroke="#454b57" stroke-width="0.4">
    <rect x="85.2" y="49" width="4" height="2.4" rx="0.5"/>
    <rect x="88.0" y="53" width="4" height="2.4" rx="0.5"/>
    <rect x="85.2" y="57" width="4" height="2.4" rx="0.5"/>
    <rect x="88.0" y="61" width="4" height="2.4" rx="0.5"/>
    <rect x="85.2" y="81" width="4" height="2.4" rx="0.5"/>
    <rect x="88.0" y="85" width="4" height="2.4" rx="0.5"/>
    <rect x="85.2" y="89" width="4" height="2.4" rx="0.5"/>
  </g>
  <!-- Brass zipper pull & tension buckle -->
  <rect x="81.5" y="65" width="14" height="14" rx="2.5" fill="url(#brassBuckle)" stroke="#694205" stroke-width="0.8"/>
  <rect x="84.5" y="68" width="8" height="5" rx="1" fill="#3a2504"/>
  <path d="M88.5,75 L92.5,87 L84.5,87 Z" fill="url(#brassBuckle)" stroke="#694205" stroke-width="0.7"/>
</svg>
