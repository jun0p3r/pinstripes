<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="calcSheet" x1="20" y1="14" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.60" stop-color="#f5faf7"/>
      <stop offset="1.00" stop-color="#dce8e1"/>
    </linearGradient>
    <linearGradient id="calcGreen" x1="20" y1="14" x2="96" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#6ae892"/>
      <stop offset="0.50" stop-color="#1ba854"/>
      <stop offset="1.00" stop-color="#0c6b32"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="60" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#80d4ff"/>
      <stop offset="0.45" stop-color="#2074e6"/>
      <stop offset="1.00" stop-color="#0d3d8a"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0" y1="48" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8effac"/>
      <stop offset="0.45" stop-color="#1eb85a"/>
      <stop offset="1.00" stop-color="#0b6930"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="36" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffe680"/>
      <stop offset="0.45" stop-color="#f28518"/>
      <stop offset="1.00" stop-color="#a84208"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="113" rx="44" ry="5.8" fill="#061c10" fill-opacity="0.31" filter="url(#floorBlur)"/>

  <!-- Tilted Spreadsheet Ledger -->
  <g transform="rotate(-4.5 58 60)">
    <rect x="19" y="14" width="76" height="94" rx="2" fill="#000000" fill-opacity="0.25" transform="translate(2, 3.5)" filter="url(#dropShadow)"/>
    <rect x="19" y="14" width="76" height="94" rx="2" fill="url(#calcSheet)" stroke="#95ab9e" stroke-width="0.85"/>
    <path d="M19.5,16 Q19.5,14.5 21,14.5 H93 Q94.5,14.5 94.5,16 V28 H19.5 Z" fill="url(#calcGreen)"/>
    <rect x="20.5" y="15.5" width="73" height="4" rx="1" fill="#ffffff" fill-opacity="0.38"/>
    <!-- Spreadsheet row/column headers & grid -->
    <rect x="20" y="28" width="14" height="79" fill="#e6f2eb"/>
    <g stroke="#b8d1c2" stroke-width="0.7">
      <line x1="34" y1="28" x2="34" y2="107"/>
      <line x1="54" y1="28" x2="54" y2="107"/>
      <line x1="74" y1="28" x2="74" y2="107"/>
      <line x1="20" y1="41" x2="94" y2="41"/>
      <line x1="20" y1="54" x2="94" y2="54"/>
      <line x1="20" y1="67" x2="94" y2="67"/>
      <line x1="20" y1="80" x2="94" y2="80"/>
      <line x1="20" y1="93" x2="94" y2="93"/>
    </g>
    <g font-family="Luxi Sans, DejaVu Sans, sans-serif" font-size="5.5" font-weight="bold" fill="#2c593e">
      <text x="25" y="37">1</text><text x="25" y="50">2</text><text x="25" y="63">3</text><text x="25" y="76">4</text>
      <text x="38" y="37">Q1</text><text x="58" y="37">Q2</text><text x="78" y="37">Q3</text>
    </g>
    <g font-family="Luxi Sans, DejaVu Sans, sans-serif" font-size="5.2" fill="#203328">
      <text x="37" y="50">142</text><text x="57" y="50">218</text><text x="77" y="50">305</text>
      <text x="37" y="63">168</text><text x="57" y="63">254</text>
      <text x="37" y="76">195</text>
    </g>
  </g>

  <!-- Foreground 3D Glossy Aqua Bar Chart Columns -->
  <g>
    <ellipse cx="82" cy="110.5" rx="28" ry="3.2" fill="#000000" fill-opacity="0.42" filter="url(#contactBlur)"/>
    <!-- Bar 1: Sapphire -->
    <rect x="55" y="68" width="15" height="41" rx="2.2" fill="url(#barBlue)" stroke="#0b3578" stroke-width="0.8"/>
    <rect x="56.5" y="69.5" width="5" height="38" rx="1" fill="#ffffff" fill-opacity="0.38"/>
    <!-- Bar 2: Emerald -->
    <rect x="74" y="53" width="15" height="56" rx="2.2" fill="url(#barEmerald)" stroke="#0a5928" stroke-width="0.8"/>
    <rect x="75.5" y="54.5" width="5" height="53" rx="1" fill="#ffffff" fill-opacity="0.38"/>
    <!-- Bar 3: Amber -->
    <rect x="93" y="38" width="15" height="71" rx="2.2" fill="url(#barAmber)" stroke="#8c3706" stroke-width="0.8"/>
    <rect x="94.5" y="39.5" width="5" height="68" rx="1" fill="#ffffff" fill-opacity="0.42"/>
  </g>
</svg>
