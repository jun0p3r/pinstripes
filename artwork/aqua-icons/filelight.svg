<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="flBlue" x1="20" y1="14" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8ae2ff"/><stop offset="0.50" stop-color="#1d70e6"/><stop offset="1.00" stop-color="#0b3680"/>
    </linearGradient>
    <linearGradient id="flEmerald" x1="16" y1="40" x2="80" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#9effb8"/><stop offset="0.50" stop-color="#1cb856"/><stop offset="1.00" stop-color="#095e28"/>
    </linearGradient>
    <linearGradient id="flAmber" x1="64" y1="20" x2="112" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffe885"/><stop offset="0.50" stop-color="#f27d16"/><stop offset="1.00" stop-color="#9c3806"/>
    </linearGradient>
    <linearGradient id="flAmethyst" x1="50" y1="60" x2="106" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e8b8ff"/><stop offset="0.50" stop-color="#862ce0"/><stop offset="1.00" stop-color="#3e0b75"/>
    </linearGradient>
    <linearGradient id="flRuby" x1="20" y1="18" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffa6ad"/><stop offset="0.50" stop-color="#de212e"/><stop offset="1.00" stop-color="#7a0912"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="112.5" rx="44" ry="6.0" fill="#091226" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="110.2" rx="26" ry="3.0" fill="#000000" fill-opacity="0.44" filter="url(#contactBlur)"/>

  <!-- Outer Ring Sunburst Segments (r=34..49) -->
  <g stroke="#ffffff" stroke-width="1.2">
    <path d="M64,11.5 A49,49 0 0,1 111.3,47.8 L96.8,51.7 A34,34 0 0,0 64,26.5 Z" fill="url(#flBlue)"/>
    <path d="M111.3,47.8 A49,49 0 0,1 88.5,102.9 L81.0,89.9 A34,34 0 0,0 96.8,51.7 Z" fill="url(#flAmber)"/>
    <path d="M88.5,102.9 A49,49 0 0,1 31.0,96.8 L41.1,85.7 A34,34 0 0,0 81.0,89.9 Z" fill="url(#flAmethyst)"/>
    <path d="M31.0,96.8 A49,49 0 0,1 18.2,43.0 L32.2,48.4 A34,34 0 0,0 41.1,85.7 Z" fill="url(#flEmerald)"/>
    <path d="M18.2,43.0 A49,49 0 0,1 64,11.5 L64,26.5 A34,34 0 0,0 32.2,48.4 Z" fill="url(#flRuby)"/>
  </g>

  <!-- Inner Ring Sunburst Segments (r=18..34) -->
  <g stroke="#ffffff" stroke-width="1.2">
    <path d="M64,26.5 A34,34 0 0,1 98,60.5 H82 A18,18 0 0,0 64,42.5 Z" fill="url(#flBlue)"/>
    <path d="M98,60.5 A34,34 0 0,1 47,89.9 L55,76.1 A18,18 0 0,0 82,60.5 Z" fill="url(#flAmber)"/>
    <path d="M47,89.9 A34,34 0 0,1 64,26.5 V42.5 A18,18 0 0,0 55,76.1 Z" fill="url(#flEmerald)"/>
  </g>

  <!-- Glossy Spun-Chrome Center Hub & Overall Aqua Specular Glaze -->
  <circle cx="64" cy="60.5" r="18" fill="#f2f5fa" stroke="#7d8492" stroke-width="1.0"/>
  <circle cx="64" cy="60.5" r="7.5" fill="#cfd5e2" stroke="#6c7382" stroke-width="0.8"/>
  <ellipse cx="64" cy="29" rx="33" ry="14" fill="#ffffff" fill-opacity="0.42"/>
  <circle cx="64" cy="60.5" r="49" fill="none" stroke="#2c3b59" stroke-width="0.85" stroke-opacity="0.55"/>
</svg>
