<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Overhead shelf shadow + roof-eave shadow (HIG Fig. 11-17 / i-020.png Home cottage) -->
    <filter id="floorBlur" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="eaveBlur" x="-15%" y="-20%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- Warm cream stucco house walls (sampled i-020.png: #fcfaf2 -> #e6e0d0 -> #cfc7b4) -->
    <linearGradient id="stuccoWall" x1="64" y1="30" x2="64" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fdfbf5"/>
      <stop offset="0.45" stop-color="#f2ede1"/>
      <stop offset="0.85" stop-color="#dfd8c7"/>
      <stop offset="1.00" stop-color="#cbc2ae"/>
    </linearGradient>
    <linearGradient id="wallSideShade" x1="25" y1="70" x2="103" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8c8373" stop-opacity="0.24"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="1.00" stop-color="#7c7364" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Stone/brick chimney on right slope -->
    <linearGradient id="chimneyGrad" x1="83" y1="22" x2="96" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#faf7ef"/>
      <stop offset="0.55" stop-color="#dbd3c2"/>
      <stop offset="1.00" stop-color="#9e9584"/>
    </linearGradient>

    <!-- Steep charcoal-espresso shingle gabled roof (sampled i-020.png / hig_key_zooms.png) -->
    <linearGradient id="roofSlate" x1="64" y1="15" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#6e665f"/>
      <stop offset="0.28" stop-color="#423b36"/>
      <stop offset="0.72" stop-color="#24201d"/>
      <stop offset="1.00" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="roofUnderside" x1="64" y1="26" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#ede8de"/>
      <stop offset="1.0" stop-color="#a8a092"/>
    </linearGradient>

    <!-- Honey-oak panelled front door (sampled i-020.png: #cf8642 -> #9c5a22 -> #6e3a12) -->
    <linearGradient id="oakDoor" x1="64" y1="68" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#d8904a"/>
      <stop offset="0.45" stop-color="#b46c2c"/>
      <stop offset="0.85" stop-color="#8c4c1a"/>
      <stop offset="1.00" stop-color="#6e3810"/>
    </linearGradient>
    <linearGradient id="shutterWood" x1="64" y1="40" x2="64" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#8e4f20"/>
      <stop offset="1.0" stop-color="#582d0e"/>
    </linearGradient>
    <linearGradient id="windowGlass" x1="60" y1="44" x2="68" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#a8c8e8"/>
      <stop offset="0.45" stop-color="#5c7c9e"/>
      <stop offset="1.00" stop-color="#344960"/>
    </linearGradient>

    <clipPath id="clipWalls">
      <path d="M 64,24 L 101,58 L 101,108.5 L 27,108.5 L 27,58 Z"/>
    </clipPath>
  </defs>

  <!-- Overhead floor & front-stoop shadow -->
  <ellipse cx="64" cy="110.5" rx="46" ry="6.2" fill="#000000" fill-opacity="0.30" filter="url(#floorBlur)"/>
  <rect x="26" y="106.5" width="76" height="4.2" rx="2" fill="#000000" fill-opacity="0.44" filter="url(#contactBlur)"/>
  <!-- Trapezoidal path/threshold shadow in front of door (visible in i-020.png!) -->
  <polygon points="51,108.5 77,108.5 84,114.5 44,114.5" fill="#000000" fill-opacity="0.18" filter="url(#contactBlur)"/>

  <!-- Right-side stone chimney with subtle masonry courses & cap -->
  <rect x="83.5" y="23.0" width="12.0" height="33.0" rx="1.0" fill="url(#chimneyGrad)" stroke="#7c7466" stroke-width="0.75"/>
  <g stroke="#9a9180" stroke-width="0.55" opacity="0.55">
    <line x1="83.8" y1="28.0" x2="95.2" y2="28.0"/>
    <line x1="83.8" y1="32.5" x2="95.2" y2="32.5"/>
    <line x1="83.8" y1="37.0" x2="95.2" y2="37.0"/>
    <line x1="83.8" y1="41.5" x2="95.2" y2="41.5"/>
  </g>
  <rect x="82.2" y="21.2" width="14.6" height="3.0" rx="0.9" fill="#f7f4ec" stroke="#7c7466" stroke-width="0.7"/>
  <line x1="83.2" y1="22.0" x2="95.8" y2="22.0" stroke="#ffffff" stroke-width="0.9"/>

  <!-- Main cream stucco cottage walls -->
  <path d="M 64,24 L 101,58 L 101,108.5 L 27,108.5 L 27,58 Z" fill="url(#stuccoWall)"/>

  <g clip-path="url(#clipWalls)">
    <!-- Subtle 3D cylindrical corner shading on plaster walls -->
    <rect x="27" y="24" width="74" height="85" fill="url(#wallSideShade)"/>
    <!-- Soft overhead shadow cast by overhanging gabled roof eaves onto the stucco -->
    <path d="M 64,25 L 105,63 L 105,53 L 64,16 L 23,53 L 23,63 Z" fill="#1e1a15" fill-opacity="0.46" filter="url(#eaveBlur)"/>
    <!-- Subtle masonry plinth band along bottom -->
    <rect x="27" y="104.5" width="74" height="4.0" fill="#b5ac9a" fill-opacity="0.55"/>
    <line x1="27" y1="104.5" x2="101" y2="104.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.65"/>
  </g>
  <path d="M 64,24 L 101,58 L 101,108.5 L 27,108.5 L 27,58 Z" fill="none" stroke="#857d6e" stroke-width="0.85"/>

  <!-- Upper gable 4-pane cottage window with warm mahogany shutters (sampled hig_key_zooms.png!) -->
  <rect x="52.0" y="42.5" width="24.0" height="16.0" rx="1.2" fill="#3a1c08" fill-opacity="0.28" transform="translate(0,1.4)" filter="url(#contactBlur)"/>
  <rect x="52.0" y="42.0" width="24.0" height="16.0" rx="1.0" fill="url(#shutterWood)" stroke="#422008" stroke-width="0.75"/>
  <!-- Shutter louvre highlights -->
  <g stroke="#b8733c" stroke-width="0.7" opacity="0.65">
    <line x1="53.4" y1="45.2" x2="56.8" y2="45.2"/>
    <line x1="53.4" y1="48.2" x2="56.8" y2="48.2"/>
    <line x1="53.4" y1="51.2" x2="56.8" y2="51.2"/>
    <line x1="53.4" y1="54.2" x2="56.8" y2="54.2"/>
    <line x1="71.2" y1="45.2" x2="74.6" y2="45.2"/>
    <line x1="71.2" y1="48.2" x2="74.6" y2="48.2"/>
    <line x1="71.2" y1="51.2" x2="74.6" y2="51.2"/>
    <line x1="71.2" y1="54.2" x2="74.6" y2="54.2"/>
  </g>
  <!-- White window sash & 4 reflective glass panes -->
  <rect x="58.0" y="43.2" width="12.0" height="13.6" rx="0.6" fill="#f7f5f0" stroke="#7c7365" stroke-width="0.5"/>
  <rect x="59.3" y="44.5" width="9.4" height="11.0" fill="url(#windowGlass)"/>
  <!-- Glass diagonal reflection + crisp white cross mullions -->
  <polygon points="59.3,44.5 65.5,44.5 59.3,51.5" fill="#ffffff" fill-opacity="0.35"/>
  <line x1="64.0" y1="44.3" x2="64.0" y2="55.7" stroke="#f7f5f0" stroke-width="1.15"/>
  <line x1="59.1" y1="50.0" x2="68.9" y2="50.0" stroke="#f7f5f0" stroke-width="1.15"/>
  <!-- Window sill lip -->
  <line x1="57.4" y1="57.2" x2="70.6" y2="57.2" stroke="#ffffff" stroke-width="1.0"/>

  <!-- Recessed oak front door with white casing & carved panels -->
  <rect x="51.5" y="67.5" width="25.0" height="41.0" rx="1.2" fill="#f8f6f0" stroke="#9b9282" stroke-width="0.8"/>
  <!-- Deep doorway reveal shadow at top & left -->
  <rect x="53.8" y="69.8" width="20.4" height="38.7" fill="url(#oakDoor)"/>
  <path d="M 53.8,108.5 L 53.8,69.8 L 74.2,69.8" fill="none" stroke="#3c1e06" stroke-width="1.3" stroke-opacity="0.7"/>
  <!-- 4 carved wooden door panels -->
  <g fill="none" stroke="#62320c" stroke-width="0.85" opacity="0.75">
    <rect x="56.4" y="73.0" width="6.2" height="13.2" rx="0.5"/>
    <rect x="65.4" y="73.0" width="6.2" height="13.2" rx="0.5"/>
    <rect x="56.4" y="90.2" width="6.2" height="13.8" rx="0.5"/>
    <rect x="65.4" y="90.2" width="6.2" height="13.8" rx="0.5"/>
  </g>
  <g fill="none" stroke="#f2b26d" stroke-width="0.7" opacity="0.55">
    <line x1="56.8" y1="86.2" x2="62.4" y2="86.2"/>
    <line x1="65.8" y1="86.2" x2="71.4" y2="86.2"/>
    <line x1="56.8" y1="104.0" x2="62.4" y2="104.0"/>
    <line x1="65.8" y1="104.0" x2="71.4" y2="104.0"/>
  </g>
  <!-- Gleaming brass doorknob -->
  <circle cx="71.2" cy="89.2" r="1.5" fill="#4a2608" fill-opacity="0.55"/>
  <circle cx="70.9" cy="88.8" r="1.4" fill="#ffe898" stroke="#8a6218" stroke-width="0.4"/>

  <!-- Steep overhanging gabled slate roof + light-catching platinum fascia trim -->
  <polygon points="64,22.8 109.5,64.8 112.8,61.0 64,15.8 15.2,61.0 18.5,64.8"
           fill="url(#roofSlate)" stroke="#121110" stroke-width="0.75" stroke-linejoin="round"/>
  <!-- Crisp top roof-slope highlight from overhead light -->
  <polyline points="16.4,60.8 64,16.9 111.6,60.8" fill="none" stroke="#a69f96" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <!-- Inner white/cream fascia soffit edge -->
  <polyline points="18.8,64.4 64,23.2 109.2,64.4" fill="none" stroke="url(#roofUnderside)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
