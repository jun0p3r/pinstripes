<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft overhead desk shadow + violet Aqua caustic (matching i-017.png & i-006.png optical chrome ring) -->
    <filter id="floorShadow" x="-30%" y="-45%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="violetCaustic" x="-35%" y="-45%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="octoShadow" x="-20%" y="-20%" width="145%" height="150%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="branchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="nodeBloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- Spun Satin-Chrome Outer Medallion Bezel (sampled 10.2 studio metal reflection) -->
    <linearGradient id="chromeRing" x1="14" y1="12" x2="114" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#eef0f5"/>
      <stop offset="0.42" stop-color="#b4b8c2"/>
      <stop offset="0.62" stop-color="#6c707a"/>
      <stop offset="0.82" stop-color="#cfd3dc"/>
      <stop offset="1.00" stop-color="#848892"/>
    </linearGradient>
    <linearGradient id="innerBezel" x1="64" y1="15" x2="64" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#454852"/>
      <stop offset="0.50" stop-color="#989ca6"/>
      <stop offset="1.00" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Deep Royal Amethyst-Plum 10.2 Aqua Liquid Glass Dome -->
    <linearGradient id="amethystAqua" x1="64" y1="16" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#120229"/>
      <stop offset="0.16" stop-color="#310b68"/>
      <stop offset="0.44" stop-color="#6422b0"/>
      <stop offset="0.74" stop-color="#9b4be6"/>
      <stop offset="0.92" stop-color="#dfa6ff"/>
      <stop offset="1.00" stop-color="#f9ebff"/>
    </linearGradient>

    <!-- Incandescent orchid-violet bottom internal Aqua glow -->
    <radialGradient id="orchidCaustic" cx="64" cy="96" r="40" fx="64" fy="99" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="0.30" stop-color="#efd0ff" stop-opacity="0.72"/>
      <stop offset="0.68" stop-color="#9e48f0" stop-opacity="0.28"/>
      <stop offset="1.00" stop-color="#4e1494" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Atmospheric midnight-plum upper rim depth -->
    <radialGradient id="plumVignette" cx="64" cy="50" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0.62" stop-color="#22064a" stop-opacity="0.0"/>
      <stop offset="0.88" stop-color="#19043a" stop-opacity="0.38"/>
      <stop offset="1.00" stop-color="#0d0122" stop-opacity="0.68"/>
    </radialGradient>

    <!-- 3D Sculpted Pearl-White Porcelain Octocat -->
    <linearGradient id="octoPearl" x1="64" y1="36" x2="64" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#faf7fe"/>
      <stop offset="0.86" stop-color="#e5dcf2"/>
      <stop offset="1.00" stop-color="#cbbbe2"/>
    </linearGradient>

    <!-- Curved 10.2 Aqua top glass lens highlight -->
    <linearGradient id="domeSpecular" x1="64" y1="17.5" x2="64" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="0.35" stop-color="#f3e2ff" stop-opacity="0.34"/>
      <stop offset="0.82" stop-color="#c688ff" stop-opacity="0.06"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <circle id="glassDome" cx="64" cy="60.0" r="43.8"/>
    <clipPath id="clipDome">
      <use href="#glassDome"/>
    </clipPath>
    <clipPath id="clipOcto">
      <use href="#octoPath"/>
    </clipPath>

    <!-- Exact On-Model GitHub Octocat Silhouette (measured directly from io.github.shiftey.Desktop.png!) -->
    <path id="octoPath" d="M 54.4,105.0 L 54.4,86.2 C 46.8,87.8 43.2,83.0 41.2,79.2 C 39.8,76.6 37.5,74.6 35.4,74.2 C 34.1,73.9 33.8,72.4 35.6,72.1 C 38.6,71.7 41.2,73.9 42.8,76.6 C 45.2,80.5 48.6,81.6 54.6,79.8 C 55.1,77.1 56.4,75.0 58.0,73.8 C 46.8,72.5 39.2,67.8 39.2,56.2 C 39.2,51.8 40.9,47.8 43.8,44.8 C 43.1,42.8 42.2,38.4 44.4,35.6 C 47.6,35.2 51.8,37.8 54.2,39.5 C 57.4,38.6 60.7,38.2 64.0,38.2 C 67.3,38.2 70.6,38.6 73.8,39.5 C 76.2,37.8 80.4,35.2 83.6,35.6 C 85.8,38.4 84.9,42.8 84.2,44.8 C 87.1,47.8 88.8,51.8 88.8,56.2 C 88.8,67.8 81.2,72.5 70.0,73.8 C 72.1,75.5 73.6,78.5 73.6,82.8 L 73.6,105.0 Z"/>
  </defs>

  <!-- Overhead Ambient Floor Shadow + Luminous Amethyst Caustic -->
  <ellipse cx="64" cy="113.2" rx="37" ry="5.8" fill="#120228" fill-opacity="0.34" filter="url(#floorShadow)"/>
  <ellipse cx="64" cy="112.6" rx="20" ry="3.2" fill="#9c42f5" fill-opacity="0.28" filter="url(#violetCaustic)"/>

  <!-- 1. Machined Spun-Platinum / Chrome Outer Medallion Ring (r=49.0) -->
  <circle cx="64" cy="60.0" r="49.0" fill="url(#chromeRing)" stroke="#5c606a" stroke-width="0.8"/>
  <!-- Overhead specular white gleam along outer top crest -->
  <path d="M 16.4,54.0 A 48.0,48.0 0 0 1 111.6,54.0" fill="none" stroke="#ffffff" stroke-width="1.35" opacity="0.92"/>
  <!-- Recessed inner metallic bezel seat -->
  <circle cx="64" cy="60.0" r="44.8" fill="url(#innerBezel)"/>

  <!-- 2. Deep Royal Amethyst-Plum 10.2 Aqua Glass Dome -->
  <use href="#glassDome" fill="url(#amethystAqua)"/>

  <g clip-path="url(#clipDome)">
    <!-- Incandescent bottom orchid caustic + midnight-plum upper depth -->
    <rect x="18" y="15" width="92" height="92" fill="url(#orchidCaustic)"/>
    <rect x="18" y="15" width="92" height="92" fill="url(#plumVignette)"/>

    <!-- Subtle Luminous Git Branch & Merge Light Arcs Inside the Amethyst Glass! -->
    <g fill="none" stroke="#e4b0ff" stroke-width="2.2" stroke-opacity="0.42" filter="url(#branchGlow)">
      <path d="M 24,54 C 42,32 86,32 104,54"/>
      <path d="M 32,38 C 46,56 82,56 96,74"/>
      <path d="M 94,36 C 80,54 48,54 30,72"/>
    </g>
    <g fill="none" stroke="#f8e6ff" stroke-width="1.05" stroke-opacity="0.62">
      <path d="M 24,54 C 42,32 86,32 104,54"/>
      <path d="M 32,38 C 46,56 82,56 96,74"/>
      <path d="M 94,36 C 80,54 48,54 30,72"/>
    </g>
    <!-- Glowing commit nodes on the glass filaments -->
    <g fill="#f0c8ff" filter="url(#nodeBloom)" opacity="0.75">
      <circle cx="34.5" cy="43.2" r="3.6"/>
      <circle cx="93.5" cy="43.2" r="3.6"/>
      <circle cx="94.2" cy="71.2" r="3.6"/>
    </g>
    <g fill="#ffffff" opacity="0.88">
      <circle cx="34.5" cy="43.2" r="1.5"/>
      <circle cx="93.5" cy="43.2" r="1.5"/>
      <circle cx="94.2" cy="71.2" r="1.5"/>
    </g>

    <!-- 3. Sculpted 3D Pearl-White Porcelain Octocat Rising from Bottom Rim -->
    <!-- Soft deep-plum cast shadow onto amethyst glass -->
    <use href="#octoPath" transform="translate(0.9, 2.6)" fill="#180338" fill-opacity="0.52" filter="url(#octoShadow)"/>
    <!-- Subtle lavender 3D rim bevel -->
    <use href="#octoPath" transform="translate(0, 1.1)" fill="#baa4d8"/>
    <!-- Main glossy pearl-white Octocat with subtle 3D sculpted porcelain cushion -->
    <use href="#octoPath" fill="url(#octoPearl)"/>
    <g clip-path="url(#clipOcto)">
      <use href="#octoPath" fill="none" stroke="#9e82c8" stroke-width="2.4" stroke-opacity="0.42" filter="url(#branchGlow)"/>
    </g>
    <!-- Crisp sunlit white highlight along Octocat's ears, crown & tail crest -->
    <path d="M 44.2,36.2 C 47.5,35.8 51.6,38.4 54.2,40.0 C 57.4,39.1 60.7,38.7 64.0,38.7 C 67.3,38.7 70.6,39.1 73.8,40.0 C 76.4,38.4 80.5,35.8 83.8,36.2"
          fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 4. Signature Curved 10.2 Aqua Glass Dome Specular Lens -->
    <ellipse cx="64" cy="32.5" rx="31.5" ry="14.8" fill="url(#domeSpecular)"/>
  </g>

  <!-- Crisp inner glass-to-chrome rim seat -->
  <use href="#glassDome" fill="none" stroke="#2c095e" stroke-width="0.85" stroke-opacity="0.68"/>
</svg>
