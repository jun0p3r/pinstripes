<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Trademark-free 10.2 Aqua File Manager: Satin-Platinum & Pinstriped Acrylic Filing Cabinet
         with Open Upper Drawer Revealing Tabbed Translucent Aqua Folders -->
    <filter id="floorBlur" x="-25%" y="-40%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="drawerShadow" x="-20%" y="-25%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>

    <!-- Satin aluminum top & body (sampled drive-harddisk & systemsettings) -->
    <linearGradient id="cabTop" x1="64" y1="14" x2="64" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#eceef3"/>
      <stop offset="0.88" stop-color="#cfd3dc"/>
      <stop offset="1.00" stop-color="#f6f7fb"/>
    </linearGradient>
    <linearGradient id="cabFront" x1="64" y1="33" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f4f5f8"/>
      <stop offset="0.45" stop-color="#e3e6ec"/>
      <stop offset="0.92" stop-color="#cfd3dc"/>
      <stop offset="1.00" stop-color="#adb2be"/>
    </linearGradient>
    <linearGradient id="drawerFace" x1="64" y1="54" x2="64" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#f3f5f9"/>
      <stop offset="0.82" stop-color="#dce0e8"/>
      <stop offset="1.00" stop-color="#b8bec9"/>
    </linearGradient>
    <linearGradient id="lowerDrawer" x1="64" y1="81" x2="64" y2="107" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f6f7fa"/>
      <stop offset="0.50" stop-color="#e4e7ee"/>
      <stop offset="1.00" stop-color="#c6cbd6"/>
    </linearGradient>

    <!-- Subtle Studio Display vertical pinstripes on drawer fronts -->
    <pattern id="cabStripes" width="2.4" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.2" height="8" fill="#ffffff" fill-opacity="0.38"/>
      <rect x="1.2" y="0" width="1.2" height="8" fill="#8c94a4" fill-opacity="0.07"/>
    </pattern>

    <!-- Spun mirror-chrome drawer handles -->
    <linearGradient id="chromeHandle" x1="50" y1="64" x2="78" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#484d58"/>
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.44" stop-color="#c6ccd8"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#3a3f48"/>
      <stop offset="1.00" stop-color="#aeb4c0"/>
    </linearGradient>

    <!-- Three vivid 10.2 translucent Aqua tabbed file folders inside open drawer! -->
    <linearGradient id="tabRuby" x1="64" y1="26" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffd8de"/>
      <stop offset="0.35" stop-color="#f8586a"/>
      <stop offset="1.00" stop-color="#c41e32"/>
    </linearGradient>
    <linearGradient id="tabEmerald" x1="64" y1="30" x2="64" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#d8ffe6"/>
      <stop offset="0.35" stop-color="#46d884"/>
      <stop offset="1.00" stop-color="#19924c"/>
    </linearGradient>
    <linearGradient id="tabAquaBlue" x1="64" y1="34" x2="64" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f0ffff"/>
      <stop offset="0.22" stop-color="#b8ebff"/>
      <stop offset="0.62" stop-color="#529ef2"/>
      <stop offset="1.00" stop-color="#2c74d4"/>
    </linearGradient>
  </defs>

  <!-- Two-layer grounded floor shadow -->
  <ellipse cx="64" cy="112.0" rx="48" ry="6.6" fill="#000818" fill-opacity="0.30" filter="url(#floorBlur)"/>
  <rect x="20" y="108.5" width="88" height="4.4" rx="2.0" fill="#000818" fill-opacity="0.48" filter="url(#contactBlur)"/>

  <!-- 1. Main Cabinet Housing (diminishing top lid + sturdy brushed-platinum body) -->
  <!-- Top lid in subtle desk perspective -->
  <path d="M 28.0,15.5 L 100.0,15.5 C 102.6,15.5 104.4,16.8 105.2,19.2 L 109.5,32.8 L 18.5,32.8 L 22.8,19.2 C 23.6,16.8 25.4,15.5 28.0,15.5 Z"
        fill="url(#cabTop)" stroke="#858b98" stroke-width="0.8"/>
  <line x1="27.5" y1="16.6" x2="100.5" y2="16.6" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Lower cabinet chassis -->
  <rect x="18.5" y="32.2" width="91.0" height="78.8" rx="3.2" fill="url(#cabFront)" stroke="#7b818e" stroke-width="0.85"/>
  <rect x="19.5" y="33.0" width="89.0" height="77.0" rx="2.5" fill="url(#cabStripes)"/>
  <line x1="19.8" y1="33.2" x2="108.2" y2="33.2" stroke="#ffffff" stroke-width="1.4"/>

  <!-- 2. Closed Lower Drawer (y=81..106.5) with Chrome Pull & Brass/Silver Index Frame -->
  <rect x="24.0" y="81.0" width="80.0" height="25.2" rx="2.0" fill="url(#lowerDrawer)" stroke="#848a98" stroke-width="0.8"/>
  <path d="M 25.2,105.2 L 25.2,82.1 L 102.8,82.1" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Recessed index label holder -->
  <rect x="55.0" y="85.0" width="18.0" height="6.2" rx="0.8" fill="#ffffff" stroke="#8a909e" stroke-width="0.7"/>
  <line x1="57.2" y1="87.4" x2="70.8" y2="87.4" stroke="#4a5262" stroke-width="0.85"/>
  <line x1="57.2" y1="89.4" x2="67.5" y2="89.4" stroke="#7a8292" stroke-width="0.75"/>
  <!-- Lower drawer 3D chrome arch handle + cast shadow -->
  <rect x="51.0" y="96.6" width="26.0" height="4.2" rx="2.0" fill="#000000" fill-opacity="0.24" filter="url(#contactBlur)"/>
  <path d="M 51.5,95.5 C 51.5,93.6 53.0,92.8 55.2,92.8 L 72.8,92.8 C 75.0,92.8 76.5,93.6 76.5,95.5 L 76.5,97.2 L 73.2,97.2 L 73.2,95.6 L 54.8,95.6 L 54.8,97.2 L 51.5,97.2 Z"
        fill="url(#chromeHandle)" stroke="#4c515c" stroke-width="0.6"/>

  <!-- 3. Recessed Upper Drawer Cavity & Open Sliding Drawer Box! -->
  <!-- Dark interior cabinet cavity -->
  <rect x="24.0" y="36.5" width="80.0" height="36.0" rx="1.8" fill="#1e222b"/>

  <!-- Open drawer side rails extending forward -->
  <polygon points="24.0,42.0 28.5,36.8 28.5,58.0 21.0,62.0" fill="#b4bac6" stroke="#6c7280" stroke-width="0.7"/>
  <polygon points="104.0,42.0 99.5,36.8 99.5,58.0 107.0,62.0" fill="#9ea5b2" stroke="#6c7280" stroke-width="0.7"/>

  <!-- Vivid Fanned 10.2 Translucent Aqua Tabbed File Folders Inside Open Drawer! -->
  <!-- Rear folder 1: Ruby Aqua with left tab -->
  <path d="M 28.5,56.0 L 28.5,31.5 C 28.5,29.5 30.0,28.2 32.2,28.2 L 47.5,28.2 C 49.5,28.2 50.8,29.4 51.8,31.6 L 52.8,33.5 L 97.5,33.5 C 99.2,33.5 100.2,34.6 100.2,36.4 L 100.2,56.0 Z"
        fill="url(#tabRuby)" stroke="#9e1c2c" stroke-width="0.75"/>
  <path d="M 29.5,31.2 C 29.8,29.8 30.8,29.2 32.5,29.2 L 47.2,29.2 C 48.8,29.2 49.8,30.0 50.8,32.0 L 51.8,34.4 L 99.0,34.4"
        fill="none" stroke="#ffffff" stroke-width="1.05" opacity="0.82"/>

  <!-- Middle folder 2: Emerald Aqua with center tab -->
  <path d="M 27.0,58.0 L 27.0,38.0 C 27.0,36.4 28.2,35.4 30.0,35.4 L 52.0,35.4 L 53.6,32.2 C 54.5,30.6 55.8,29.8 57.8,29.8 L 73.5,29.8 C 75.5,29.8 76.8,30.6 77.7,32.2 L 79.3,35.4 L 98.0,35.4 C 99.8,35.4 101.0,36.4 101.0,38.0 L 101.0,58.0 Z"
        fill="url(#tabEmerald)" stroke="#187840" stroke-width="0.75"/>
  <path d="M 28.2,36.4 L 52.4,36.4 L 54.2,32.8 C 55.0,31.4 56.0,30.8 57.8,30.8 L 73.5,30.8 C 75.2,30.8 76.2,31.4 77.0,32.8 L 78.8,36.4 L 99.8,36.4"
        fill="none" stroke="#ffffff" stroke-width="1.05" opacity="0.85"/>

  <!-- Crisp white document sheet peeking out of front Aqua Blue folder -->
  <rect x="30.5" y="38.2" width="67.0" height="19.0" rx="1.0" fill="#ffffff" stroke="#c2d4ea" stroke-width="0.6"/>

  <!-- Foreground Hero Folder 3: Signature 10.2 Sky-Blue Aqua Acrylic with right tab! -->
  <path d="M 25.5,60.0 L 25.5,43.0 C 25.5,41.2 26.8,40.0 28.8,40.0 L 73.0,40.0 L 74.8,36.4 C 75.6,34.8 77.0,34.0 79.0,34.0 L 96.5,34.0 C 98.8,34.0 100.5,35.4 100.8,37.8 L 102.5,60.0 Z"
        fill="url(#tabAquaBlue)" stroke="#245ea8" stroke-width="0.8"/>
  <path d="M 26.8,41.1 L 73.5,41.1 L 75.4,37.2 C 76.2,35.8 77.2,35.1 79.0,35.1 L 96.2,35.1 C 98.0,35.1 99.4,36.0 99.8,37.6"
        fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.92"/>

  <!-- Protruding Open Upper Drawer Front Face (x=20.5..107.5, y=54.5..78.5) casting deep 3D shadow onto cabinet! -->
  <rect x="21.0" y="59.0" width="86.0" height="22.5" rx="2.5" fill="#000818" fill-opacity="0.38" filter="url(#drawerShadow)"/>
  <rect x="20.5" y="54.5" width="87.0" height="24.0" rx="2.2" fill="url(#drawerFace)" stroke="#757c8a" stroke-width="0.85"/>
  <rect x="21.5" y="55.5" width="85.0" height="22.0" rx="1.6" fill="url(#cabStripes)"/>
  <!-- Crisp sunlit top bevel of protruding open drawer -->
  <line x1="21.8" y1="55.7" x2="106.2" y2="55.7" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Upper drawer 3D mirror-chrome handle & cast shadow -->
  <rect x="49.5" y="68.0" width="29.0" height="4.8" rx="2.2" fill="#000000" fill-opacity="0.28" filter="url(#contactBlur)"/>
  <path d="M 50.0,66.2 C 50.0,64.0 51.6,63.0 54.0,63.0 L 74.0,63.0 C 76.4,63.0 78.0,64.0 78.0,66.2 L 78.0,68.2 L 74.4,68.2 L 74.4,66.2 L 53.6,66.2 L 53.6,68.2 L 50.0,68.2 Z"
        fill="url(#chromeHandle)" stroke="#454a56" stroke-width="0.65"/>
  <line x1="52.0" y1="63.8" x2="76.0" y2="63.8" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round"/>
</svg>
