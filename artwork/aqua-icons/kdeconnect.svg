<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="dispShell" x1="48" y1="18" x2="48" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.60" stop-color="#e5e9f0"/>
      <stop offset="1.00" stop-color="#c2c8d4"/>
    </linearGradient>
    <linearGradient id="aquaScreen" x1="48" y1="25" x2="48" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#0b2d78"/>
      <stop offset="0.55" stop-color="#2270db"/>
      <stop offset="1.00" stop-color="#8ae0ff"/>
    </linearGradient>
    <linearGradient id="handsetBody" x1="70" y1="42" x2="112" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#dfe4ed"/>
      <stop offset="0.78" stop-color="#a8b0bf"/>
      <stop offset="1.00" stop-color="#cfd5e2"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="112.5" rx="46" ry="6.0" fill="#071229" fill-opacity="0.32" filter="url(#floorBlur)"/>

  <!-- Background Apple Studio Display -->
  <path d="M40,84 L58,84 L63,98 L35,98 Z" fill="#cfd4de" stroke="#7d8492" stroke-width="0.8"/>
  <ellipse cx="49" cy="99" rx="20" ry="3.8" fill="#eef1f6" stroke="#8a919f" stroke-width="0.8"/>
  <rect x="13" y="18" width="74" height="66" rx="6" fill="url(#dispShell)" stroke="#7a8291" stroke-width="0.9"/>
  <rect x="20" y="25" width="60" height="50" rx="2" fill="url(#aquaScreen)" stroke="#112c63" stroke-width="0.8"/>
  <ellipse cx="50" cy="34" rx="26" ry="8" fill="#ffffff" fill-opacity="0.28"/>

  <!-- Luminous Sapphire AirPort Sync Waves bridging display & phone -->
  <g fill="none" stroke-linecap="round">
    <path d="M50,58 A22,22 0 0,1 72,36" stroke="#42b8ff" stroke-width="5.0" stroke-opacity="0.40" filter="url(#softGlow)"/>
    <path d="M55,63 A15,15 0 0,1 70,48" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M48,59 A23,23 0 0,1 71,36" stroke="#9be8ff" stroke-width="2.4"/>
    <circle cx="62" cy="65" r="2.8" fill="#ffffff"/>
  </g>

  <!-- Foreground 2002 Brushed-Titanium Wireless Handset -->
  <g>
    <rect x="72" y="44" width="38" height="66" rx="8" fill="#000000" fill-opacity="0.34" transform="translate(1.5, 3)" filter="url(#dropShadow)"/>
    <!-- Stubby wireless antenna -->
    <rect x="99" y="34" width="5.5" height="14" rx="2.7" fill="#3a404d"/>
    <rect x="72" y="44" width="38" height="66" rx="8" fill="url(#handsetBody)" stroke="#59606e" stroke-width="0.9"/>
    <rect x="77" y="52" width="28" height="33" rx="2.5" fill="url(#aquaScreen)" stroke="#10306b" stroke-width="0.75"/>
    <ellipse cx="91" cy="58" rx="11" ry="4" fill="#ffffff" fill-opacity="0.35"/>
    <!-- Illuminated silver keypad chiclet dots -->
    <g fill="#5b6373">
      <rect x="79" y="90" width="6.5" height="3.5" rx="1"/><rect x="87.8" y="90" width="6.5" height="3.5" rx="1"/><rect x="96.5" y="90" width="6.5" height="3.5" rx="1"/>
      <rect x="79" y="96" width="6.5" height="3.5" rx="1"/><rect x="87.8" y="96" width="6.5" height="3.5" rx="1"/><rect x="96.5" y="96" width="6.5" height="3.5" rx="1"/>
      <rect x="79" y="102" width="6.5" height="3.5" rx="1"/><rect x="87.8" y="102" width="6.5" height="3.5" rx="1"/><rect x="96.5" y="102" width="6.5" height="3.5" rx="1"/>
    </g>
  </g>
</svg>
