<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft overhead floor & awning shadows (matching 10.2 user-home i-020.png & i-016.png) -->
    <filter id="floorBlur" x="-25%" y="-40%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <filter id="eaveShadow" x="-15%" y="-20%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <!-- Turned walnut stall legs -->
    <linearGradient id="woodLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#583316"/>
      <stop offset="0.32" stop-color="#a86b36"/>
      <stop offset="0.68" stop-color="#7c4a21"/>
      <stop offset="1.00" stop-color="#472810"/>
    </linearGradient>

    <!-- Carved Honey-Oak Counter Box (sampled i-020.png oak palette) -->
    <linearGradient id="oakFront" x1="64" y1="88" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e5a869"/>
      <stop offset="0.18" stop-color="#cb8644"/>
      <stop offset="0.72" stop-color="#9e5e26"/>
      <stop offset="1.00" stop-color="#6b3b14"/>
    </linearGradient>
    <linearGradient id="oakPostL" x1="12" y1="44" x2="22" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8c5222"/>
      <stop offset="0.45" stop-color="#cf8b49"/>
      <stop offset="1.00" stop-color="#754219"/>
    </linearGradient>
    <linearGradient id="oakPostR" x1="106" y1="44" x2="116" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#754219"/>
      <stop offset="0.55" stop-color="#cf8b49"/>
      <stop offset="1.00" stop-color="#854b1e"/>
    </linearGradient>

    <!-- Fine horizontal oak woodgrain -->
    <pattern id="oakGrain" width="24" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0.8" x2="24" y2="0.8" stroke="#f8ca94" stroke-width="0.5" stroke-opacity="0.22"/>
      <line x1="0" y1="2.1" x2="24" y2="2.1" stroke="#4a2408" stroke-width="0.5" stroke-opacity="0.16"/>
    </pattern>

    <!-- Deep shadowed stall interior -->
    <linearGradient id="stallCave" x1="64" y1="42" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#261509"/>
      <stop offset="0.52" stop-color="#472a14"/>
      <stop offset="1.00" stop-color="#694121"/>
    </linearGradient>

    <!-- 1. Back-center Translucent Aqua Teal-Sapphire Cube (modelled on 10.2 Package cube i-016.png) -->
    <linearGradient id="aquaCube" x1="46" y1="50" x2="80" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#dcfff4"/>
      <stop offset="0.30" stop-color="#6ef0c8"/>
      <stop offset="0.72" stop-color="#2698dc"/>
      <stop offset="1.00" stop-color="#195eb8"/>
    </linearGradient>

    <!-- 2. Front-left Glowing Tangerine-Amber Aqua Glass Cone -->
    <linearGradient id="amberCone" x1="44" y1="62" x2="46" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff799"/>
      <stop offset="0.35" stop-color="#ff9e2c"/>
      <stop offset="0.78" stop-color="#e83820"/>
      <stop offset="1.00" stop-color="#ff8548"/>
    </linearGradient>

    <!-- 3. Front-right Luminous Orchid-Amethyst Aqua Glass Sphere -->
    <linearGradient id="orchidOrb" x1="84" y1="60" x2="84" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#3f127a"/>
      <stop offset="0.35" stop-color="#9e44df"/>
      <stop offset="0.76" stop-color="#ea96ff"/>
      <stop offset="1.00" stop-color="#fff0ff"/>
    </linearGradient>

    <!-- Crisp 3D Woven Canvas Awning: Scarlet & Ivory Stripes -->
    <linearGradient id="redRoof" x1="64" y1="14" x2="64" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ff786e"/>
      <stop offset="0.18" stop-color="#f6433c"/>
      <stop offset="0.82" stop-color="#d42026"/>
      <stop offset="1.00" stop-color="#b5151c"/>
    </linearGradient>
    <linearGradient id="whiteRoof" x1="64" y1="14" x2="64" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f6f8"/>
      <stop offset="0.90" stop-color="#e2e4ea"/>
      <stop offset="1.00" stop-color="#cfd2da"/>
    </linearGradient>
    <linearGradient id="redFlap" x1="64" y1="42" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e6282e"/>
      <stop offset="0.55" stop-color="#c81820"/>
      <stop offset="1.00" stop-color="#980e15"/>
    </linearGradient>
    <linearGradient id="whiteFlap" x1="64" y1="42" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ebedf2"/>
      <stop offset="0.55" stop-color="#d6d9e0"/>
      <stop offset="1.00" stop-color="#b4b8c2"/>
    </linearGradient>

    <!-- Subtle canvas weave texture -->
    <pattern id="canvasWeave" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.5" height="1" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1.5" y="1.5" width="1.5" height="1" fill="#000000" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="clipAlcove">
      <rect x="20.5" y="40.0" width="87.0" height="51.5" rx="2.0"/>
    </clipPath>
    <clipPath id="clipAwningRoof">
      <path d="M 15.5,14.0 L 112.5,14.0 C 115.8,14.0 118.2,16.2 119.0,19.5 L 123.0,42.0 L 5.0,42.0 L 9.0,19.5 C 9.8,16.2 12.2,14.0 15.5,14.0 Z"/>
    </clipPath>
  </defs>

  <!-- Overhead Ambient Floor Shadow + Leg Contact Shadows -->
  <ellipse cx="64" cy="113.5" rx="48" ry="6.8" fill="#000000" fill-opacity="0.28" filter="url(#floorBlur)"/>
  <ellipse cx="27" cy="115.2" rx="9.5" ry="3.0" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>
  <ellipse cx="101" cy="115.2" rx="9.5" ry="3.0" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>

  <!-- Turned Cylindrical Walnut Feet (x=21..33 & x=95..107, y=100..116) -->
  <path d="M 21.0,100.0 L 33.0,100.0 L 32.4,111.5 C 32.2,114.6 29.9,116.5 27.0,116.5 C 24.1,116.5 21.8,114.6 21.6,111.5 Z"
        fill="url(#woodLeg)" stroke="#3e220c" stroke-width="0.7"/>
  <path d="M 95.0,100.0 L 107.0,100.0 L 106.4,111.5 C 106.2,114.6 103.9,116.5 101.0,116.5 C 98.1,116.5 95.8,114.6 95.6,111.5 Z"
        fill="url(#woodLeg)" stroke="#3e220c" stroke-width="0.7"/>

  <!-- Main Honey-Oak Stall Frame & Side Posts -->
  <rect x="12.5" y="38.0" width="103.0" height="71.0" rx="9.5" fill="url(#oakFront)" stroke="#522c0e" stroke-width="0.85"/>
  <rect x="12.5" y="38.0" width="9.0" height="56.0" rx="2.0" fill="url(#oakPostL)"/>
  <rect x="106.5" y="38.0" width="9.0" height="56.0" rx="2.0" fill="url(#oakPostR)"/>
  <rect x="12.5" y="38.0" width="103.0" height="71.0" rx="9.5" fill="url(#oakGrain)"/>

  <!-- Deep Shadowed Display Alcove & Treasures Sitting Inside Stall -->
  <g clip-path="url(#clipAlcove)">
    <rect x="20.5" y="40.0" width="87.0" height="51.5" fill="url(#stallCave)"/>
    <!-- Horizontal back-board slat line -->
    <line x1="20.5" y1="68.0" x2="107.5" y2="68.0" stroke="#1e1006" stroke-width="1.0" stroke-opacity="0.55"/>
    <line x1="20.5" y1="69.0" x2="107.5" y2="69.0" stroke="#85552c" stroke-width="0.7" stroke-opacity="0.35"/>

    <!-- 1. Back-center Translucent Aqua Teal-Sapphire Glass Cube -->
    <rect x="46.5" y="51.5" width="33.0" height="36.0" rx="5.0" fill="#120904" fill-opacity="0.45" transform="translate(0, 2.2)" filter="url(#contactBlur)"/>
    <rect x="46.5" y="51.5" width="33.0" height="36.0" rx="5.0" fill="url(#aquaCube)" stroke="#186098" stroke-width="0.75"/>
    <!-- Glossy top half of Aqua cube -->
    <path d="M 48.0,58.0 C 48.0,53.5 50.0,52.8 53.5,52.8 L 72.5,52.8 C 76.0,52.8 78.0,53.5 78.0,58.0 L 78.0,66.5 C 68.0,63.5 58.0,64.5 48.0,68.5 Z"
          fill="#ffffff" fill-opacity="0.42"/>
    <path d="M 48.2,56.5 C 48.5,53.8 50.4,52.8 53.5,52.8 L 72.5,52.8 C 75.6,52.8 77.5,53.8 77.8,56.5"
          fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round"/>

    <!-- 2. Front-left Glowing Tangerine-Amber Aqua Glass Cone -->
    <path d="M 40.2,65.5 C 42.2,62.0 46.8,62.0 48.8,65.5 L 62.5,89.5 C 64.0,92.2 62.2,94.5 59.0,94.5 L 30.0,94.5 C 26.8,94.5 25.0,92.2 26.5,89.5 Z"
          fill="#1a0902" fill-opacity="0.42" transform="translate(0, 1.8)" filter="url(#contactBlur)"/>
    <path d="M 40.2,65.5 C 42.2,62.0 46.8,62.0 48.8,65.5 L 62.5,89.5 C 64.0,92.2 62.2,94.5 59.0,94.5 L 30.0,94.5 C 26.8,94.5 25.0,92.2 26.5,89.5 Z"
          fill="url(#amberCone)" stroke="#b82414" stroke-width="0.75"/>
    <!-- Specular glass highlight along left slope of cone -->
    <path d="M 43.2,64.8 L 30.8,88.0 L 38.5,88.0 L 45.2,64.8 Z" fill="#ffffff" fill-opacity="0.38"/>
    <path d="M 41.2,66.2 L 28.8,89.2" fill="none" stroke="#fffce0" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <!-- 3. Front-right Luminous Orchid-Amethyst Aqua Glass Sphere -->
    <circle cx="84.0" cy="79.5" r="16.8" fill="#180814" fill-opacity="0.44" transform="translate(0, 2.0)" filter="url(#contactBlur)"/>
    <circle cx="84.0" cy="79.5" r="16.8" fill="url(#orchidOrb)" stroke="#4c1888" stroke-width="0.75"/>
    <!-- Curved top Aqua glass specular cap on sphere -->
    <ellipse cx="84.0" cy="69.2" rx="11.5" ry="5.6" fill="#ffffff" fill-opacity="0.52"/>
    <circle cx="84.0" cy="88.5" r="9.5" fill="#ffffff" fill-opacity="0.28" filter="url(#softGlow)"/>

    <!-- Deep overhead cast shadow from scalloped awning onto top of alcove & treasures! -->
    <path d="M 17,40 L 111,40 L 111,60 C 103,64 95,60 90,56 C 84,62 74,62 68,56 C 62,62 52,62 46,56 C 40,62 30,62 24,56 Z"
          fill="#0f0702" fill-opacity="0.56" filter="url(#eaveShadow)"/>
  </g>

  <!-- Sunlit Carved Oak Front Counter Sill & Apron (covering bottoms of objects cleanly!) -->
  <rect x="13.2" y="90.0" width="101.6" height="18.5" rx="8.8" fill="url(#oakFront)"/>
  <rect x="13.2" y="90.0" width="101.6" height="18.5" rx="8.8" fill="url(#oakGrain)"/>
  <!-- Bright sunlit top counter lip -->
  <rect x="18.0" y="90.0" width="92.0" height="3.8" rx="1.5" fill="#f5c68c" fill-opacity="0.65"/>
  <line x1="18.5" y1="90.4" x2="109.5" y2="90.4" stroke="#fff2dc" stroke-width="1.15" stroke-linecap="round"/>
  <line x1="18.0" y1="94.2" x2="110.0" y2="94.2" stroke="#683a14" stroke-width="0.85" stroke-opacity="0.65"/>
  <!-- Recessed front counter bevel -->
  <rect x="23.0" y="96.8" width="82.0" height="7.8" rx="2.2" fill="none" stroke="#623512" stroke-width="0.75" stroke-opacity="0.55"/>
  <line x1="24.2" y1="104.8" x2="103.8" y2="104.8" stroke="#f0b878" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Soft shadow cast by awning scallops onto wooden side posts -->
  <ellipse cx="16.5" cy="56.5" rx="6" ry="3.5" fill="#000000" fill-opacity="0.35" filter="url(#contactBlur)"/>
  <ellipse cx="111.5" cy="56.5" rx="6" ry="3.5" fill="#000000" fill-opacity="0.35" filter="url(#contactBlur)"/>

  <!-- 5 Hanging Scalloped Canvas Valance Flaps (y=41.5..55.5, 5 x 23.6px = 118px across x=5..123) -->
  <g>
    <!-- Flap 1 (Scarlet, x=5.0..28.6) -->
    <path d="M 5.0,41.5 L 28.6,41.5 L 28.6,44.2 A 11.8,11.2 0 0 1 5.0,44.2 Z" fill="url(#redFlap)" stroke="#8c1016" stroke-width="0.65"/>
    <!-- Flap 2 (Ivory, x=28.6..52.2) -->
    <path d="M 28.6,41.5 L 52.2,41.5 L 52.2,44.2 A 11.8,11.2 0 0 1 28.6,44.2 Z" fill="url(#whiteFlap)" stroke="#9ca0aa" stroke-width="0.65"/>
    <!-- Flap 3 (Scarlet, x=52.2..75.8) -->
    <path d="M 52.2,41.5 L 75.8,41.5 L 75.8,44.2 A 11.8,11.2 0 0 1 52.2,44.2 Z" fill="url(#redFlap)" stroke="#8c1016" stroke-width="0.65"/>
    <!-- Flap 4 (Ivory, x=75.8..99.4) -->
    <path d="M 75.8,41.5 L 99.4,41.5 L 99.4,44.2 A 11.8,11.2 0 0 1 75.8,44.2 Z" fill="url(#whiteFlap)" stroke="#9ca0aa" stroke-width="0.65"/>
    <!-- Flap 5 (Scarlet, x=99.4..123.0) -->
    <path d="M 99.4,41.5 L 123.0,41.5 L 123.0,44.2 A 11.8,11.2 0 0 1 99.4,44.2 Z" fill="url(#redFlap)" stroke="#8c1016" stroke-width="0.65"/>
  </g>

  <!-- Sloped 5-Stripe Canvas Awning Roof (y=14.0..42.0) -->
  <g clip-path="url(#clipAwningRoof)">
    <!-- 5 Perspective Stripes converging subtly toward ridge -->
    <polygon points="8.0,14.0 31.2,14.0 28.6,42.0 5.0,42.0" fill="url(#redRoof)"/>
    <polygon points="31.2,14.0 53.1,14.0 52.2,42.0 28.6,42.0" fill="url(#whiteRoof)"/>
    <polygon points="53.1,14.0 74.9,14.0 75.8,42.0 52.2,42.0" fill="url(#redRoof)"/>
    <polygon points="74.9,14.0 96.8,14.0 99.4,42.0 75.8,42.0" fill="url(#whiteRoof)"/>
    <polygon points="96.8,14.0 120.0,14.0 123.0,42.0 99.4,42.0" fill="url(#redRoof)"/>

    <!-- Fine woven canvas texture -->
    <rect x="4" y="14" width="120" height="29" fill="url(#canvasWeave)"/>

    <!-- Subtle stitched seam lines between canvas panels -->
    <g stroke="#000000" stroke-width="0.55" stroke-opacity="0.18">
      <line x1="31.2" y1="14.0" x2="28.6" y2="42.0"/>
      <line x1="53.1" y1="14.0" x2="52.2" y2="42.0"/>
      <line x1="74.9" y1="14.0" x2="75.8" y2="42.0"/>
      <line x1="96.8" y1="14.0" x2="99.4" y2="42.0"/>
    </g>

    <!-- Overhead sunlit highlight along top ridge & front awning knuckle crease! -->
    <line x1="12.0" y1="15.2" x2="116.0" y2="15.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>
    <line x1="5.5" y1="41.2" x2="122.5" y2="41.2" stroke="#ffffff" stroke-width="1.15" opacity="0.62"/>
  </g>

  <!-- Delicate outer canvas edge -->
  <path d="M 15.5,14.0 L 112.5,14.0 C 115.8,14.0 118.2,16.2 119.0,19.5 L 123.0,42.0 L 5.0,42.0 L 9.0,19.5 C 9.8,16.2 12.2,14.0 15.5,14.0 Z"
        fill="none" stroke="#962428" stroke-width="0.7" stroke-opacity="0.65"/>
</svg>
