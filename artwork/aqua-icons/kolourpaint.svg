<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="birchWood" x1="20" y1="22" x2="106" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffebb8"/>
      <stop offset="0.45" stop-color="#e8be76"/>
      <stop offset="0.85" stop-color="#c48e41"/>
      <stop offset="1.00" stop-color="#a36e24"/>
    </linearGradient>
    <radialGradient id="dabRed" cx="38" cy="56" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ff9ea4"/><stop offset="0.45" stop-color="#e01e2b"/><stop offset="1.00" stop-color="#7d0912"/>
    </radialGradient>
    <radialGradient id="dabYellow" cx="52" cy="39" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff9b8"/><stop offset="0.45" stop-color="#ffc414"/><stop offset="1.00" stop-color="#b37700"/>
    </radialGradient>
    <radialGradient id="dabGreen" cx="75" cy="39" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#b5ffbe"/><stop offset="0.45" stop-color="#22bd4e"/><stop offset="1.00" stop-color="#0a6624"/>
    </radialGradient>
    <radialGradient id="dabBlue" cx="90" cy="56" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ace8ff"/><stop offset="0.45" stop-color="#1c74e8"/><stop offset="1.00" stop-color="#09347a"/>
    </radialGradient>
    <radialGradient id="dabPurple" cx="84" cy="78" r="9.5" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ecc2ff"/><stop offset="0.45" stop-color="#8a2be2"/><stop offset="1.00" stop-color="#420c78"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="112" rx="46" ry="6.0" fill="#241404" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <ellipse cx="62" cy="109.5" rx="28" ry="3.2" fill="#000000" fill-opacity="0.44" filter="url(#contactBlur)"/>

  <!-- Sculpted Wooden Artist Palette with cut-out thumbhole -->
  <path d="M62,23 C92,22 113,43 111,69 C109,94 87,109 61,108 C41,107 24,96 22,82 C20,71 32,68 37,63 C41,58 35,50 26,47 C18,44 27,24 62,23 Z M52,82 A8.5,6.8 0 1,0 52,95.6 A8.5,6.8 0 1,0 52,82 Z" fill="#6e4411" fill-rule="evenodd" transform="translate(0, 3.2)"/>
  <path d="M62,23 C92,22 113,43 111,69 C109,94 87,109 61,108 C41,107 24,96 22,82 C20,71 32,68 37,63 C41,58 35,50 26,47 C18,44 27,24 62,23 Z M52,82 A8.5,6.8 0 1,0 52,95.6 A8.5,6.8 0 1,0 52,82 Z" fill="url(#birchWood)" fill-rule="evenodd" stroke="#7d4f16" stroke-width="0.85"/>

  <!-- 5 Impasto Glossy Aqua Paint Dabs -->
  <g>
    <ellipse cx="39" cy="58" rx="9.5" ry="7.8" fill="url(#dabRed)"/><ellipse cx="37" cy="55" rx="4" ry="2" fill="#ffffff" fill-opacity="0.68"/>
    <ellipse cx="53" cy="40" rx="9.5" ry="7.8" fill="url(#dabYellow)"/><ellipse cx="51" cy="37" rx="4" ry="2" fill="#ffffff" fill-opacity="0.72"/>
    <ellipse cx="76" cy="40" rx="9.5" ry="7.8" fill="url(#dabGreen)"/><ellipse cx="74" cy="37" rx="4" ry="2" fill="#ffffff" fill-opacity="0.68"/>
    <ellipse cx="92" cy="57" rx="9.5" ry="7.8" fill="url(#dabBlue)"/><ellipse cx="90" cy="54" rx="4" ry="2" fill="#ffffff" fill-opacity="0.68"/>
    <ellipse cx="85" cy="79" rx="9.0" ry="7.4" fill="url(#dabPurple)"/><ellipse cx="83" cy="76" rx="3.8" ry="1.9" fill="#ffffff" fill-opacity="0.68"/>
  </g>

  <!-- Diagonal Mahogany & Spun-Chrome Artist Paintbrush dipped in Sapphire Blue -->
  <g transform="translate(88, 12) rotate(38)">
    <rect x="1.5" y="4" width="8.5" height="96" rx="3.5" fill="#000000" fill-opacity="0.34" transform="translate(2.5, 3)" filter="url(#softGlow)"/>
    <path d="M2.2,0 Q4.5,-2 6.8,0 L8.2,62 H0.8 Z" fill="#8f2b1b" stroke="#4d140b" stroke-width="0.6"/>
    <line x1="3.4" y1="2" x2="2.8" y2="61" stroke="#ffb39e" stroke-width="1.1" stroke-opacity="0.55"/>
    <!-- Chrome ferrule -->
    <rect x="0.4" y="62" width="8.2" height="15" rx="0.8" fill="#e5e9f2" stroke="#525866" stroke-width="0.6"/>
    <line x1="0.8" y1="66" x2="8.2" y2="66" stroke="#6c7382" stroke-width="0.7"/>
    <line x1="0.8" y1="73" x2="8.2" y2="73" stroke="#6c7382" stroke-width="0.7"/>
    <!-- Sable bristles tipped in glossy cyan-blue paint -->
    <path d="M0.8,77 C0.2,87 2.2,95 4.5,100 C7.5,94 8.8,86 8.2,77 Z" fill="#4f331c"/>
    <path d="M1.6,88 C2.4,94 3.5,98 4.5,100 C6.2,96 7.2,92 7.5,87 C5.5,89 3.5,89 1.6,88 Z" fill="#248aff"/>
  </g>
</svg>
