<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="hddTop" x1="64" y1="18" x2="64" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f6f7fb"/>
      <stop offset="0.45" stop-color="#d4d7e0"/>
      <stop offset="0.92" stop-color="#b4b8c4"/>
      <stop offset="1.00" stop-color="#f2f4f8"/>
    </linearGradient>
    <linearGradient id="hddFront" x1="14" y1="94" x2="114" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#595d69"/>
      <stop offset="0.50" stop-color="#3c404a"/>
      <stop offset="1.00" stop-color="#282b33"/>
    </linearGradient>
    <linearGradient id="secBlue" x1="34" y1="30" x2="90" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8ae0ff"/><stop offset="0.50" stop-color="#1e72e6"/><stop offset="1.00" stop-color="#0b3882"/>
    </linearGradient>
    <linearGradient id="secGreen" x1="34" y1="34" x2="64" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#9effb8"/><stop offset="0.50" stop-color="#1db856"/><stop offset="1.00" stop-color="#0a5e28"/>
    </linearGradient>
    <linearGradient id="secAmber" x1="64" y1="54" x2="96" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffe680"/><stop offset="0.50" stop-color="#f08216"/><stop offset="1.00" stop-color="#993c06"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="112.5" rx="50" ry="6.2" fill="#080c14" fill-opacity="0.35" filter="url(#floorBlur)"/>
  <rect x="16" y="107.5" width="96" height="4.5" rx="2" fill="#000000" fill-opacity="0.48" filter="url(#contactBlur)"/>

  <!-- 10.2 Perspective Die-Cast Aluminum Hard Disk Chassis (matching drive-harddisk.svg) -->
  <path d="M25,20 H103 L114,94 H14 Z" fill="url(#hddTop)" stroke="#727784" stroke-width="0.9"/>
  <path d="M14,94 H114 V107 Q114,110 110,110 H18 Q14,110 14,107 Z" fill="url(#hddFront)" stroke="#23262e" stroke-width="0.9"/>
  <line x1="15" y1="94.5" x2="113" y2="94.5" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85"/>
  <circle cx="101" cy="102" r="2.5" fill="#a8ff38"/>

  <!-- Recessed platter well + 3 Glossy Aqua Partition Pie Sectors -->
  <ellipse cx="64" cy="55" rx="34" ry="26" fill="#252932" stroke="#ffffff" stroke-width="0.9"/>
  <!-- Sector 1: Sapphire (root) -->
  <path d="M64,55 L33,48 A32,24.5 0 0,1 93,45 Z" fill="url(#secBlue)" stroke="#0d3578" stroke-width="0.6"/>
  <!-- Sector 2: Emerald (home) -->
  <path d="M64,55 L61,79.5 A32,24.5 0 0,1 33,48 Z" fill="url(#secGreen)" stroke="#0a5926" stroke-width="0.6"/>
  <!-- Sector 3: Amber (swap/data, slightly exploded!) -->
  <path d="M65.5,56 L94.5,46 A32,24.5 0 0,1 62.5,80.5 Z" fill="url(#secAmber)" stroke="#8c3605" stroke-width="0.6"/>
  <!-- Specular glass sheen & chrome spindle hub -->
  <ellipse cx="64" cy="43" rx="22" ry="9" fill="#ffffff" fill-opacity="0.36"/>
  <ellipse cx="64" cy="55" rx="8.5" ry="6.5" fill="#f0f3f8" stroke="#535966" stroke-width="0.8"/>
  <ellipse cx="64" cy="55" rx="3.2" ry="2.4" fill="#3a404d"/>

  <!-- Chrome actuator arm -->
  <path d="M27,83 L52,61 L48,58 L22,79 Z" fill="#eef1f7" stroke="#565c69" stroke-width="0.7"/>
  <circle cx="25" cy="81" r="4.5" fill="#d8dce6" stroke="#565c69" stroke-width="0.7"/>
</svg>
