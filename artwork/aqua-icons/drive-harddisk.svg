<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft overhead desk shadow (HIG Fig. 11-14 / i-017.png bottom-center) -->
    <filter id="deskShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
    <filter id="contactShadow" x="-15%" y="-30%" width="130%" height="170%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="embossBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="ledGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- Die-cast satin aluminum top cover (sampled i-017.png: #f2f2f6 -> #ceced5 -> #b6b5bb) -->
    <linearGradient id="aluCover" x1="64" y1="19" x2="64" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f5f5f9"/>
      <stop offset="0.06" stop-color="#dedee5"/>
      <stop offset="0.45" stop-color="#cbcbd2"/>
      <stop offset="0.86" stop-color="#b7b6bd"/>
      <stop offset="0.96" stop-color="#aeacb4"/>
      <stop offset="1.00" stop-color="#f2f2f7"/>
    </linearGradient>

    <!-- Subtle radial sheen across aluminum cover -->
    <radialGradient id="coverSheen" cx="56" cy="36" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1.0" stop-color="#6e6e78" stop-opacity="0.10"/>
    </radialGradient>

    <!-- Stamped platter recess shading (pure light/shadow relief, zero wireframe lines) -->
    <linearGradient id="platterWell" x1="64" y1="39" x2="64" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#a8a8b0"/>
      <stop offset="0.28" stop-color="#bebec6"/>
      <stop offset="0.72" stop-color="#ccccd4"/>
      <stop offset="1.00" stop-color="#dcdce4"/>
    </linearGradient>

    <!-- Raised central spindle ring -->
    <linearGradient id="spindleRing" x1="64" y1="54" x2="64" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f3f3f8"/>
      <stop offset="0.48" stop-color="#c6c6ce"/>
      <stop offset="1.00" stop-color="#96969f"/>
    </linearGradient>
    <linearGradient id="spindleCore" x1="64" y1="57" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#9e9ea7"/>
      <stop offset="0.50" stop-color="#bebec6"/>
      <stop offset="1.00" stop-color="#dfdfe7"/>
    </linearGradient>

    <!-- Front chassis side mounting cheeks -->
    <linearGradient id="frontCheek" x1="64" y1="92" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ececf2"/>
      <stop offset="0.16" stop-color="#bebdc5"/>
      <stop offset="0.62" stop-color="#8b8a93"/>
      <stop offset="0.90" stop-color="#66656e"/>
      <stop offset="1.00" stop-color="#4b4a52"/>
    </linearGradient>

    <!-- Recessed gunmetal front bay -->
    <linearGradient id="frontBay" x1="24" y1="94" x2="104" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#1e1f25"/>
      <stop offset="0.28" stop-color="#3c3d46"/>
      <stop offset="0.62" stop-color="#585963"/>
      <stop offset="0.88" stop-color="#484952"/>
      <stop offset="1.00" stop-color="#2c2d34"/>
    </linearGradient>

    <!-- Curved inner front bay scoop -->
    <linearGradient id="bayScoop" x1="30" y1="95" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#18191f"/>
      <stop offset="0.45" stop-color="#474852"/>
      <stop offset="1.00" stop-color="#6c6d78"/>
    </linearGradient>

    <!-- Glowing chartreuse-lime activity LED -->
    <radialGradient id="limeLed" cx="96.5" cy="103.5" r="3.2" fx="96.0" fy="102.8" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ebff54"/>
      <stop offset="0.78" stop-color="#9ad418"/>
      <stop offset="1.00" stop-color="#456b08"/>
    </radialGradient>

    <!-- Perspective top-cover silhouette -->
    <path id="topPlate" d="M 28.5,20.0 L 99.5,20.0 C 102.4,20.0 104.2,21.5 104.7,24.2 L 114.2,89.2 C 114.6,91.8 112.9,93.5 109.8,93.5 L 18.2,93.5 C 15.1,93.5 13.4,91.8 13.8,89.2 L 23.3,24.2 C 23.8,21.5 25.6,20.0 28.5,20.0 Z"/>
    <clipPath id="clipTop">
      <use href="#topPlate"/>
    </clipPath>
  </defs>

  <!-- Soft ambient desk shadow + tight bottom chassis contact shadow -->
  <ellipse cx="64" cy="111.5" rx="52" ry="6.2" fill="#000000" fill-opacity="0.34" filter="url(#deskShadow)"/>
  <rect x="15" y="108.5" width="98" height="4.5" rx="2.2" fill="#000000" fill-opacity="0.52" filter="url(#contactShadow)"/>

  <!-- 3D Front Chassis Body (y=90..111) -->
  <path d="M 13.8,89.8 L 114.2,89.8 L 113.4,107.2 C 113.2,109.6 111.4,111.0 108.8,111.0 L 19.2,111.0 C 16.6,111.0 14.8,109.6 14.6,107.2 Z"
        fill="url(#frontCheek)" stroke="#48474f" stroke-width="0.7"/>

  <!-- Recessed dark gunmetal front bay between mounting cheeks -->
  <path d="M 23.5,93.5 L 104.5,93.5 L 103.8,109.6 L 24.2,109.6 Z" fill="url(#frontBay)"/>
  <!-- Top overhang shadow inside front bay -->
  <rect x="23.5" y="93.5" width="81" height="2.6" fill="#0c0d11" fill-opacity="0.68"/>

  <!-- Left curved cast-metal bay depression (matching i-017.png) -->
  <path d="M 29.0,94.2 L 62.0,94.2 L 62.0,109.2 L 33.5,109.2 C 30.2,106.4 28.8,100.8 29.0,94.2 Z" fill="url(#bayScoop)"/>
  <path d="M 29.0,94.2 C 28.8,100.8 30.2,106.4 33.5,109.2" fill="none" stroke="#858692" stroke-width="0.8" opacity="0.65"/>

  <!-- 9 vertical cooling vent slots on front bay (x=63.5..88.5) -->
  <g fill="#121318">
    <rect x="63.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="66.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="69.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="72.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="75.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="78.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="81.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="84.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
    <rect x="87.5" y="95.0" width="1.7" height="13.4" rx="0.4"/>
  </g>
  <!-- Subtle metallic highlights on ribs between vents -->
  <g fill="#8c8d98" fill-opacity="0.48">
    <rect x="65.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="68.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="71.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="74.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="77.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="80.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="83.3" y="95.2" width="0.8" height="13.0"/>
    <rect x="86.3" y="95.2" width="0.8" height="13.0"/>
  </g>

  <!-- Activity LED bezel & glowing lime-green indicator -->
  <circle cx="96.8" cy="103.8" r="3.6" fill="#d8ff42" fill-opacity="0.38" filter="url(#ledGlow)"/>
  <circle cx="96.8" cy="103.8" r="2.8" fill="#18191e"/>
  <circle cx="96.8" cy="103.8" r="2.0" fill="url(#limeLed)"/>

  <!-- Top Satin Aluminum Cover Plate -->
  <use href="#topPlate" fill="url(#aluCover)"/>

  <g clip-path="url(#clipTop)">
    <rect x="12" y="18" width="104" height="78" fill="url(#coverSheen)"/>

    <!-- Stamped upper-left label boss sweeping into circular platter housing (pure embossed bevels) -->
    <!-- Soft outer recessed shadow of platter & actuator silhouette -->
    <path d="M 33.0,23.5 L 82.5,23.5 C 84.5,23.5 85.8,24.8 86.2,26.8 L 88.2,40.5 C 94.8,45.6 98.5,53.2 98.0,62.2 C 97.2,76.8 82.2,87.5 64.0,87.5 C 45.8,87.5 30.8,76.8 30.0,62.2 C 29.5,52.8 33.8,44.8 41.2,39.8 L 31.2,38.8 C 29.5,38.6 28.6,37.4 29.0,35.5 L 30.8,25.5 C 31.1,24.2 32.0,23.5 33.0,23.5 Z"
          fill="url(#platterWell)"/>

    <!-- Upper inner shadow bevel inside platter depression (overhead light!) -->
    <path d="M 30.5,63.0 C 30.5,48.0 45.5,37.8 64.0,37.8 C 82.5,37.8 97.5,48.0 97.5,63.0"
          fill="none" stroke="#7d7d86" stroke-width="1.9" opacity="0.72" filter="url(#embossBlur)"/>
    <path d="M 31.2,64.2 C 31.2,49.4 45.8,39.4 64.0,39.4 C 82.2,39.4 96.8,49.4 96.8,64.2"
          fill="none" stroke="#f4f4fa" stroke-width="1.0" opacity="0.75"/>

    <!-- Lower sunlit bevel rim of platter depression -->
    <path d="M 30.4,61.8 C 31.2,76.5 46.0,87.0 64.0,87.0 C 82.0,87.0 96.8,76.5 97.6,61.8"
          fill="none" stroke="#f7f7fc" stroke-width="1.8" opacity="0.90"/>
    <path d="M 29.8,63.2 C 30.8,78.0 45.8,88.6 64.0,88.6 C 82.2,88.6 97.2,78.0 98.2,63.2"
          fill="none" stroke="#85858e" stroke-width="1.1" opacity="0.65"/>

    <!-- Raised upper-left label boss bevels -->
    <path d="M 31.0,38.0 L 32.8,24.2 L 83.2,24.2 L 85.8,39.5" fill="#d8d8e0"/>
    <path d="M 32.8,24.2 L 83.2,24.2" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.88"/>
    <path d="M 31.0,38.2 L 54.0,38.2" fill="none" stroke="#8a8a93" stroke-width="1.1" opacity="0.68"/>

    <!-- Recessed black & silver factory spec/barcode label (sampled i-017.png top-left) -->
    <path d="M 35.5,25.8 L 80.5,25.8 L 81.4,34.4 L 34.6,34.4 Z" fill="#18191d" stroke="#f0f0f5" stroke-width="0.6"/>
    <!-- Tiny silver crisp micro-markings & barcode bars on label -->
    <rect x="37.2" y="27.2" width="16" height="1.3" fill="#dcdce2" opacity="0.88"/>
    <rect x="55.5" y="27.2" width="11" height="1.3" fill="#dcdce2" opacity="0.72"/>
    <rect x="68.5" y="27.2" width="9" height="1.3" fill="#dcdce2" opacity="0.85"/>
    <g fill="#e4e4ea" opacity="0.82">
      <rect x="37.0" y="30.0" width="1.1" height="2.8"/>
      <rect x="39.0" y="30.0" width="0.7" height="2.8"/>
      <rect x="40.6" y="30.0" width="1.5" height="2.8"/>
      <rect x="43.0" y="30.0" width="0.8" height="2.8"/>
      <rect x="44.8" y="30.0" width="1.2" height="2.8"/>
      <rect x="47.0" y="30.0" width="0.7" height="2.8"/>
      <rect x="48.6" y="30.0" width="1.6" height="2.8"/>
      <rect x="51.2" y="30.0" width="0.9" height="2.8"/>
      <rect x="53.2" y="30.0" width="1.3" height="2.8"/>
      <rect x="55.6" y="30.0" width="0.8" height="2.8"/>
      <rect x="57.4" y="30.0" width="1.5" height="2.8"/>
      <rect x="60.0" y="30.0" width="0.9" height="2.8"/>
      <rect x="62.0" y="30.0" width="1.2" height="2.8"/>
      <rect x="64.4" y="30.0" width="1.0" height="2.8"/>
    </g>
    <!-- Tiny silver certification badge on right of sticker -->
    <circle cx="74.5" cy="31.2" r="1.9" fill="none" stroke="#e4e4ea" stroke-width="0.75" opacity="0.85"/>
    <circle cx="74.5" cy="31.2" r="0.7" fill="#e4e4ea" opacity="0.85"/>

    <!-- Central raised spindle ring & recessed hub (cx=64, cy=63.5) -->
    <ellipse cx="64" cy="64.5" rx="13.2" ry="10.4" fill="#7c7c85" fill-opacity="0.45" filter="url(#embossBlur)"/>
    <ellipse cx="64" cy="63.5" rx="12.8" ry="10.0" fill="url(#spindleRing)"/>
    <ellipse cx="64" cy="63.5" rx="12.4" ry="9.6" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.85"/>
    <ellipse cx="64" cy="63.7" rx="8.8" ry="6.8" fill="url(#spindleCore)"/>
    <path d="M 55.4,63.7 A 8.6,6.6 0 0 1 72.6,63.7" fill="none" stroke="#76767f" stroke-width="1.0" opacity="0.78"/>
    <path d="M 55.4,63.7 A 8.6,6.6 0 0 0 72.6,63.7" fill="none" stroke="#f6f6fb" stroke-width="0.95" opacity="0.88"/>

    <!-- Right-side stamped vertical channel (i-017.png right groove) -->
    <path d="M 94.0,26.5 L 97.2,26.5 L 103.5,81.5 L 99.8,81.5 Z" fill="#8b8b94" fill-opacity="0.78"/>
    <path d="M 97.2,26.5 L 103.5,81.5" fill="none" stroke="#f6f6fb" stroke-width="1.15" opacity="0.9"/>
    <path d="M 94.0,26.5 L 99.8,81.5" fill="none" stroke="#686870" stroke-width="0.85" opacity="0.75"/>

    <!-- 6 Recessed dark Torx cover screws (4 corners + 2 mid-edges per i-017.png) -->
    <g>
      <!-- Top-left -->
      <ellipse cx="28.5" cy="23.8" rx="2.3" ry="1.8" fill="#f5f5fa"/>
      <ellipse cx="28.5" cy="23.5" rx="1.9" ry="1.45" fill="#2a2b30"/>
      <circle cx="28.5" cy="23.5" r="0.65" fill="#8e9098"/>
      <!-- Top-right -->
      <ellipse cx="99.5" cy="23.8" rx="2.3" ry="1.8" fill="#f5f5fa"/>
      <ellipse cx="99.5" cy="23.5" rx="1.9" ry="1.45" fill="#2a2b30"/>
      <circle cx="99.5" cy="23.5" r="0.65" fill="#8e9098"/>
      <!-- Mid-right -->
      <ellipse cx="105.2" cy="56.5" rx="2.4" ry="1.9" fill="#f5f5fa"/>
      <ellipse cx="105.2" cy="56.2" rx="1.95" ry="1.5" fill="#2a2b30"/>
      <circle cx="105.2" cy="56.2" r="0.65" fill="#8e9098"/>
      <!-- Bottom-left -->
      <ellipse cx="20.8" cy="87.8" rx="2.7" ry="2.1" fill="#f5f5fa"/>
      <ellipse cx="20.8" cy="87.4" rx="2.2" ry="1.7" fill="#25262b"/>
      <circle cx="20.8" cy="87.4" r="0.75" fill="#92949c"/>
      <!-- Bottom-right -->
      <ellipse cx="107.2" cy="87.8" rx="2.7" ry="2.1" fill="#f5f5fa"/>
      <ellipse cx="107.2" cy="87.4" rx="2.2" ry="1.7" fill="#25262b"/>
      <circle cx="107.2" cy="87.4" r="0.75" fill="#92949c"/>
    </g>

    <!-- Crisp specular bevel highlights along top, side & front aluminum edges -->
    <path d="M 27.0,21.0 L 101.0,21.0" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 24.4,23.5 L 15.0,90.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.78"/>
    <path d="M 103.6,23.5 L 113.0,90.5" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.52"/>
    <path d="M 15.5,92.4 L 112.5,92.4" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.92"/>
  </g>

  <!-- Subtle satin-metallic edge definition (no black cartoon stroke) -->
  <use href="#topPlate" fill="none" stroke="#76757e" stroke-width="0.8"/>
</svg>
