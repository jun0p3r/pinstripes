<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 2002 Brushed-Champagne/Aluminum Compact Digital Camera with HIG i-006.png Sapphire Optical Lens -->
    <filter id="floorBlur" x="-25%" y="-40%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="contactBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="lensShadow" x="-25%" y="-25%" width="155%" height="155%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>

    <!-- Brushed satin platinum-champagne metal body -->
    <linearGradient id="camBody" x1="64" y1="30" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f8f8fa"/>
      <stop offset="0.14" stop-color="#ececf1"/>
      <stop offset="0.58" stop-color="#d8d9e1"/>
      <stop offset="0.92" stop-color="#bfc1cb"/>
      <stop offset="1.00" stop-color="#989aa6"/>
    </linearGradient>

    <!-- Fine horizontal brushed aluminum grain -->
    <pattern id="camGrain" width="16" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="1" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="0" y="1.6" width="16" height="0.8" fill="#5c606a" fill-opacity="0.06"/>
    </pattern>

    <!-- Cylindrical chrome handgrip & shutter button -->
    <linearGradient id="chromeGrip" x1="16" y1="68" x2="31" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#525660"/>
      <stop offset="0.28" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#cfd3de"/>
      <stop offset="0.84" stop-color="#686d78"/>
      <stop offset="1.00" stop-color="#9ea3b0"/>
    </linearGradient>

    <!-- Spun-chrome telescoping lens barrel rings -->
    <linearGradient id="lensChrome" x1="40" y1="42" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#eef0f6"/>
      <stop offset="0.48" stop-color="#9ea3b0"/>
      <stop offset="0.68" stop-color="#3e424c"/>
      <stop offset="0.86" stop-color="#d8dce6"/>
      <stop offset="1.00" stop-color="#757a86"/>
    </linearGradient>

    <!-- Multi-coated sapphire-cyan optical glass objective (sampled i-006.png loupe!) -->
    <radialGradient id="opticGlass" cx="72" cy="76" r="21" fx="74" fy="79" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#bdf4ff"/>
      <stop offset="0.32" stop-color="#3586eb"/>
      <stop offset="0.68" stop-color="#103285"/>
      <stop offset="0.90" stop-color="#071544"/>
      <stop offset="1.00" stop-color="#030920"/>
    </radialGradient>

    <!-- Crystalline Xenon flash reflector -->
    <linearGradient id="xenonFlash" x1="78" y1="38" x2="106" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#dceeff"/>
      <stop offset="0.68" stop-color="#9ab4d0"/>
      <stop offset="1.00" stop-color="#f2f8ff"/>
    </linearGradient>
  </defs>

  <!-- Grounded two-layer floor shadow -->
  <ellipse cx="64" cy="111.5" rx="51" ry="6.2" fill="#000614" fill-opacity="0.32" filter="url(#floorBlur)"/>
  <rect x="17" y="107.8" width="94" height="4.2" rx="2.0" fill="#000614" fill-opacity="0.48" filter="url(#contactBlur)"/>

  <!-- Top Chrome Shutter Release Button & Mode Dial (y=24..31) -->
  <rect x="24.0" y="24.8" width="16.0" height="6.5" rx="2.0" fill="url(#chromeGrip)" stroke="#525660" stroke-width="0.7"/>
  <line x1="25.5" y1="25.8" x2="38.5" y2="25.8" stroke="#ffffff" stroke-width="1.0"/>
  <rect x="45.5" y="27.2" width="11.0" height="4.0" rx="1.2" fill="#7c808c" stroke="#484c56" stroke-width="0.6"/>

  <!-- Main Brushed-Aluminum Camera Body (x=13..115, y=30..108, rx=7.5) -->
  <rect x="13.0" y="30.0" width="102.0" height="78.0" rx="7.5" fill="url(#camBody)" stroke="#686c78" stroke-width="0.9"/>
  <rect x="13.0" y="30.0" width="102.0" height="78.0" rx="7.5" fill="url(#camGrain)"/>

  <!-- Overhead sunlit top bevel -->
  <path d="M 14.5,101.0 L 14.5,37.5 C 14.5,33.6 17.2,31.3 21.0,31.3 L 107.0,31.3 C 110.8,31.3 113.5,33.6 113.5,37.5 L 113.5,101.0"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.90"/>

  <!-- Sculpted Vertical Chrome Handgrip Bar on Left Side (x=17.5..29.5, y=35..103) -->
  <rect x="18.0" y="35.5" width="11.5" height="67.0" rx="5.5" fill="url(#chromeGrip)" stroke="#5e626e" stroke-width="0.75"/>
  <line x1="21.2" y1="38.0" x2="21.2" y2="100.0" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Optical Viewfinder Window & Self-Timer Red LED + Ribbed Crystalline Xenon Flash -->
  <rect x="52.5" y="38.5" width="11.0" height="8.5" rx="1.6" fill="#182238" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="56.5" cy="41.8" r="1.8" fill="#88c8ff" opacity="0.75"/>
  <circle cx="44.5" cy="43.0" r="2.1" fill="#e02828" stroke="#781010" stroke-width="0.5"/>
  <circle cx="44.0" cy="42.4" r="0.7" fill="#ffb8b8"/>

  <!-- Xenon Flash Prism Window (x=77.5..106.5, y=38.0..48.5) -->
  <rect x="77.5" y="38.0" width="29.0" height="10.5" rx="2.2" fill="url(#xenonFlash)" stroke="#586272" stroke-width="0.8"/>
  <g stroke="#6c829e" stroke-width="0.6" opacity="0.65">
    <line x1="82.5" y1="38.5" x2="82.5" y2="48.0"/>
    <line x1="87.5" y1="38.5" x2="87.5" y2="48.0"/>
    <line x1="92.5" y1="38.5" x2="92.5" y2="48.0"/>
    <line x1="97.5" y1="38.5" x2="97.5" y2="48.0"/>
    <line x1="102.5" y1="38.5" x2="102.5" y2="48.0"/>
  </g>
  <rect x="81.0" y="41.5" width="22.0" height="3.5" rx="1.2" fill="#ffffff" opacity="0.85"/>

  <!-- Telescoping 3D Spun-Chrome & Black-Anodized Optical Lens Assembly (cx=69.5, cy=71.5) -->
  <!-- Cast shadow of protruding barrel onto aluminum body -->
  <circle cx="71.0" cy="74.5" r="29.5" fill="#000614" fill-opacity="0.36" filter="url(#lensShadow)"/>

  <!-- Outer spun-chrome mount ring -->
  <circle cx="69.5" cy="71.5" r="29.0" fill="url(#lensChrome)" stroke="#484c58" stroke-width="0.85"/>
  <circle cx="69.5" cy="71.5" r="28.0" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.85"/>

  <!-- Recessed dark-anodized knurled barrel step (sampled i-006.png black loupe ring!) -->
  <circle cx="69.5" cy="71.5" r="23.5" fill="#1b1d24" stroke="#9ea4b2" stroke-width="0.8"/>
  <!-- Inner bright chrome aperture ring -->
  <circle cx="69.5" cy="71.5" r="19.2" fill="url(#lensChrome)" stroke="#12141a" stroke-width="0.9"/>

  <!-- Deep Multi-Coated Sapphire-Cyan Optical Glass Element -->
  <circle cx="69.5" cy="71.5" r="16.2" fill="url(#opticGlass)" stroke="#081230" stroke-width="0.9"/>
  <!-- Subtle internal iris blades ring -->
  <circle cx="69.5" cy="71.5" r="9.5" fill="none" stroke="#4ca2ff" stroke-width="0.65" stroke-opacity="0.38"/>
  <!-- Crisp curved upper-left optical coating specular crescent + tiny lower-right pinpoint -->
  <ellipse cx="64.5" cy="64.0" rx="8.2" ry="4.4" fill="#ffffff" fill-opacity="0.68" transform="rotate(-28 64.5 64.0)"/>
  <circle cx="75.8" cy="78.2" r="2.2" fill="#d8f8ff" fill-opacity="0.72"/>
</svg>
