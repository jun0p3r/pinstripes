<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="opDrop" x="-25%" y="-25%" width="150%" height="155%">
      <feGaussianBlur stdDeviation="3.0"/>
    </filter>
    <linearGradient id="opRim" x1="64" y1="10" x2="64" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e5e9f0"/>
      <stop offset="0.52" stop-color="#9ca3b0"/>
      <stop offset="0.78" stop-color="#eef1f6"/>
      <stop offset="1.00" stop-color="#858c99"/>
    </linearGradient>
    <linearGradient id="opBlue" x1="64" y1="20" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#70c0ff"/>
      <stop offset="0.42" stop-color="#0e6ee0"/>
      <stop offset="0.80" stop-color="#1e88f5"/>
      <stop offset="1.00" stop-color="#8ae0ff"/>
    </linearGradient>
    <radialGradient id="opPlate" cx="64" cy="56" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#e6e9ef"/>
      <stop offset="1.00" stop-color="#c2c7d2"/>
    </radialGradient>
    <linearGradient id="opKey" x1="64" y1="36" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#14171c"/>
      <stop offset="0.50" stop-color="#383d47"/>
      <stop offset="1.00" stop-color="#1e2229"/>
    </linearGradient>
    <linearGradient id="opShine" x1="64" y1="18" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <clipPath id="opBlueClip"><circle cx="64" cy="62" r="42"/></clipPath>
  </defs>
  <circle cx="64" cy="65.5" r="50" fill="#071530" fill-opacity="0.36" filter="url(#opDrop)"/>
  <!-- Sculpted Spun-Silver Outer Bezel -->
  <circle cx="64" cy="62" r="51" fill="url(#opRim)" stroke="#686f7d" stroke-width="0.85"/>
  <circle cx="64" cy="62" r="44.2" fill="#464d59"/>
  <!-- Glossy Aqua Blue Ring -->
  <g clip-path="url(#opBlueClip)">
    <circle cx="64" cy="62" r="42" fill="url(#opBlue)"/>
    <path d="M 16,16 H 112 V 50 Q 64,62 16,50 Z" fill="url(#opShine)"/>
  </g>
  <circle cx="64" cy="62" r="42" fill="none" stroke="#083d8a" stroke-width="0.9"/>
  <!-- Satin White Inner Lock Core & Notched Keyhole -->
  <circle cx="64" cy="62" r="32.5" fill="url(#opPlate)" stroke="#7c8494" stroke-width="0.85"/>
  <circle cx="64" cy="62" r="14.5" fill="#d8dde6" stroke="#b5bcc9" stroke-width="0.8"/>
  <!-- Crisp Bevelled 1Password Keyhole -->
  <path d="M56.5,36.5 H71.5 V65 L66.8,69.5 L71.5,74 V87.5 H56.5 V59 L61.2,54.5 L56.5,50 Z" fill="#ffffff" transform="translate(0, 1.2)"/>
  <path d="M56.5,36.5 H71.5 V65 L66.8,69.5 L71.5,74 V87.5 H56.5 V59 L61.2,54.5 L56.5,50 Z" fill="url(#opKey)"/>
</svg>
