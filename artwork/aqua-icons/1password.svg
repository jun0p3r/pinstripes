  <circle cx="64" cy="60.5" r="17.2" fill="#f4f6fa" stroke="#9aa0ad" stroke-width="0.7"/>
  <!-- Iconic 1Password vertical keyhole with side notches -->
  <path d="M59.2,45.5 H68.8 V55.5 L66.2,58.0 L68.8,60.5 V75.5 H59.2 V65.5 L61.8,63.0 L59.2,60.5 Z" fill="#ffffff" transform="translate(0, 1.1)"/>
  <path d="M59.2,45.5 H68.8 V55.5 L66.2,58.0 L68.8,60.5 V75.5 H59.2 V65.5 L61.8,63.0 L59.2,60.5 Z" fill="url(#keyWell)"/>
