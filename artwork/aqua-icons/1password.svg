    <line x1="83.10" y1="27.42" x2="84.60" y2="24.82" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="89.81" y1="34.69" x2="93.13" y2="31.37" stroke="#2b3038" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="97.08" y1="41.40" x2="99.68" y2="39.90" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
