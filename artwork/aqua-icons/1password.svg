<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="vaultHousing" x1="20" y1="12" x2="108" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#d8dce4"/>
      <stop offset="0.45" stop-color="#8b919c"/>
      <stop offset="0.60" stop-color="#343942"/>
      <stop offset="0.82" stop-color="#e4e8f0"/>
      <stop offset="1.00" stop-color="#7c828d"/>
    </linearGradient>
    <linearGradient id="dialPlate" x1="64" y1="18" x2="64" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fafbfd"/>
      <stop offset="0.45" stop-color="#e3e6ed"/>
      <stop offset="0.88" stop-color="#c2c7d1"/>
      <stop offset="1.00" stop-color="#d8dce5"/>
    </linearGradient>
    <linearGradient id="sapphireRing" x1="64" y1="28" x2="64" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#051657"/>
      <stop offset="0.25" stop-color="#1449b3"/>
      <stop offset="0.62" stop-color="#2c84ec"/>
      <stop offset="0.90" stop-color="#8ce2ff"/>
      <stop offset="1.00" stop-color="#e6fbff"/>
    </linearGradient>
    <linearGradient id="keyWell" x1="64" y1="42" x2="64" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#15181e"/>
      <stop offset="0.65" stop-color="#282e38"/>
      <stop offset="1.00" stop-color="#454e5e"/>
    </linearGradient>
    <linearGradient id="ringLens" x1="64" y1="29" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="112.5" rx="45" ry="6.0" fill="#050b18" fill-opacity="0.33" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="110.2" rx="28" ry="3.2" fill="#000000" fill-opacity="0.48" filter="url(#contactBlur)"/>

