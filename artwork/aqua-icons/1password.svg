    <line x1="38.19" y1="86.31" x2="34.87" y2="89.63" stroke="#2b3038" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="30.92" y1="79.60" x2="28.32" y2="81.10" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="27.10" y1="70.39" x2="24.20" y2="71.16" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="27.50" y1="60.50" x2="22.80" y2="60.50" stroke="#2b3038" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="27.10" y1="50.61" x2="24.20" y2="49.84" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="30.92" y1="41.40" x2="28.32" y2="39.90" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="38.19" y1="34.69" x2="34.87" y2="31.37" stroke="#2b3038" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="44.90" y1="27.42" x2="43.40" y2="24.82" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="54.11" y1="23.60" x2="53.34" y2="20.70" stroke="#2b3038" stroke-width="0.9" stroke-linecap="round"/>
