<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="oceanGlass" x1="64" y1="13" x2="64" y2="107" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#030a38"/>
      <stop offset="0.18" stop-color="#0b2680"/>
      <stop offset="0.52" stop-color="#1e62d0"/>
      <stop offset="0.82" stop-color="#58b4fa"/>
      <stop offset="1.00" stop-color="#dcfaff"/>
    </linearGradient>
    <radialGradient id="oceanCaustic" cx="64" cy="96" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#8be6ff" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#1e62d0" stop-opacity="0.00"/>
    </radialGradient>
    <linearGradient id="continent" x1="50" y1="22" x2="76" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#a8f0c6"/>
      <stop offset="0.55" stop-color="#52be98"/>
      <stop offset="1.00" stop-color="#2a8678"/>
    </linearGradient>
    <linearGradient id="foxFur" x1="20" y1="26" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffcf54"/>
      <stop offset="0.28" stop-color="#ff8a1e"/>
      <stop offset="0.64" stop-color="#dc3e0b"/>
      <stop offset="0.90" stop-color="#9c1c06"/>
      <stop offset="1.00" stop-color="#cc380c"/>
    </linearGradient>
    <linearGradient id="foxTail" x1="48" y1="48" x2="115" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff4a8"/>
      <stop offset="0.26" stop-color="#ffc238"/>
      <stop offset="0.62" stop-color="#f26612"/>
      <stop offset="1.00" stop-color="#b82908"/>
    </linearGradient>
    <linearGradient id="tailTip" x1="88" y1="30" x2="114" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fff3b8"/>
      <stop offset="1.00" stop-color="#ffb52e"/>
    </linearGradient>
    <linearGradient id="topLens" x1="64" y1="15" x2="64" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="64" cy="60" r="46.5"/></clipPath>
  </defs>
  <!-- Grounded floor shadow + warm amber caustic -->
  <ellipse cx="64" cy="112.5" rx="45" ry="6.2" fill="#060c1f" fill-opacity="0.33" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="110.2" rx="28" ry="3.2" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>
  <ellipse cx="68" cy="112.5" rx="22" ry="3.2" fill="#ff7a18" fill-opacity="0.25" filter="url(#softGlow)"/>

  <!-- Sapphire Aqua Globe -->
  <g clip-path="url(#globeClip)">
    <circle cx="64" cy="60" r="46.5" fill="url(#oceanGlass)"/>
    <circle cx="64" cy="60" r="46.5" fill="url(#oceanCaustic)"/>
    <!-- Subtle sunlit continents visible in northern hemisphere -->
    <path d="M44,24 C52,20 66,21 73,27 C77,31 74,39 68,42 C61,45 58,52 52,54 C45,55 40,46 42,38 Z" fill="url(#continent)" fill-opacity="0.58"/>
    <path d="M78,30 C86,28 96,35 97,45 C95,52 86,54 81,48 C77,43 75,35 78,30 Z" fill="url(#continent)" fill-opacity="0.48"/>
    <!-- Internal glass specular lens -->
    <ellipse cx="64" cy="30" rx="34" ry="16" fill="url(#topLens)"/>
  </g>
  <circle cx="64" cy="60" r="46.5" fill="none" stroke="#10367d" stroke-width="0.9" stroke-opacity="0.65"/>

  <!-- Fox cast shadow across ocean globe -->
  <path d="M26,38 C15,56 18,86 42,101 C68,115 103,103 111,75 C115,59 109,43 99,36 C103,50 96,65 82,71 C68,77 51,73 45,60 C49,56 56,55 60,51 C55,46 49,45 45,42 L42,27 L33,34 Z" fill="#04102e" fill-opacity="0.42" transform="translate(1.5,2.6)" filter="url(#softGlow)"/>

  <!-- Sculpted 3D Fox Body, Head & Sweeping Plume Tail -->
  <!-- Dark ear & snout backing -->
  <path d="M27,24 L37,33 L25,40 Z" fill="#5c1406"/>
  <path d="M40,21 L46,35 L35,36 Z" fill="#7a1b08"/>
  <!-- Main sweeping fox body & head -->
  <path d="M25,38 C14,56 17,86 42,101 C68,115 105,103 112,72 C115,57 109,41 98,33 C101,46 95,59 84,65 C91,56 92,45 87,38 C86,49 77,60 64,63 C52,65 43,58 43,50 C48,51 56,49 60,44 C56,41 49,40 45,36 C43,32 42,25 40,22 L33,31 C29,33 27,35 25,38 Z" fill="url(#foxFur)" stroke="#6e1805" stroke-width="0.85" stroke-opacity="0.72"/>
  <!-- Cream cheek & snout highlight -->
  <path d="M43,49 C48,51 55,49 59,44 C55,42 50,42 46,40 C43,43 42,46 43,49 Z" fill="#fff6d6" fill-opacity="0.92"/>
  <circle cx="60" cy="43.8" r="1.9" fill="#1b1412"/>
  <!-- Lush sculpted plume tail overlapping lower-right -->
  <path d="M50,86 C68,94 92,86 102,68 C108,57 107,43 98,33 C110,42 115,59 111,75 C104,101 73,112 47,102 C41,99 44,89 50,86 Z" fill="url(#foxTail)"/>
  <!-- Bright cream-gold flame tip of tail -->
  <path d="M98,33 C108,42 112,55 108,67 C104,58 102,52 95,48 C99,44 100,38 98,33 Z" fill="url(#tailTip)"/>
  <!-- Sunlit top rim bevel along head & tail crest -->
  <path d="M27,37 C31,32 36,28 40,23 M98,34 C108,43 113,57 110,72" fill="none" stroke="#fff9d2" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.78"/>
</svg>
