<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 10.2 Universal Access / Accessibility KCM: Spun-Chrome & Sapphire Aqua Glass Medallion -->
    <filter id="floorBlur" x="-30%" y="-45%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="causticGlow" x="-35%" y="-45%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="figShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>

    <linearGradient id="chromeRing" x1="16" y1="12" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#eef0f6"/>
      <stop offset="0.48" stop-color="#aeb4c0"/>
      <stop offset="0.68" stop-color="#646874"/>
      <stop offset="0.86" stop-color="#d4d8e2"/>
      <stop offset="1.00" stop-color="#848894"/>
    </linearGradient>

    <linearGradient id="sapphireDome" x1="64" y1="16" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#030a38"/>
      <stop offset="0.18" stop-color="#0d2982"/>
      <stop offset="0.48" stop-color="#2060d4"/>
      <stop offset="0.78" stop-color="#58a8fa"/>
      <stop offset="0.93" stop-color="#b4ecff"/>
      <stop offset="1.00" stop-color="#f2feff"/>
    </linearGradient>

    <radialGradient id="bottomCaustic" cx="64" cy="96" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.32" stop-color="#c4f0ff" stop-opacity="0.72"/>
      <stop offset="1.00" stop-color="#1854c8" stop-opacity="0.0"/>
    </radialGradient>

    <linearGradient id="topLens" x1="64" y1="17.5" x2="64" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="0.38" stop-color="#dbf0ff" stop-opacity="0.30"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <circle id="uaDome" cx="64" cy="60" r="43.8"/>
    <clipPath id="clipUa">
      <use href="#uaDome"/>
    </clipPath>

    <!-- Sculpted Vitruvian Outstretched Universal Access Figure -->
    <g id="vitruvian">
      <circle cx="64" cy="36.5" r="6.4"/>
      <path d="M 38.0,48.5 Q 64.0,52.5 90.0,48.5" fill="none" stroke-width="5.2" stroke-linecap="round"/>
      <line x1="64.0" y1="45.5" x2="64.0" y2="68.5" stroke-width="6.4" stroke-linecap="round"/>
      <line x1="63.0" y1="67.0" x2="50.5" y2="90.5" stroke-width="5.4" stroke-linecap="round"/>
      <line x1="65.0" y1="67.0" x2="77.5" y2="90.5" stroke-width="5.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Overhead floor shadow + sapphire caustic -->
  <ellipse cx="64" cy="113.2" rx="37" ry="5.8" fill="#020a28" fill-opacity="0.34" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="112.6" rx="20" ry="3.2" fill="#3894ff" fill-opacity="0.28" filter="url(#causticGlow)"/>

  <!-- Spun-Chrome Medallion Ring -->
  <circle cx="64" cy="60" r="49.0" fill="url(#chromeRing)" stroke="#585c68" stroke-width="0.85"/>
  <path d="M 16.4,54.0 A 48.0,48.0 0 0 1 111.6,54.0" fill="none" stroke="#ffffff" stroke-width="1.35" opacity="0.92"/>
  <circle cx="64" cy="60" r="44.8" fill="#464a56"/>

  <!-- Royal-Sapphire Aqua Glass Dome -->
  <use href="#uaDome" fill="url(#sapphireDome)"/>

  <g clip-path="url(#clipUa)">
    <rect x="18" y="15" width="92" height="92" fill="url(#bottomCaustic)"/>
    <!-- Subtle inner Vitruvian orbital circle -->
    <circle cx="64" cy="62" r="33.5" fill="none" stroke="#aee8ff" stroke-width="1.3" stroke-opacity="0.45"/>

    <!-- 3D Cast Shadow + Crisp Pearl-White Universal Access Figure -->
    <g transform="translate(1.0, 2.6)" fill="#061654" stroke="#061654" opacity="0.48" filter="url(#figShadow)">
      <use href="#vitruvian"/>
    </g>
    <g fill="#ffffff" stroke="#ffffff">
      <use href="#vitruvian"/>
    </g>

    <ellipse cx="64" cy="32.5" rx="31.5" ry="14.8" fill="url(#topLens)"/>
  </g>

  <use href="#uaDome" fill="none" stroke="#123888" stroke-width="0.85" stroke-opacity="0.65"/>
</svg>
