<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="metalRoller" x1="12" y1="16" x2="116" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#6e737d"/>
      <stop offset="0.22" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#cfd4de"/>
      <stop offset="0.85" stop-color="#5c616b"/>
      <stop offset="1.00" stop-color="#aeb4c0"/>
    </linearGradient>
    <linearGradient id="screenCanvas" x1="64" y1="24" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f7f8fc"/>
      <stop offset="1.00" stop-color="#dfe3ec"/>
    </linearGradient>
    <linearGradient id="impressOrange" x1="22" y1="27" x2="106" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffb85c"/>
      <stop offset="0.50" stop-color="#ed6b14"/>
      <stop offset="1.00" stop-color="#a83b06"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="113.5" rx="42" ry="5.5" fill="#140c06" fill-opacity="0.32" filter="url(#floorBlur)"/>

  <!-- Chrome tripod stand legs behind screen -->
  <g stroke="#505560" stroke-width="4.2" stroke-linecap="round">
    <line x1="64" y1="86" x2="36" y2="111"/>
    <line x1="64" y1="86" x2="92" y2="111"/>
    <line x1="64" y1="12" x2="64" y2="112"/>
  </g>
  <g stroke="#eef1f7" stroke-width="1.5" stroke-linecap="round">
    <line x1="63.3" y1="86" x2="35.3" y2="110.5"/>
    <line x1="63.3" y1="86" x2="91.3" y2="110.5"/>
    <line x1="63.3" y1="12" x2="63.3" y2="111.5"/>
  </g>

  <!-- Projection screen shadow & canvas -->
  <rect x="17" y="22" width="94" height="69" rx="1.5" fill="#000000" fill-opacity="0.28" transform="translate(0, 3.5)" filter="url(#dropShadow)"/>
  <rect x="17" y="22" width="94" height="69" rx="1.5" fill="url(#screenCanvas)" stroke="#8d94a1" stroke-width="0.9"/>
  <!-- Tangerine slide header -->
  <rect x="21" y="26" width="86" height="12" rx="1" fill="url(#impressOrange)"/>
  <rect x="22" y="27" width="84" height="3.5" fill="#ffffff" fill-opacity="0.38"/>

  <!-- 3D Glossy Pie Chart + Readable Bullet Points on Slide -->
  <circle cx="44" cy="63" r="17" fill="#1f6ee0" stroke="#0d3e8a" stroke-width="0.7"/>
  <path d="M44,63 L44,46 A17,17 0 0,1 60.5,67 Z" fill="#ff841c" transform="translate(2, -1.5)" stroke="#9e3d06" stroke-width="0.7"/>
  <path d="M44,63 L59,68.5 A17,17 0 0,1 33,76 Z" fill="#24b85e" stroke="#0d6932" stroke-width="0.7"/>
  <ellipse cx="44" cy="53" rx="11" ry="5" fill="#ffffff" fill-opacity="0.35"/>

  <g fill="#d95c14">
    <circle cx="69" cy="50" r="2.1"/><circle cx="69" cy="62" r="2.1"/><circle cx="69" cy="74" r="2.1"/>
  </g>
  <g font-family="Luxi Sans, DejaVu Sans, sans-serif" font-size="5.6" font-weight="bold" fill="#2c3240">
    <text x="74" y="52">Overview</text>
    <text x="74" y="64">Growth</text>
    <text x="74" y="76">Roadmap</text>
  </g>

  <!-- Top & bottom spun-chrome roller bars -->
  <rect x="12" y="16" width="104" height="7.5" rx="3.5" fill="url(#metalRoller)" stroke="#4c515c" stroke-width="0.85"/>
  <rect x="14" y="89" width="100" height="5.0" rx="2.5" fill="url(#metalRoller)" stroke="#4c515c" stroke-width="0.8"/>
</svg>
