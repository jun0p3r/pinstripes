<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="sheetShadow" x="-25%" y="-20%" width="150%" height="155%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="curlShadow" x="-35%" y="-35%" width="175%" height="185%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    
    <linearGradient id="higSheet" x1="22" y1="10" x2="102" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#dcdfe6"/>
      <stop offset="0.36" stop-color="#edf0f5"/>
      <stop offset="0.76" stop-color="#fbfcfe"/>
      <stop offset="1.00" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="curlFlap" x1="75" y1="38" x2="96" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f5f7fb"/>
      <stop offset="1.00" stop-color="#cfd5e0"/>
    </linearGradient>
    <path id="docOutline" d="M23,10 H72 C77,10 82,12.5 88,18.5 L99.5,30 C103.5,34 106,38.5 106,44 V115 H23 Z"/>
    <clipPath id="docClip"><use href="#docOutline"/></clipPath>

    
    <linearGradient id="zipBrass" x1="50" y1="58" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#fff5b0"/><stop offset="0.50" stop-color="#dfa426"/><stop offset="1.00" stop-color="#805306"/>
    </linearGradient>

  </defs>
  <!-- HIG i-004 / i-014 Document Drop Shadow -->
  <use href="#docOutline" fill="#000000" fill-opacity="0.28" transform="translate(0, 3.2)" filter="url(#sheetShadow)"/>
  <ellipse cx="64.5" cy="116.5" rx="39" ry="3.4" fill="#000000" fill-opacity="0.24" filter="url(#floorBlur)"/>

  <!-- Satin White Document Body -->
  <use href="#docOutline" fill="url(#higSheet)" stroke="#a6acb6" stroke-width="0.85"/>
  <g clip-path="url(#docClip)">
    <!-- Subtle inner sunlit left/bottom edge highlight -->
    <polyline points="24,11 24,114 105,114" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85"/>
    
    <!-- Recessed dark zipper cloth channel down sheet -->
    <rect x="53" y="11" width="14" height="75" rx="2" fill="#2c3240"/>
    <!-- Interlocking spun-chrome zipper teeth -->
    <g fill="#eef2f8" stroke="#535a69" stroke-width="0.5">
      <rect x="54.5" y="15" width="5.5" height="3.2" rx="0.6"/><rect x="60.2" y="19.5" width="5.5" height="3.2" rx="0.6"/>
      <rect x="54.5" y="24" width="5.5" height="3.2" rx="0.6"/><rect x="60.2" y="28.5" width="5.5" height="3.2" rx="0.6"/>
      <rect x="54.5" y="33" width="5.5" height="3.2" rx="0.6"/><rect x="60.2" y="37.5" width="5.5" height="3.2" rx="0.6"/>
      <rect x="54.5" y="42" width="5.5" height="3.2" rx="0.6"/><rect x="60.2" y="46.5" width="5.5" height="3.2" rx="0.6"/>
      <rect x="54.5" y="51" width="5.5" height="3.2" rx="0.6"/><rect x="60.2" y="55.5" width="5.5" height="3.2" rx="0.6"/>
    </g>
    <!-- Sculpted 3D Brass Zipper Slider & Pull Ring -->
    <rect x="51" y="57" width="18" height="15" rx="3" fill="url(#zipBrass)" stroke="#633e04" stroke-width="0.8"/>
    <path d="M56,69 H64 L66,85 Q60,88 54,85 Z" fill="url(#zipBrass)" stroke="#633e04" stroke-width="0.8"/>
    <circle cx="60" cy="80" r="2.8" fill="#ffffff" stroke="#633e04" stroke-width="0.6"/>

    <text x="64.5" y="106.5" text-anchor="middle" font-family="Luxi Sans, DejaVu Sans, sans-serif" font-weight="bold" font-size="13.5" letter-spacing="0.6" fill="#4b4f57">ZIP</text>
    <!-- Cast crescent shadow underneath top-right 3D curl -->
    <path d="M72,11 C76.5,22 76.5,34 75.5,41 C85,40.2 96.5,41.8 106,46.5 L106,41 L75,11 Z" fill="#3b404c" fill-opacity="0.45" filter="url(#curlShadow)"/>
  </g>

  <!-- Sculpted S-Curved 3D Dog-Ear Flap (sampled from HIG i-014.png) -->
  <path d="M72,10 C76.5,17 77.2,27.5 76.5,39.5 C87.5,38.8 97.5,40 106,44 C103,36.5 97.5,28 89.5,20 C83,13.5 77.5,10.5 72,10 Z" fill="url(#curlFlap)" stroke="#a6acb6" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
