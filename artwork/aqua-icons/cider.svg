<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    
    <filter id="floorBlur" x="-35%" y="-50%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
    <filter id="contactBlur" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="155%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>

    <linearGradient id="rubyGlass" x1="64" y1="17" x2="64" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#3b040c"/>
      <stop offset="0.18" stop-color="#800c1a"/>
      <stop offset="0.50" stop-color="#cf1d2e"/>
      <stop offset="0.80" stop-color="#f54e5a"/>
      <stop offset="1.00" stop-color="#ffdce0"/>
    </linearGradient>
    <radialGradient id="rubyCaustic" cx="64" cy="99" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.48" stop-color="#ff9aa2" stop-opacity="0.58"/>
      <stop offset="1.00" stop-color="#cf1d2e" stop-opacity="0.00"/>
    </radialGradient>
    <linearGradient id="emeraldLeaf" x1="66" y1="7" x2="88" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#c8ff9e"/>
      <stop offset="0.45" stop-color="#3ec434"/>
      <stop offset="1.00" stop-color="#146e18"/>
    </linearGradient>
    <linearGradient id="topSpec" x1="64" y1="19" x2="64" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <clipPath id="ciderClip"><circle cx="64" cy="63" r="45.5"/></clipPath>
  </defs>
  <ellipse cx="64" cy="113" rx="44" ry="5.8" fill="#240208" fill-opacity="0.33" filter="url(#floorBlur)"/>
  <ellipse cx="64" cy="110.5" rx="26" ry="3.0" fill="#000000" fill-opacity="0.46" filter="url(#contactBlur)"/>
  <ellipse cx="64" cy="113" rx="20" ry="3.0" fill="#ff2e42" fill-opacity="0.28" filter="url(#softGlow)"/>

  <!-- Wooden stem & glossy emerald Aqua leaf at crown -->
  <path d="M62.5,21 C62,14 64,9 67,6.5" fill="none" stroke="#6b3d16" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M65,19 C67,9 79,6 89,11 C86,20 75,24 65,19 Z" fill="url(#emeraldLeaf)" stroke="#125915" stroke-width="0.8"/>
  <path d="M67,17.5 C72,12 80,10.5 86.5,12" fill="none" stroke="#ffffff" stroke-width="1.0" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Ruby Aqua Glass Orb -->
  <g clip-path="url(#ciderClip)">
    <circle cx="64" cy="63" r="45.5" fill="url(#rubyGlass)"/>
    <circle cx="64" cy="63" r="45.5" fill="url(#rubyCaustic)"/>
    <!-- Subtle concentric vinyl/juice ripple rings -->
    <circle cx="64" cy="63" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.0"/>
    <circle cx="64" cy="63" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.0"/>
    <!-- Shadow behind white beamed music note -->
    <g transform="translate(1.2, 2.4)" fill="#4a050d" fill-opacity="0.48" filter="url(#fineBlur)">
      <path d="M52,44 L80,38 V72 C80,77.5 74.5,82 68.5,82 C63,82 59,78.5 59,74 C59,69.5 63.5,66 69,66 C71.5,66 73.5,66.6 75,67.6 V47.5 L57,51.5 V77 C57,82.5 51.5,87 45.5,87 C40,87 36,83.5 36,79 C36,74.5 40.5,71 46,71 C48.5,71 50.5,71.6 52,72.6 Z"/>
    </g>
    <!-- Crisp pure-white 3D beamed music note -->
    <path d="M52,44 L80,38 V72 C80,77.5 74.5,82 68.5,82 C63,82 59,78.5 59,74 C59,69.5 63.5,66 69,66 C71.5,66 73.5,66.6 75,67.6 V47.5 L57,51.5 V77 C57,82.5 51.5,87 45.5,87 C40,87 36,83.5 36,79 C36,74.5 40.5,71 46,71 C48.5,71 50.5,71.6 52,72.6 Z" fill="#ffffff"/>
    <!-- Top specular glass lens -->
    <ellipse cx="64" cy="34" rx="33" ry="15.5" fill="url(#topSpec)"/>
  </g>
  <circle cx="64" cy="63" r="45.5" fill="none" stroke="#660b14" stroke-width="0.9" stroke-opacity="0.68"/>
</svg>
