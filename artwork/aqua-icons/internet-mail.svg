<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sampled 10.2 Mail Perforated Sky-Blue Postage Stamp & Cancellation Postmark (HIG i-003.png top-3rd!) -->
    <filter id="stampShadow" x="-25%" y="-25%" width="155%" height="155%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>

    <linearGradient id="stampPaper" x1="20" y1="16" x2="108" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.70" stop-color="#f7f6f0"/>
      <stop offset="1.00" stop-color="#e5e2d6"/>
    </linearGradient>

    <!-- Sampled i-003.png Mail stamp sky-periwinkle field (#80a4e4 -> #5b82ce) -->
    <linearGradient id="stampBlue" x1="30" y1="24" x2="98" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8ab0ee"/>
      <stop offset="0.55" stop-color="#6990dc"/>
      <stop offset="1.00" stop-color="#5278c6"/>
    </linearGradient>

    <!-- Warm golden-chestnut hawk plumage gradient -->
    <linearGradient id="hawkWing" x1="60" y1="26" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#e5d0b2"/>
      <stop offset="0.32" stop-color="#9c7244"/>
      <stop offset="0.68" stop-color="#52361c"/>
      <stop offset="1.00" stop-color="#22160c"/>
    </linearGradient>

    <!-- Perforated postage stamp mask: white sheet minus 28 semicircular edge perforations! -->
    <mask id="perfMask">
      <rect x="0" y="0" width="128" height="128" fill="#000000"/>
      <rect x="20" y="16" width="88" height="86" rx="2" fill="#ffffff"/>
      <g fill="#000000">
        <!-- Top & bottom perforations (x=27..101 step 10.5) -->
        <circle cx="27.5" cy="16" r="3.1"/><circle cx="38.0" cy="16" r="3.1"/><circle cx="48.5" cy="16" r="3.1"/>
        <circle cx="59.0" cy="16" r="3.1"/><circle cx="69.5" cy="16" r="3.1"/><circle cx="80.0" cy="16" r="3.1"/>
        <circle cx="90.5" cy="16" r="3.1"/><circle cx="101.0" cy="16" r="3.1"/>
        <circle cx="27.5" cy="102" r="3.1"/><circle cx="38.0" cy="102" r="3.1"/><circle cx="48.5" cy="102" r="3.1"/>
        <circle cx="59.0" cy="102" r="3.1"/><circle cx="69.5" cy="102" r="3.1"/><circle cx="80.0" cy="102" r="3.1"/>
        <circle cx="90.5" cy="102" r="3.1"/><circle cx="101.0" cy="102" r="3.1"/>
        <!-- Left & right perforations (y=24..94 step 10) -->
        <circle cx="20" cy="24" r="3.1"/><circle cx="20" cy="34" r="3.1"/><circle cx="20" cy="44" r="3.1"/>
        <circle cx="20" cy="54" r="3.1"/><circle cx="20" cy="64" r="3.1"/><circle cx="20" cy="74" r="3.1"/>
        <circle cx="20" cy="84" r="3.1"/><circle cx="20" cy="94" r="3.1"/>
        <circle cx="108" cy="24" r="3.1"/><circle cx="108" cy="34" r="3.1"/><circle cx="108" cy="44" r="3.1"/>
        <circle cx="108" cy="54" r="3.1"/><circle cx="108" cy="64" r="3.1"/><circle cx="108" cy="74" r="3.1"/>
        <circle cx="108" cy="84" r="3.1"/><circle cx="108" cy="94" r="3.1"/>
      </g>
    </mask>
  </defs>

  <!-- Tilted -8.5 deg like i-003.png Mail Stamp -->
  <g transform="rotate(-8.5 64 59)">
    <!-- Soft paper drop shadow -->
    <rect x="22" y="19.5" width="85" height="83" rx="3" fill="#000a1e" fill-opacity="0.30" filter="url(#stampShadow)"/>

    <!-- Perforated White Stamp Body + Sky-Blue Printed Vignette -->
    <g mask="url(#perfMask)">
      <rect x="20" y="16" width="88" height="86" fill="url(#stampPaper)" stroke="#b8b4a6" stroke-width="1.2"/>
      <rect x="28.0" y="24.0" width="72.0" height="70.0" fill="url(#stampBlue)" stroke="#4266b2" stroke-width="0.7"/>

      <!-- Crisp white postage denomination '1.0' at upper-left (exact i-003.png!) -->
      <text x="33.5" y="40.5" font-family="Georgia, Liberation Serif, serif" font-size="14.5"
            fill="#ffffff" opacity="0.94">1.0</text>

      <!-- Soaring Golden-Chestnut Hawk with Spread Feathered Wings (sampled i-003.png!) -->
      <g>
        <!-- Upper spread wing -->
        <path d="M 67.5,56.0 C 63.0,45.0 64.5,31.0 70.5,24.5 C 74.5,29.5 76.8,41.0 75.5,53.5 Z" fill="url(#hawkWing)"/>
        <!-- Feather tip highlights on upper wing -->
        <path d="M 68.5,30.0 L 73.8,33.5 M 67.2,36.5 L 74.8,39.5 M 66.8,43.0 L 75.2,45.5"
              stroke="#f2dfc4" stroke-width="1.0" stroke-linecap="round" opacity="0.68"/>
        <!-- Hawk body, head & hooked beak facing right -->
        <path d="M 59.5,58.5 C 66.5,54.5 75.5,53.0 82.8,55.5 L 86.2,57.2 L 82.5,59.2 C 76.5,61.5 68.0,62.5 59.5,61.5 Z"
              fill="#422914"/>
        <!-- Fan tail feathers on left -->
        <polygon points="61.0,58.0 51.5,55.2 52.8,63.5 61.5,61.2" fill="#7c5630"/>
        <!-- Lower swept wing -->
        <path d="M 69.0,59.5 C 72.5,69.5 78.5,81.5 85.8,87.5 C 87.2,80.5 83.5,68.5 76.5,58.5 Z" fill="url(#hawkWing)"/>
        <path d="M 74.5,67.5 L 81.8,69.5 M 77.2,74.2 L 84.2,75.8"
              stroke="#e8d2b4" stroke-width="0.95" stroke-linecap="round" opacity="0.58"/>
      </g>
    </g>
  </g>

  <!-- Authentic Semi-Transparent Charcoal Ink Cancellation Postmark + Wavy Bars Over Lower-Left! -->
  <g opacity="0.62" fill="none" stroke="#222834">
    <circle cx="44.0" cy="80.0" r="24.5" stroke-width="1.35"/>
    <circle cx="44.0" cy="80.0" r="17.2" stroke-width="1.05"/>
    <text x="44.0" y="62.2" text-anchor="middle" font-family="Luxi Sans, DejaVu Sans, sans-serif"
          font-size="4.8" font-weight="700" fill="#222834" stroke="none" letter-spacing="0.7">PINSTRIPE MAIL</text>
    <text x="44.0" y="101.2" text-anchor="middle" font-family="Luxi Sans, DejaVu Sans, sans-serif"
          font-size="4.6" font-weight="700" fill="#222834" stroke="none" letter-spacing="0.6">AQUA 10.2</text>

    <!-- Wavy cancellation ink lines sweeping right -->
    <path d="M 64,71 Q 76,66 88,71 T 112,71" stroke-width="1.15"/>
    <path d="M 66,77 Q 78,72 90,77 T 114,77" stroke-width="1.15"/>
    <path d="M 66,83 Q 78,78 90,83 T 114,83" stroke-width="1.15"/>
    <path d="M 64,89 Q 76,84 88,89 T 112,89" stroke-width="1.15"/>
  </g>
</svg>
