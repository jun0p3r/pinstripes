<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft overhead wall shadow (HIG Fig. 11-12 / i-015.png left) -->
    <filter id="plateShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="rockerShadow" x="-50%" y="-30%" width="220%" height="200%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="kdeInner" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Brushed satin platinum wall plate (sampled i-015.png: #f7f7f8 -> #ededef -> #dcdde0) -->
    <linearGradient id="switchPlate" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#f9f9fa"/>
      <stop offset="0.22" stop-color="#f1f1f3"/>
      <stop offset="0.65" stop-color="#e5e6e8"/>
      <stop offset="0.94" stop-color="#dadbdc"/>
      <stop offset="1.00" stop-color="#c6c8cc"/>
    </linearGradient>

    <!-- Ultra-fine horizontal brushed metal micro-grain -->
    <pattern id="brushedGrain" width="16" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="1" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="0" y="1.5" width="16" height="0.8" fill="#6e7278" fill-opacity="0.05"/>
    </pattern>

    <!-- Slotted chrome corner screw dome -->
    <linearGradient id="screwDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c2c5cb"/>
      <stop offset="0.82" stop-color="#757980"/>
      <stop offset="1.00" stop-color="#4e5258"/>
    </linearGradient>

    <!-- 3D Protruding Satin-White Toggle Rocker Switch -->
    <linearGradient id="rockerUpper" x1="26.5" y1="50.5" x2="26.5" y2="62.5" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#b8bcc2"/>
      <stop offset="0.45" stop-color="#dcdfe4"/>
      <stop offset="1.00" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="rockerLower" x1="26.5" y1="62.5" x2="26.5" y2="75.0" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#f5f6f8"/>
      <stop offset="0.85" stop-color="#d8dbe0"/>
      <stop offset="1.00" stop-color="#b8bcc2"/>
    </linearGradient>
    <linearGradient id="rockerUnder" x1="26.5" y1="74.5" x2="26.5" y2="78.2" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8c9097"/>
      <stop offset="1.00" stop-color="#52565c"/>
    </linearGradient>

    <!-- Sampled 10.2 System Preferences 3D Slate-Graphite Aqua Glass Emblem (from i-015.png) -->
    <linearGradient id="graphiteGlass" x1="82" y1="36" x2="82" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#8a949c"/>
      <stop offset="0.32" stop-color="#68747d"/>
      <stop offset="0.72" stop-color="#4b5760"/>
      <stop offset="0.90" stop-color="#414c54"/>
      <stop offset="1.00" stop-color="#6b7882"/>
    </linearGradient>
    <radialGradient id="graphiteBounce" cx="84" cy="88" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#9cb0be" stop-opacity="0.52"/>
      <stop offset="0.65" stop-color="#60707c" stop-opacity="0.15"/>
      <stop offset="1.00" stop-color="#404c54" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="glassSpecular" x1="76" y1="36" x2="84" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.66"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Official KDE K + Cogwheel Geometry centered optically at (81.6, 64) -->
    <g id="kdeEmblem" transform="translate(-1.0, 1.2)">
      <!-- 7-tooth left/bottom KDE cogwheel arc with open inner ring -->
      <path d="M 74.2,42.2 L 69.2,44.0 L 67.8,49.4 C 65.8,50.5 64.1,52.0 62.7,53.8 L 57.5,52.3 L 54.8,57.2 L 59.0,60.8 C 58.5,63.0 58.5,65.4 59.0,67.6 L 54.8,71.2 L 57.5,76.1 L 62.7,74.6 C 64.1,76.4 65.8,77.9 67.8,79.0 L 69.2,84.4 L 74.2,86.2 L 75.8,80.9 C 78.0,81.4 80.4,81.4 82.6,80.9 L 84.2,86.2 L 89.2,84.4 L 87.6,79.0 C 89.6,77.9 91.4,76.3 92.8,74.4 L 88.0,70.8 C 85.9,73.9 82.3,75.9 78.2,75.9 C 71.6,75.9 66.2,70.6 66.2,64.0 C 66.2,57.6 71.2,52.4 77.6,52.1 L 77.6,46.2 C 76.4,46.2 75.3,46.4 74.2,46.7 Z"/>
      <!-- Bold KDE 'K' rising from the hub -->
      <path d="M 79.4,39.0 L 87.6,39.0 L 87.6,57.2 L 100.2,39.0 L 109.8,39.0 L 96.0,57.8 L 110.4,78.5 L 100.4,78.5 L 87.6,59.8 L 87.6,78.5 L 79.4,78.5 Z"/>
    </g>

    <clipPath id="clipKde">
      <use href="#kdeEmblem"/>
    </clipPath>
  </defs>

  <!-- Soft downward wall drop shadow -->
  <rect x="10.5" y="23.5" width="109" height="87.5" rx="2.5" fill="#000000" fill-opacity="0.30" filter="url(#plateShadow)"/>

  <!-- Main Brushed-Platinum Switch Plate (x=9..119, y=20..108, crisp machined corners rx=2.0) -->
  <rect x="9.0" y="20.0" width="110.0" height="88.0" rx="2.0" fill="url(#switchPlate)"/>
  <rect x="9.0" y="20.0" width="110.0" height="88.0" rx="2.0" fill="url(#brushedGrain)"/>

  <!-- Top & left bright white machined bevel + bottom & right dark metallic edge -->
  <path d="M 10.2,107.0 L 10.2,21.2 L 117.8,21.2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 10.0,106.8 L 117.8,106.8 L 117.8,21.0" fill="none" stroke="#96999f" stroke-width="1.3" stroke-linecap="square"/>
  <rect x="9.0" y="20.0" width="110.0" height="88.0" rx="2.0" fill="none" stroke="#7d8086" stroke-width="0.85"/>

  <!-- Vertical compartment seam at x=43.5 (matching i-015.png) -->
  <line x1="43.2" y1="20.6" x2="43.2" y2="107.4" stroke="#9699a0" stroke-width="1.0"/>
  <line x1="44.3" y1="20.8" x2="44.3" y2="106.6" stroke="#ffffff" stroke-width="1.1"/>

  <!-- 4 Slotted Chrome Plate Screws with varied natural slot angles (sampled i-015.png) -->
  <!-- Top-left screw (vertical slot) -->
  <g transform="translate(19.0, 30.0)">
    <circle cx="0" cy="0.6" r="4.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="-0.3" r="4.3" fill="#60646b"/>
    <circle cx="0" cy="0" r="3.8" fill="url(#screwDome)"/>
    <line x1="-0.3" y1="-3.3" x2="-0.3" y2="3.3" stroke="#2d3035" stroke-width="1.25"/>
    <line x1="0.7" y1="-3.1" x2="0.7" y2="3.1" stroke="#ffffff" stroke-width="0.65" opacity="0.75"/>
  </g>
  <!-- Bottom-left screw (horizontal slot) -->
  <g transform="translate(19.0, 98.0)">
    <circle cx="0" cy="0.6" r="4.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="-0.3" r="4.3" fill="#60646b"/>
    <circle cx="0" cy="0" r="3.8" fill="url(#screwDome)"/>
    <line x1="-3.3" y1="-0.2" x2="3.3" y2="-0.2" stroke="#2d3035" stroke-width="1.25"/>
    <line x1="-3.1" y1="0.8" x2="3.1" y2="0.8" stroke="#ffffff" stroke-width="0.65" opacity="0.75"/>
  </g>
  <!-- Top-right screw (-42° angled slot) -->
  <g transform="translate(109.0, 30.0)">
    <circle cx="0" cy="0.6" r="4.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="-0.3" r="4.3" fill="#60646b"/>
    <circle cx="0" cy="0" r="3.8" fill="url(#screwDome)"/>
    <g transform="rotate(-42)">
      <line x1="-3.3" y1="-0.2" x2="3.3" y2="-0.2" stroke="#2d3035" stroke-width="1.25"/>
      <line x1="-3.1" y1="0.8" x2="3.1" y2="0.8" stroke="#ffffff" stroke-width="0.65" opacity="0.75"/>
    </g>
  </g>
  <!-- Bottom-right screw (+42° angled slot) -->
  <g transform="translate(109.0, 98.0)">
    <circle cx="0" cy="0.6" r="4.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="0" cy="-0.3" r="4.3" fill="#60646b"/>
    <circle cx="0" cy="0" r="3.8" fill="url(#screwDome)"/>
    <g transform="rotate(42)">
      <line x1="-3.3" y1="-0.2" x2="3.3" y2="-0.2" stroke="#2d3035" stroke-width="1.25"/>
      <line x1="-3.1" y1="0.8" x2="3.1" y2="0.8" stroke="#ffffff" stroke-width="0.65" opacity="0.75"/>
    </g>
  </g>

  <!-- Left Compartment: Protruding 3D Light Switch & Soft Downward Cast Shadow -->
  <!-- Soft shadow cast onto brushed plate below & right of switch -->
  <ellipse cx="28.2" cy="80.8" rx="6.0" ry="8.8" fill="#000000" fill-opacity="0.26" filter="url(#rockerShadow)" transform="rotate(-10 28.2 80.8)"/>

  <!-- Recessed switch slot frame -->
  <rect x="20.6" y="48.0" width="11.8" height="31.5" rx="0.8" fill="#1b1d20"/>
  <path d="M 20.6,80.2 L 33.0,80.2 L 33.0,48.2" fill="none" stroke="#ffffff" stroke-width="1.0" opacity="0.9"/>
  <path d="M 32.4,48.0 L 20.6,48.0 L 20.6,79.5" fill="none" stroke="#70737a" stroke-width="0.9"/>

  <!-- 3D Protruding Satin-White Rocker Toggle -->
  <!-- Upper inward-sloped facet -->
  <rect x="22.8" y="50.5" width="7.4" height="12.0" fill="url(#rockerUpper)"/>
  <!-- Lower outward-angled facet catching overhead light -->
  <rect x="22.8" y="62.5" width="7.4" height="12.2" fill="url(#rockerLower)"/>
  <!-- Bottom shaded return thickness -->
  <rect x="22.8" y="74.7" width="7.4" height="3.3" fill="url(#rockerUnder)"/>
  <!-- Specular crest ridge across center of rocker -->
  <rect x="22.8" y="61.8" width="7.4" height="1.6" fill="#ffffff"/>
  <!-- Crisp subtle side highlights -->
  <line x1="23.2" y1="50.8" x2="23.2" y2="74.6" stroke="#ffffff" stroke-width="0.7" opacity="0.8"/>
  <line x1="30.2" y1="50.8" x2="30.2" y2="77.8" stroke="#62666d" stroke-width="0.6"/>

  <!-- Right Compartment: 3D Slate-Graphite Aqua Glass KDE K+Cogwheel Emblem -->
  <!-- Carved white bottom-right bevel in the silver plate -->
  <use href="#kdeEmblem" transform="translate(0.9, 1.3)" fill="#ffffff" opacity="0.92"/>
  <!-- Recessed dark top-left plate rim -->
  <use href="#kdeEmblem" transform="translate(-0.7, -0.8)" fill="#2a3136" opacity="0.82"/>

  <!-- Main slate-graphite glass body -->
  <use href="#kdeEmblem" fill="url(#graphiteGlass)"/>

  <g clip-path="url(#clipKde)">
    <!-- Internal bottom bounce light -->
    <rect x="52" y="36" width="62" height="54" fill="url(#graphiteBounce)"/>

    <!-- Smooth inner cushion shadow around emblem perimeter -->
    <use href="#kdeEmblem" fill="none" stroke="#1e252a" stroke-width="2.6" opacity="0.62" filter="url(#kdeInner)"/>

    <!-- Signature 10.2 S-curved glossy upper glass reflection (matching i-015.png Apple glass sheen!) -->
    <path d="M 52,36 L 114,36 L 114,51 C 96,52 80,60 66,70 L 52,70 Z" fill="url(#glassSpecular)"/>

    <!-- Delicate inner bottom-right rim highlight -->
    <use href="#kdeEmblem" transform="translate(-0.8, -0.9)" fill="none" stroke="#cad6df" stroke-width="0.9" opacity="0.45"/>
  </g>
</svg>
